name: Auto deploy Durood website to Firebase Hosting
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/firebase-hosting-auto.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  hosting:
    runs-on: ubuntu-latest
    env:
      FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with existing Firebase secret
        if: env.FIREBASE_CREDENTIALS != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
      - name: Authenticate through existing GitHub OIDC
        if: env.FIREBASE_CREDENTIALS == ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277153649028/locations/global/workloadIdentityPools/durood-github/providers/github-main
          service_account: github-firebase-deploy@durood-e-ibrahimi-global-c74e0.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate PWA Android launcher PNG icons
        run: |
          python3 -m pip install pillow
          python3 -c 'from PIL import Image; im=Image.open("public/tasbih-calligraphy.webp").convert("RGB"); [(im.resize((n,n),Image.Resampling.LANCZOS).save("public/icon-%d.png"%n)) for n in (192,512)]'
      - name: Publish existing web app only - never deploy Firestore rules
        run: |
          npm install --global firebase-tools@15
          firebase deploy --project durood-e-ibrahimi-global-c74e0 --only hosting --non-interactive
