name: Verify web app and Firebase backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML entrypoint
        run: |
          test -s public/index.html
          test -s public/styles.css
          test -s public/firebase-client.js
          test -s public/member-auth.js
          test -s public/spark-data.js
          test -s public/app.js
          test -s public/pwa.js
          test -s public/prayer-calendar-fix.css
          test -s public/qaza-model.js
          test -s public/qaza-firebase.js
          test -s public/service-worker.js
          test -s public/manifest.webmanifest
      - name: Check JavaScript syntax
        run: |
          node --check public/firebase-client.js
          node --check public/member-auth.js
          node --check public/spark-data.js
          node --check public/app.js
          node --check functions/index.js
          node --check functions/scripts/bootstrap-owner.mjs
          node --check functions/scripts/check-owner.mjs
          node --check functions/scripts/reset-test-owner.mjs
          node --check functions/scripts/prepare-gender-migration.cjs
          node --check public/community-pages.js
          node --check public/password-change.js
          node --check public/pwa.js
          node --check public/service-worker.js
          node --check public/wazaif.js
          node --check public/wazaif-counter.js
          node --check public/qaza-model.js
          node --check public/qaza-firebase.js
      - name: Install and smoke-test Firebase Functions
        run: |
          npm install --prefix functions --no-audit --no-fund
          node -e "const f=require('./functions'); const names=['registerMember','createInvitation','setMemberActive','updateMyProfile','recordRecitations','savePrayerDay','getPrayerMonth','getLeaderboard','getMyReferrals','getCommunitySummary']; for(const name of names){if(typeof f[name]!=='function') throw new Error('Missing callable: '+name);} console.log('All Firebase callable exports load successfully.')"
      - name: Check application contracts
        run: |
          node tests/contracts.test.cjs
          node tests/prayer-regressions.test.mjs
          bash -n scripts/cloud-shell-setup.sh
          bash -n scripts/spark-hosting.sh
          bash -n scripts/guard-firebase-rules.sh
          bash -n scripts/deploy-firestore-rules.sh
      - name: Browser-like navigation and Qaza form smoke tests
        run: |
          npm install --no-save --no-audit --no-fund jsdom@26
          node tests/ui-interaction.test.cjs
      - name: Check Firebase configuration
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('firebase.json'));if(!x.hosting||!x.firestore||!x.functions)process.exit(1);"
          grep -q 'durood-e-ibrahimi-global-c74e0' .firebaserc
          node -e "const f=require('fs');const html=f.readFileSync('public/index.html','utf8');if(!html.includes('/manifest.webmanifest')||!html.includes('./pwa.js'))process.exit(1);const man=JSON.parse(f.readFileSync('public/manifest.webmanifest'));if(man.display!=='standalone')process.exit(1);"

      - name: Report Firebase deployment authorization status
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_DEPLOY_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
        run: |
          if [ -n "$FIREBASE_DEPLOY_CREDENTIALS" ]; then
            echo "::notice::Firebase deployment authorization is configured in repository secrets."
          else
            echo "::notice::Firebase deployment authorization is missing; site cannot be deployed by GitHub Actions until it is connected."
          fi
