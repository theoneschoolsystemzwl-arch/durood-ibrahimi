name: Firebase Spark rules deployment (no Blaze)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - '.github/workflows/firebase-deploy.yml'
      - 'scripts/sync-dashboard-targets.mjs'
concurrency:
  group: firebase-spark-deploy
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate using configured GitHub secret
        if: env.FIREBASE_CREDENTIALS != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
      - name: Authenticate using keyless GitHub OIDC
        if: env.FIREBASE_CREDENTIALS == ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277153649028/locations/global/workloadIdentityPools/durood-github/providers/github-main
          service_account: github-firebase-deploy@durood-e-ibrahimi-global-c74e0.iam.gserviceaccount.com
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish Firestore rules through the official Rules API
        run: |
          python -m pip install --quiet google-auth requests
          python scripts/publish-firestore-rules.py
      - name: Seed verified shared dashboard targets using existing Firebase identity
        run: |
          python scripts/sync-dashboard-targets.py
      - name: Publish free Firebase Hosting on manual request
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm install --global firebase-tools@15
          firebase deploy --project durood-e-ibrahimi-global-c74e0 --only hosting --non-interactive
