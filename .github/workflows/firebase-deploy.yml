name: Manual Firebase Spark deployment (no Blaze)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Firebase authorization
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
        run: |
          if [ -z "$FIREBASE_CREDENTIALS" ]; then
            echo "::error::Firebase deployment permission is not connected. No deploy attempted."
            exit 1
          fi
      - name: Authorize Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish only free Hosting and Firestore security rules
        run: |
          npm install --global firebase-tools@15
          firebase deploy --project durood-e-ibrahimi-global-c74e0 --only hosting,firestore --non-interactive
