name: Auto-update Firebase website on Spark
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - '.github/workflows/firebase-hosting-spark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify deployment authorization
        id: access
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
        run: |
          if [ -n "$FIREBASE_CREDENTIALS" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Firebase Hosting is NOT live: deploy permission is missing. GitHub must not report a successful auto-deploy."
            exit 1
          fi
      - name: Authenticate to Google Cloud
        if: steps.access.outputs.authorized == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
      - name: Set up Node.js
        if: steps.access.outputs.authorized == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy website and protected data rules, no Cloud Functions or billing
        if: steps.access.outputs.authorized == 'true'
        run: |
          npm install -g firebase-tools@15
          firebase deploy --project durood-e-ibrahimi-global-c74e0 --only hosting,firestore --non-interactive
