name: Auto-update Firebase website on Spark
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'firestore.rules'
      - 'scripts/guard-firebase-rules.sh'
      - 'scripts/deploy-firestore-rules.sh'
      - 'tests/prayer-regressions.test.mjs'
      - 'tests/wazaif-regressions.test.mjs'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-spark.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: firebase-live-production
  cancel-in-progress: true
jobs:
  hosting:
    runs-on: ubuntu-latest
    env:
      FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Authenticate using configured GitHub secret
        if: env.FIREBASE_CREDENTIALS != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUROOD }}
      - name: Authenticate using keyless GitHub OIDC
        if: env.FIREBASE_CREDENTIALS == ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277153649028/locations/global/workloadIdentityPools/durood-github/providers/github-main
          service_account: github-firebase-deploy@durood-e-ibrahimi-global-c74e0.iam.gserviceaccount.com
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Wazifa JavaScript syntax and regression behavior
        run: |
          node --check public/wazaif.js
          node --check public/wazaif-counter.js
          node --check public/wazifa-sharing.js
          node tests/wazaif-regressions.test.mjs
          node tests/founder-group-code.test.cjs
          node tests/tasbih-durable-sync.test.cjs
          node tests/prayer-regressions.test.mjs
      - name: Detect Firestore rule changes
        id: rules_changed
        run: |
          if git diff --quiet HEAD^ HEAD -- firestore.rules; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Set up Java for changed rules
        if: steps.rules_changed.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test changed security rules before production deployment
        if: steps.rules_changed.outputs.changed == 'true'
        run: |
          npm install --no-save --no-audit --no-fund firebase@13.4.0 @firebase/rules-unit-testing@6
          npm install --global firebase-tools@15.22.1
          firebase emulators:exec --project demo-durood --only firestore --non-interactive "node tests/firestore-rules.cjs && node tests/wazaif-rules.cjs"
      - name: Set up Google Cloud SDK for Firebase rules comparison
        uses: google-github-actions/setup-gcloud@v2
      - name: Verify production Firestore rules are unchanged before update
        run: bash scripts/guard-firebase-rules.sh
      - name: Deploy tested Firestore rules with Firebase Rules API
        run: bash scripts/deploy-firestore-rules.sh
      - name: Deploy verified Wazaif website
        run: |
          npm install -g firebase-tools@15.22.1
          firebase deploy --project durood-e-ibrahimi-global-c74e0 --only hosting --non-interactive
