name: Validate Spark Firestore security
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'public/spark-data.js'
      - 'public/member-auth.js'
      - 'tests/firestore-rules.cjs'
      - '.github/workflows/spark-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'public/spark-data.js'
      - 'public/member-auth.js'
      - 'public/classic-app.html'
      - 'public/app.js'
      - 'tests/firestore-rules.cjs'
      - '.github/workflows/spark-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install free local rule-testing dependencies
        run: |
          npm install --no-save --no-audit --no-fund firebase@13.4.0 @firebase/rules-unit-testing@6
          npm install --global firebase-tools@15
      - name: Compile and test Firestore security with local emulator
        run: |
          firebase emulators:exec --project demo-durood --only firestore --non-interactive "node tests/firestore-rules.cjs"
