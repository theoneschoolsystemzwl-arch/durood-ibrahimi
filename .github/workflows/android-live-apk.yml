name: Build Urdu Durood Ibrahim Live APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-live/**'
      - '.github/workflows/android-live-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android icons from existing Muhammad tasbih
        run: |
          python3 -m pip install pillow
          python3 android-live/make_icons.py public/tasbih-calligraphy.webp android-live/app/src/main/res
      - name: Compile installable debug APK
        run: gradle -p android-live :app:assembleDebug --no-daemon
      - name: Publish APK file
        uses: actions/upload-artifact@v4
        with:
          name: Durood-Ibrahim-Urdu-Live-APK
          path: android-live/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable Android APK in private GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-live-${GITHUB_RUN_NUMBER}" \
            "android-live/app/build/outputs/apk/debug/app-debug.apk#Durood-Ibrahim-Live.apk" \
            --title "Durood Ibrahim Live APK ${GITHUB_RUN_NUMBER}" \
            --notes "Installable debug APK for the current Firebase-hosted Durood app. Web changes appear on next fresh launch/refresh." \
            --latest
