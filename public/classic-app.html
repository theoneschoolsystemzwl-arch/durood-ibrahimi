:root {
  color-scheme: light;
  --theme-hue:160;
  --theme-saturation:1;
  --theme-accent:44;
  --theme-accent-saturation:1;
  --emerald: hsl(calc(var(--theme-hue) + 6.34) calc(100.00% * var(--theme-saturation)) 19.80%);
  --deep: hsl(calc(var(--theme-hue) + 9.35) calc(100.00% * var(--theme-saturation)) 12.16%);
  --green: hsl(calc(var(--theme-hue) + 5.37) calc(100.00% * var(--theme-saturation)) 24.12%);
  --ink: #182c36;
  --muted: #506471;
  --paper: hsl(var(--theme-hue) 23% 97%);
  --line: hsl(calc(var(--theme-hue) - 10.0) calc(16.13% * var(--theme-saturation)) 87.84%);
  --mint: hsl(calc(var(--theme-hue) - 11.58) calc(57.58% * var(--theme-saturation)) 93.53%);
  --gold: hsl(calc(var(--theme-accent) - 2.77) calc(81.91% * var(--theme-accent-saturation)) 60.98%);
  --amber: #a64a00;
  --shadow: 0 7px 23px hsl(calc(var(--theme-hue) + 6.67) calc(55.56% * var(--theme-saturation)) 15.88% / 0.125);
  --ur: "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); font-size: 16px; line-height: 1.45; }
h1, h2, p, dl { margin: 0; }
h1, h2 { line-height: 1.2; }
small { font-size: .83rem; }
button, input, select, textarea { color: inherit; font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid #b67512; outline-offset: 3px; }
button, summary, input, select, textarea { -webkit-tap-highlight-color: transparent; }
.ur { direction: rtl; font-family: var(--ur); line-height: 1.9; }
.muted { color: var(--muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.field { display: grid; gap: 6px; color: #293e49; font-size: .93rem; font-weight: 650; min-width: 0; }
.field small { font-weight: 400; }
input, select, textarea {
  width: 100%; min-height: 47px; padding: 9px 12px; border: 1px solid hsl(calc(var(--theme-hue) + 15.0) calc(13.95% * var(--theme-saturation)) 83.14%);
  border-radius: 12px; background: #f5f8f9; color: var(--ink);
}
input::placeholder, textarea::placeholder { color: #647481; }
input[readonly] { background: #edf2f5; color: #485c69; }
input[type=checkbox] { width: 19px; min-height: 19px; height: 19px; accent-color: var(--green); flex: none; }
textarea { min-height: 80px; resize: vertical; }
.button {
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
  min-height: 44px; border-radius: 12px; border: 1px solid transparent; padding: 8px 14px;
  color: #fff; background: linear-gradient(115deg,hsl(calc(var(--theme-hue) + 6.96) calc(100.00% * var(--theme-saturation)) 18.04%),hsl(calc(var(--theme-hue) + 4.16) calc(100.00% * var(--theme-saturation)) 24.51%));
}
.button:hover { filter: brightness(1.08); }
.button.secondary { background: #fff; color: var(--deep); border-color: hsl(calc(var(--theme-hue) + 6.23) calc(91.04% * var(--theme-saturation)) 26.27%); }
.button.soft { background: #edf2f5; color: #2b4351; border-color: hsl(calc(var(--theme-hue) + 30.91) calc(18.64% * var(--theme-saturation)) 88.43%); }
.button:disabled { cursor: default; opacity: .5; }

<script>
'use strict';

let language = 'ur';
try { if (localStorage.getItem('durood-language') === 'ur') language = 'ur'; } catch {}
const tr = (english,urdu) => language === 'ur' ? urdu : english;
const locale = () => tr('en-GB','ur-PK');


const app = document.querySelector('#app');
const demoPassword = 'Demo1234';
const starterCode = 'k7m2r9';
const legacyStarterCode = '624813';
const recoveryCode = '418204';
const number = new Intl.NumberFormat('en');
let periods = [
  ['daily',tr("Daily", 'روزانہ')], ['weekly',tr("Weekly", 'ہفتہ وار')], ['monthly',tr("Monthly", 'ماہانہ')],
  ['annual',tr("Yearly", 'سالانہ')], ['all',tr("All time", 'ہمہ وقت')]
];
const demoNames = {'Demo Owner': 'آزمائشی مالک', 'Muhammad Hamza': 'محمد حمزہ', 'Aisha Noor': 'عائشہ نور', 'Abdullah Khan': 'عبداللہ خان', 'Fatima Zahra': 'فاطمہ زہرہ', 'Ali Hassan': 'علی حسن', 'Maryam Ahmed': 'مریم احمد', 'Umar Farooq': 'عمر فاروق', 'Zainab Ali': 'زینب علی', 'Ahmed Raza': 'احمد رضا', 'Sarah Yousuf': 'سارہ یوسف', 'Bilal Ahmed': 'بلال احمد', 'Mustafa Ali': 'مصطفیٰ علی'};
const seedRows = []; // All member profiles come from authenticated Firebase.
const offlineKey = 'durood-global-offline-reader-v1';
const stored = null; // Intentionally ignore earlier demo/test browser data.
const demoDay = stored?.demoDay || dateKey();
const reading = stored?.reading || {};
const attendance = stored?.attendance || {};
const qazaPlans = stored?.qazaPlans || {};
const prayerSettings = stored?.prayerSettings || {};
const memberThemes = stored?.themes || {};
const users = stored?.users?.map(person => ({...person,joined:new Date(person.joined)})) || seedRows.map(([name, username, inviter, daily], index) => ({
  id:index + 1, name, username, inviter, daily:Math.round(daily / 10), added:0, disabled:false, joined:new Date(2026,10,8 + index), age:'', birthDate:'', gender:'', phone:'', address:'', photo:''
}));
const passwords = new Map(stored?.passwords);
const sessionPasswords = new Map();
const invites = new Map(); // Real one-use invite codes come from Firebase.
const issuedInviteCodes = new Set();
let currentUserId = null;
let screen = 'login';
let section = 'overview';
let nextMemberId = stored?.nextMemberId || seedRows.length + 1;
let selectedPeriod = 'daily';
let record = 'current';
let groupFilter = null;
let profileId = null;
let recoveryUserId = null;
let photoDraft = null;
let pendingPhoto = null;
function currentPhotoSelection(){
  return pendingPhoto?.uid===currentUser()?.uid ? pendingPhoto : null;
}
let message = '';
const peekTimers = new WeakMap();
const communityGoal = 125000;
const demoAmounts = [11,33,7,21,16,9,25];
const recentSaves = [];
let joinDate = new Intl.DateTimeFormat(locale(),{numberingSystem:'latn',day:'numeric',month:'long',year:'numeric'});
const timeFormat = new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
let globalTotal = stored?.globalTotal ?? users.reduce((total,person) => total + score(person,'all','current'),0);
let liveAdded = stored?.liveAdded || 0;
let readingSession = {};
const paceFormat = new Intl.NumberFormat('en',{maximumFractionDigits:1});
let soundEnabled = false;
let soundContext;
for (const person of users) {
  if (person.daily && !readingFor(person.id).days[demoDay]) getReadingDay(person.id,demoDay);
}
let saveIndex = 0;
let liveRunning = false;

const esc = (value = '') => String(value).replace(/[&<>"']/g, char => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[char]));
const serial = id => 'DI-' + (getUser(id)?.sideNumber ?? id);
const groupId = id => getUser(id)?.gender === 'Female' ? groupName(id) : 'G-' + id;
const getUser = id => users.find(person => person.id === id);
const memberName = person => person.id<=seedRows.length && person.name===seedRows[person.id-1][0] ?
  tr(person.name,demoNames[person.name] || person.name) : person.name;
const currentUser = () => getUser(currentUserId);
const formatNumber = value => number.format(value);
const directMembers = id => users.filter(person => person.inviter === id);
const displayNumber = value => '<bdi>' + formatNumber(value) + '</bdi>';
const displayId = id => '<bdi dir="ltr">' + serial(id) + '</bdi>';

function descendants(id) {
  const collected = new Set();
  const pending = directMembers(id);
  while (pending.length) {
    const person = pending.pop();
    if (collected.has(person.id)) continue;
    collected.add(person.id);
    pending.push(...directMembers(person.id));
  }
  return collected;
}

function generationLetter(id) {
  let level = 1;
  let person = getUser(id);
  const women = person?.gender === 'Female';
  const visited = new Set();
  while (person?.inviter && !visited.has(person.id)) {
    visited.add(person.id);
    const parent = getUser(person.inviter);
    if (!parent || (women && parent.gender !== 'Female')) break;
    level += 1;
    person = parent;
  }
  let prefix = '';
  for (; level; level = Math.floor((level - 1) / 26)) {
    prefix = String.fromCharCode(65 + (level - 1) % 26) + prefix;
  }
  return prefix;
}

const ownerViewingWomen = () => currentUser()?.isOwner === true && window.duroodCurrentSide === 'female';
const visibleMembers = () => users;

function groupName(id) {
  return generationLetter(id);
}

function groupMemberCode(person) {
  const parent = getUser(person.inviter);
  if (person.gender !== 'Female' || parent?.gender !== 'Female') return '';
  const group = groupName(parent.id);
  const members = directMembers(parent.id).filter(member => member.gender === 'Female').sort((a,b) => a.id-b.id);
  return group + (members.findIndex(member => member.id === person.id) + (group === 'A' ? 2 : 1));
}

function groupMemberCount(person) {
  return directMembers(person.id).length + (person.gender === 'Female' && groupName(person.id) === 'A' ? 1 : 0);
}

function score(person, span, history) {
  if (span === 'daily' && history === 'current') return dayCount(person,dateKey());
  return sampleScore(person,span,history) + readingTotal(person.id,span,history);
}

function sampleScore(person, span, history) {
  if (!person.daily) return history === 'previous' ? 0 : person.added;
  const factors = {daily:1,weekly:5,monthly:19,annual:91,all:112};
  const balance = person.id % 4 * 96;
  if (history === 'previous') {
    if (span === 'all') return person.daily * (factors.all - 1) + balance * 3;
    return Math.max(0, person.daily - 16 + (person.id % 5) * 13) * factors[span];
  }
  return person.daily * factors[span] + (span === 'daily' ? 0 : balance * 3) + person.added;
}

function ur(text, tag = 'p', classes = '') {
  return '<' + tag + ' class="ur ' + classes + '">' + text + '</' + tag + '>';
}

async function prepareProfilePhoto(file){
  if((file.type && file.type!=="application/octet-stream" && !file.type.startsWith("image/")) || file.size>20*1024*1024){
    throw Error("تصویر JPG، PNG، WebP، GIF یا AVIF میں اور 20 MB سے کم ہونی چاہیے۔");
  }
  const url=URL.createObjectURL(file);
  try{
    const picture=new Image();
    picture.src=url;
    await picture.decode();
    const scale=Math.min(1,384/Math.max(picture.naturalWidth,picture.naturalHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(picture.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(picture.naturalHeight*scale));
    const context=canvas.getContext("2d");
    context.fillStyle="#fff";
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(picture,0,0,canvas.width,canvas.height);
    for(const quality of [0.78,0.64,0.48]){
      const image=canvas.toDataURL("image/jpeg",quality);
      if(image.startsWith("data:image/jpeg;base64,") && image.length<=180000)return image;
    }
    throw Error("تصویر چھوٹی کر کے دوبارہ منتخب کریں۔");
  }finally{URL.revokeObjectURL(url);}
}

function avatar(person, large = false) {
  const initials = memberName(person).trim().split(/\s+/u).slice(0,2).map(word => Array.from(word)[0]).join('').toUpperCase();
  return '<span class="avatar' + (large ? ' large' : '') + '" aria-hidden="true">' +
    (person.photo ? '<img src="' + esc(person.photo) + '" alt="">' : esc(initials || '✧')) + '</span>';
}

function passwordField(name, title, autocomplete = 'new-password', peek = false) {
  return '<div class="field"><label for="password-' + name + '">' + title + '</label>' +

function heading(title, body) {

}

function toggle(label, action, value, active, style) {
  return '<button class="' + style + '" data-action="' + action + '" data-value="' + value +

}

function rankCard(entry, index) {
  return '<article class="rank-card ' + ['first','second','third'][index] + tr("\"><span class=\"rank-number\" aria-label=\"Rank ", '"><span class="rank-number" aria-label="درجہ ') +
    (index + 1) + '">' + (index + 1) + '</span><div><h2 dir="auto">' + esc(memberName(entry.person)) + '</h2>' +
    '<small class="muted">' + displayId(entry.person.id) + '</small></div><div class="rank-total">' +
    displayNumber(entry.total) + tr(" <small>Durood</small></div></article>", ' <small>درود</small></div></article>');

function ranking() {
  const top = visibleMembers().filter(person => !person.disabled && !(ownerViewingWomen() && person.isOwner))
    .map(person => ({person, total:score(person, selectedPeriod, record)}))
    .filter(entry => entry.total > 0)
    .sort((first, second) => second.total - first.total || first.person.id - second.person.id).slice(0,10);
  return heading(tr("Top Members", 'نمایاں ارکان'),tr("The ten members with the highest recorded counts for this period.", 'منتخب مدت میں سب سے زیادہ شمار درج کرنے والے دس ممبرز۔')) +
    tr("<div class=\"tab-row\" aria-label=\"Record type\">", '<div class="tab-row" aria-label="ریکارڈ کی قسم">') +
    toggle(tr("Current record", 'موجودہ ریکارڈ'),'record','current',record === 'current','tab') +
    toggle(tr("Previous record", 'پچھلا ریکارڈ'),'record','previous',record === 'previous','tab') + '</div>' +
    tr("<div class=\"periods\" aria-label=\"Period\">", '<div class="periods" aria-label="مدت">') + periods.map(([key,label]) => toggle(label,'period',key,selectedPeriod === key,'period')).join('') + '</div>' +
    (record === 'previous' && selectedPeriod === 'all' ? '<div class="section">' +
      ur(tr("The previous all-time record runs through the end of yesterday.", 'پچھلا مجموعی ریکارڈ گزشتہ دن کے اختتام تک ہے۔'),'p','notice') + '</div>' : '') +
    (top.length ? '<div class="rank-grid">' + top.slice(0,3).map(rankCard).join('') + '</div>' +
      (top.length > 3 ? '<div class="panel rank-list">' + top.slice(3).map((entry,index) =>

        '</strong><span class="rank-id muted">' + displayId(entry.person.id) + '</span></div><span class="rank-total">' + displayNumber(entry.total) +
        tr(" <small>Durood</small></span></article>", ' <small>درود</small></span></article>')).join('') + '</div>' : '') :

function treeNode(person, isRoot = false) {
  const count = directMembers(person.id).length;
  const level=memberLevel(person);
  const clickable = !isRoot && count > 0;
  const tag = clickable ? 'button' : 'div';
  return '<' + tag + ' class="tree-node"' + (clickable ? ' data-action="branch" data-value="' + person.id +
    tr("\" aria-label=\"Open branch، ", '" aria-label="شاخ کھولیں، ') + esc(memberName(person)) + '"' : '') + '><span class="node-ring">' + avatar(person) +
    '<span class="node-dot level-' + level + '" aria-label="' + tr("Level ","لیول ") + level + '">' + displayNumber(level) + '</span></span><strong dir="auto">' +
    esc(memberName(person)) + '</strong><span class="pill"><bdi>' + (isRoot ? groupName(person.id) : groupMemberCode(person) || groupName(person.id)) + '</bdi></span>' +
    (person.disabled && currentUserId === 1 ? tr("<span class=\"account-status disabled\">Suspended</span>", '<span class="account-status disabled">معطل</span>') : '') +
    (isRoot ? '<small>' + displayId(person.id) + '</small>' : '') + '</' + tag + '>';
}

function stat(label, value) {

}

function tree(person) {
  const root = getUser(groupFilter) || person;
  const children = directMembers(root.id);
  const back = root.id !== person.id
    ? '<div class="branch-nav"><button class="button secondary" data-action="branch" data-value="' + root.inviter +
      tr("\">Parent branch ›</button><button class=\"button secondary\" data-action=\"nav\" data-value=\"tree\">Back to my tree</button></div>", '">پچھلی شاخ ›</button><button class="button secondary" data-action="nav" data-value="tree">اپنے شجرے پر واپس</button></div>') : '';
  return heading(person.isOwner ? tr("Community Tree", 'اجتماعی دعوتی شجرہ') : tr("Your Referral Tree", 'آپ کا دعوتی شجرہ'),
    tr("Photo badges show member levels. Tap a member to open their branch.", 'تصویر پر بنا نشان ممبر کا لیول دکھاتا ہے۔ اگلی شاخ کھولنے کے لیے اس کے ممبر پر ٹیپ کریں۔')) + back +
    '<div class="stats">' + stat(tr("Group", 'گروپ'), '<bdi>' + groupName(root.id) + '</bdi>') +
    stat(tr("Group members", 'گروپ کے ارکان'), displayNumber(groupMemberCount(root))) +
    stat(tr("Total in branch", 'شاخ کے کل ارکان'), displayNumber(descendants(root.id).size)) + '</div>' +
    tr("<section class=\"panel section tree\" aria-label=\"Referral tree، ", '<section class="panel section tree" aria-label="دعوتی شجرہ، ') + esc(memberName(root)) + '"><div class="tree-scroll"><div class="tree-diagram">' +
    '<div class="root-node">' + treeNode(root,true) + '</div>' +
    (children.length ? '<ul class="child-list">' + children.map(child => '<li>' + treeNode(child) + '</li>').join('') + '</ul>' : '') +
    '</div></div>' + (children.length > 4 ? ur(tr("Swipe across the tree to see more members.", 'مزید ممبرز دیکھنے کے لیے درخت کو دائیں یا بائیں سرکائیں۔'),'p','tree-hint') :

  return directMembers(person.id).length > 0 ? 1 : 0;

}

async function deriveOfflinePassword(password,salt) {
  const source = await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
  const parameters = {name:'PBKDF2',hash:'SHA-256',salt:new Uint8Array(salt),iterations:100000};
  const digest = await crypto.subtle.deriveBits(parameters,source,256);
  return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2,'0')).join('');
}

async function offlineVerifier(password) {
  try {
    const salt = [...crypto.getRandomValues(new Uint8Array(16))];
    return {salt,hash:await deriveOfflinePassword(password,salt)};
  } catch {
    return null;
  }
}

function setOfflinePassword(id,password,verifier) {
  if (verifier) {
    passwords.set(id,verifier);
    sessionPasswords.delete(id);
  } else {
    passwords.delete(id);
    sessionPasswords.set(id,password);
  }
}

async function checkOfflinePassword(id,password) {
  if (sessionPasswords.has(id)) return sessionPasswords.get(id) === password;
  const verifier = passwords.get(id);
  if (!verifier) return id <= seedRows.length && password === demoPassword;
  try {
    return await deriveOfflinePassword(password,verifier.salt) === verifier.hash;
  } catch {
    return false;
  }
}

function dateKey(date = new Date()) {
  return [date.getFullYear(),date.getMonth() + 1,date.getDate()].map((part,index) =>
    String(part).padStart(index === 0 ? 4 : 2,'0')).join('-');
}

function parseDay(key) {
  const [year,month,day] = key.split('-').map(Number);
  return new Date(year,month - 1,day);
}

function readingFor(id) {
  return reading[id] ||= {goal:100,days:{}};
}

function getReadingDay(id, key) {
  const ledger = readingFor(id);
  return ledger.days[key] ||= {goal:ledger.goal,taps:0,manual:0,ms:0,intervals:0,estimate:0,unestimated:0};
}

function dayCount(person,key) {
  const entry = readingFor(person.id).days[key];
  return (key === demoDay ? person.daily : 0) + (entry?.taps || 0) + (entry?.manual || 0);
}

function readingTotal(id,span,history) {
  const now = new Date();
  const start = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if (span === 'weekly') start.setDate(start.getDate() - (start.getDay() + 6) % 7);
  if (span === 'monthly') start.setDate(1);
  if (span === 'annual') start.setMonth(0,1);
  let first = dateKey(start);
  let last = dateKey(now);
  if (history === 'previous') {
    start.setDate(start.getDate() - 1);
    last = dateKey(start);
    if (span === 'weekly') start.setDate(start.getDate() - 6);
    if (span === 'monthly') start.setDate(1);
    if (span === 'annual') start.setMonth(0,1);
    first = dateKey(start);
  }
  return Object.entries(readingFor(id).days)
    .filter(([key]) => (span === 'all' || key >= first) && key <= last)
    .reduce((sum,[,entry]) => sum + entry.taps + entry.manual,0);
}

function sessionFor(id,key) {
  if (readingSession.id !== id || readingSession.key !== key) {
    readingSession = {id,key,count:0,ms:0,intervals:0,lastTap:null};
  }
  return readingSession;
}

function durationLabel(ms) {
  const ticks = Math.floor(ms / 100);
  const seconds = Math.floor(ticks / 10);
  return [Math.floor(seconds / 3600),Math.floor(seconds / 60) % 60,seconds % 60].map(
    value => String(value).padStart(2,'0')).join(':') + '.' + ticks % 10;
}

function priorPace(id) {
  const ordered = Object.keys(readingFor(id).days).sort().reverse();
  for (const key of ordered) {
    const entry = readingFor(id).days[key];
    if (entry.intervals) return entry.ms / entry.intervals;
  }
  return null;
}

    const entry = ledger.days[key];
    const measured = entry?.intervals ? tr("Measured ", 'ناپا گیا وقت ') + durationLabel(entry.ms) : tr("Measured —", 'ناپا گیا وقت —');
    const estimate = entry?.estimate ? tr(" · Estimated ", ' · تخمینی وقت ') + durationLabel(entry.estimate) : '';

}

function updateClock() {
  if (section !== 'tasbih' || !currentUser()) return;
  const clock = document.getElementById('read-clock');
  if (!clock) return;
  const key = dateKey();
  if (readingSession.key !== key) {
    updateReader();
    return;
  }
  const elapsed = readingSession.lastTap === null ? 0 : performance.now() - readingSession.lastTap;
  clock.textContent = durationLabel(readingSession.ms + Math.max(0,elapsed));
}

function updateReader() {
  const person = currentUser();
  const set = (id,value) => { document.getElementById(id).textContent = value; };
  const key = dateKey();
  const ledger = readingFor(person.id);
  const live = sessionFor(person.id,key);
  const goal = ledger.goal;
  const count = dayCount(person,key);
  const rate = live.intervals && live.ms > 0 ? live.ms / live.intervals : null;
  set('read-all',formatNumber(score(person,'all','current')));
  set('read-today',formatNumber(count));
  set('read-target',formatNumber(goal));
  set('read-global',formatNumber(globalTotal));
  set('session-count',formatNumber(live.count));
  const filled = live.count === 0 ? 0 : (live.count - 1) % 12 + 1;
  document.querySelectorAll('.bead-track i').forEach((bead,index) => bead.classList.toggle('filled',index < filled));
  set('pace-sec',rate ? paceFormat.format(rate / 1000) : '—');
  set('pace-minute',rate ? paceFormat.format(60000 / rate) : '—');
  set('pace-hour',rate ? paceFormat.format(3600000 / rate) : '—');
  const percent = Math.floor(count * 100 / goal);
  const remaining = Math.max(0,goal - count);
  set('read-goal-note', remaining ? formatNumber(remaining) + tr(" left today · ", ' آج باقی · ') + percent + '%' : tr("Daily goal reached · ", 'روزانہ ہدف پورا · ') + percent + '%');
  const progress = document.getElementById('read-progress');
  progress.max = goal;
  progress.value = Math.min(goal,count);
  document.getElementById('daily-records').innerHTML = historyRows(person,key);
  updateClock();
}

function savedReading(messageText) {
  const persisted = saveOfflineState();
  updateReader();
  document.getElementById('read-status').textContent = persisted ? messageText : tr("Your browser could not save this count. It remains in this session.", 'اس براؤزر میں مستقل سیو دستیاب نہیں۔ شمار اس سیشن میں موجود ہے۔');
}

function tapDurood() {
  const person = currentUser();
  const key = dateKey();
  const readingDay = getReadingDay(person.id,key);
  const live = sessionFor(person.id,key);
  const now = performance.now();
  const elapsed = live.lastTap === null ? 0 : Math.round(now - live.lastTap);
  if (elapsed > 0) {
    readingDay.ms += elapsed;
    readingDay.intervals++;
    live.ms += elapsed;
    live.intervals++;
  }
  live.lastTap = now;
  live.count++;
  readingDay.taps++;
  if(!ownerViewingWomen())globalTotal++;
  savedReading(tr("One Durood saved automatically.", 'ایک درود خودکار محفوظ ہو گیا۔'));
  if (soundEnabled) playTapSound();
  if (prayerPrefs(person.id).readerVibrate) touchVibration(35);
}

function playTapSound() {
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    soundContext ||= new Audio();
    soundContext.resume().catch(() => {});
    const tone = soundContext.createOscillator();
    const volume = soundContext.createGain();
    const now = soundContext.currentTime;
    tone.frequency.value = 660;
    volume.gain.setValueAtTime(.045,now);
    volume.gain.exponentialRampToValueAtTime(.001,now + .13);
    tone.connect(volume).connect(soundContext.destination);
    tone.start(now);
    tone.stop(now + .14);
  } catch {}
}

async function readerFullscreen() {
  const reader = document.querySelector('.reader');
  if (document.fullscreenElement === reader) {
    await document.exitFullscreen();
  } else if (reader.classList.contains('is-focused')) {
    reader.classList.remove('is-focused');
  } else {
    try {
      if (!reader.requestFullscreen) throw Error('Fullscreen unavailable');
      await reader.requestFullscreen();
    } catch {
      reader.classList.add('is-focused');
    }
  }
  updateFullscreenLabel();
}

function updateFullscreenLabel() {
  const reader = document.querySelector('.reader');
  const button = reader?.querySelector('[data-action="reader-fullscreen"]');
  if (button) button.textContent = document.fullscreenElement === reader || reader.classList.contains('is-focused') ?
    tr("Exit full screen", 'پوری اسکرین سے نکلیں') : tr("Full screen", 'پوری اسکرین');
}

function handleReaderAction(action,button,value) {
  if (section !== 'tasbih') return false;
  if (action === 'count-durood') tapDurood();
  else if (action === 'reader-sound') {
    soundEnabled = !soundEnabled;
    button.setAttribute('aria-pressed',String(soundEnabled));
    button.textContent = soundEnabled ? tr("Sound on", 'آواز چالو') : tr("Sound off", 'آواز بند');
    if (soundEnabled) playTapSound();
  } else if (action === 'reader-vibrate') {
    const config = prayerPrefs(currentUserId);
    config.readerVibrate = !config.readerVibrate;
    button.setAttribute('aria-pressed',String(config.readerVibrate));
    button.textContent = config.readerVibrate ? tr("Vibration on", 'وائبریشن چالو') : tr("Vibration off", 'وائبریشن بند');
    saveOfflineState();
    if (config.readerVibrate && !touchVibration(35)) {
      document.getElementById('read-status').textContent = tr("Vibration is unavailable on this device or browser.", 'اس فون یا براؤزر میں وائبریشن دستیاب نہیں۔');
    }
  } else if (action === 'reader-fullscreen') readerFullscreen();
  else if (action === 'daily-goal') {
    readingSession.lastTap = null;
    const dialog = document.getElementById('goal-dialog');
    dialog.querySelector('[name="goal"]').value = readingFor(currentUserId).goal;
    setFeedback('goal-feedback','');
    dialog.showModal();
  } else if (action === 'manual-day') openManual(value);
  else if (action === 'close-reader-dialog') button.closest('dialog').close();
  else return false;
  return true;
}

function safePositive(value) {
  const parsed = Number(value);
  return Number.isSafeInteger(parsed) && parsed >= 1 && parsed <= 1000000 ? parsed : 0;
}

function submitDailyGoal(form,data) {
  const goal = safePositive(data.get('goal'));
  if (!goal) return setFeedback('goal-feedback',tr("Enter a valid daily target.", 'درست روزانہ ہدف درج کریں۔'));
  readingFor(currentUserId).goal = goal;
  getReadingDay(currentUserId,dateKey()).goal = goal;
  form.closest('dialog').close();
  savedReading(tr("Daily goal saved automatically.", 'روزانہ ہدف خودکار محفوظ ہو گیا۔'));
}

function submitManual(form,data) {
  const key = data.get('day');
  const amount = safePositive(data.get('amount'));
  if (!amount) return setFeedback('manual-feedback',tr("Enter a positive number.", 'مثبت تعداد درج کریں۔'));
  if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || key > dateKey() || key < '1900-01-01' || dateKey(parseDay(key)) !== key) {
    return setFeedback('manual-feedback',tr("Choose today or an earlier date.", 'آج یا کسی پچھلے دن کی درست تاریخ درج کریں۔'));
  }
  const pace = priorPace(currentUserId);
  const readingDay = getReadingDay(currentUserId,key);
  readingDay.manual += amount;
  if (pace) readingDay.estimate += Math.round(pace * amount);
  else readingDay.unestimated += amount;
  if(!ownerViewingWomen())globalTotal += amount;
  form.closest('dialog').close();
  savedReading(tr("Offline Durood saved automatically.", 'آف لائن درود خودکار محفوظ ہو گیا۔'));
}

function revokeInvites(id) {
  for (const [code,invite] of invites) {
    if (invite.by === id && !invite.used) invite.revoked = true;
    if (invite.by === id && invite.used) invites.delete(code);
  }
}

function nearestActiveInviter(person) {
  let ancestor = getUser(person.inviter);
  while (ancestor?.disabled) ancestor = getUser(ancestor.inviter);
  return ancestor || getUser(1);
}

function removeMember(person) {
  const parent = nearestActiveInviter(person);
  for (const child of directMembers(person.id)) child.inviter = parent.id;
  for (const [code,invite] of invites) {
    if (invite.by === person.id) invites.delete(code);
  }
  passwords.delete(person.id);
  sessionPasswords.delete(person.id);
  delete reading[person.id];
  delete attendance[person.id];
  delete qazaPlans[person.id];
  delete prayerSettings[person.id];
  delete memberThemes[person.id];
  users.splice(users.indexOf(person),1);
  section = 'directory';
  profileId = null;
  saveOfflineState();
  message = serial(person.id) + tr(" deleted. Their Durood is still in the global total.", ' حذف ہو گیا۔ اس کا شمار عالمی مجموعے میں برقرار ہے۔');

}

function prayerMode(personId,day,prayer,today,now=Date.now()) {
  const saved = knownPrayerStatus(personId,day,prayer);
  if (saved) return saved;
  const phase = attendancePhase(personId,day,prayer,now,today);
  return phase==='missed' || phase==='upcoming' ? phase : 'clear';
}

function namazPhaseKey(personId,today,now) {
  const previous = shiftedPrayerDate(today,-1);
  return prayers.map(([prayer])=>attendancePhase(personId,today,prayer,now,today)).join('|') +
    attendancePhase(personId,previous,'isha',now,today);
}

function namazCalendarDates(month,today) {
  const first = parseDay(month + '-01');
  const end = new Date(first.getFullYear(),first.getMonth() + 1,0);
  const lastDay = month === today.slice(0,7) ? Number(today.slice(8)) : end.getDate();
  return Array.from({length:lastDay},(_,index) => new Date(first.getFullYear(),first.getMonth(),lastDay - index));
}

function prayerCell(personId,day,id,label,today,now) {
  const key = prayerMode(personId,day,id,today,now);

  const access = label + '، ' + namazDateFormat.format(parseDay(day)) + '، ' + (mode.cell || tr("No entry", 'کوئی اندراج نہیں'));
  return '<td><button class="namaz-cell namaz-' + key + '" data-action="namaz-mark" data-value="' + id +
    '" data-day="' + day + '" aria-label="' + esc(access) + '"><strong class="prayer-name">' + label +

    '</span>' + (mode.cell ? '<span>' + mode.cell + '</span>' : '') + '</button></td>';

function setPrayerAttendance(personId,day,prayer,status,today=prayerDate(personId),now=Date.now()) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || day > today || dateKey(parseDay(day)) !== day ||
      !prayers.some(([id]) => id === prayer) || !modeButtons.includes(status)) return false;
  const phase = attendancePhase(personId,day,prayer,now,today);
  if ((status === 'jamat' || status === 'solo') && phase !== 'on-time') return false;
  if (status === 'made' && phase !== 'missed') return false;
  const days = attendance[personId] ||= {};
  if (status === 'clear') {
    const completed = qazaPlans[personId]?.done[prayer];
    if (completed) delete completed[day];
    if (!days[day]) return true;
    delete days[day][prayer];
    if (!Object.keys(days[day]).length) delete days[day];
  } else {
    const values = days[day] ||= {};
    values[prayer] = status;
  }
  return true;
}

function handleNamazAction(action,button,value) {
  if (section !== 'namaz') return false;
  if (action === 'namaz-mode' && modeButtons.includes(value)) {
    selectedNamazStatus = value;
    for (const option of app.querySelectorAll('[data-action="namaz-mode"]')) {
      option.setAttribute('aria-pressed',String(option === button));
    }
    return true;
  }
  if (action === 'namaz-month') {
    const current = prayerDate(currentUserId).slice(0,7);
    const date = parseDay((selectedNamazMonth || current) + '-01');
    date.setMonth(date.getMonth() + Number(value));
    const target = dateKey(date).slice(0,7);
    if (target > current || target < '0001-01') return true;
    selectedNamazMonth = target === current ? '' : target;
    render({keepScroll:true});
    const arrow = app.querySelector('[data-action="namaz-month"][data-value="' + value + '"]');
    (arrow?.disabled ? document.getElementById('namaz-month-label') : arrow)?.focus({preventScroll:true});
    return true;
  }
  if (action !== 'namaz-mark') return false;
  const {day} = button.dataset;
  const now = Date.now();
  const today = prayerDate(currentUserId,now);
  if (!setPrayerAttendance(currentUserId,day,value,selectedNamazStatus,today,now)) {
    const phase = attendancePhase(currentUserId,day,value,now,today);
    const hints = {missed:tr("This prayer window has ended. If you made up the prayer, select «Made up» .", 'اس نماز کا وقت گزر چکا ہے۔ قضا پڑھ لی ہے تو «قضا ادا» منتخب کریں۔'),
      upcoming:tr("This prayer window has not started yet.", 'اس نماز کا وقت ابھی شروع نہیں ہوا۔'),unknown:tr("Check your location and calculation settings for the local prayer time.", 'اس نماز کا مقامی وقت معلوم کرنے کے لیے اپنا مقام اور حساب چیک کریں۔'),
      'on-time':tr("The prayer window is open. Select Prayed or Congregation.", 'اس نماز کا وقت جاری ہے۔ ادا یا باجماعت منتخب کریں۔')};
    setFeedback('namaz-feedback',hints[phase]);
    return true;
  }
  const saved = saveOfflineState();
  const prayer = prayers.find(([id]) => id === value)[1];
  const status = prayerModes[prayerMode(currentUserId,day,value,today,now)].cell || tr("Entry cleared", 'اندراج صاف');
  render({keepScroll:true});
  const revised = app.querySelector('[data-action="namaz-mark"][data-value="' + value + '"][data-day="' + day + '"]');
  revised?.focus({preventScroll:true});
  setFeedback('namaz-feedback',saved ? prayer + ' · ' + status + tr(" Saved", ' محفوظ') : tr("This entry remains in the session. Your browser could not save it.", 'اندراج اس سیشن میں ہے۔ براؤزر میں مستقل سیو دستیاب نہیں۔'),saved);
  return true;
}

  const now = Date.now();
  const today = prayerDate(currentUserId,now);

}

function prayerPrefs(id) {

function zonedParts(value,zone) {
  if (!zoneFormatters.has(zone)) {
    zoneFormatters.set(zone,new Intl.DateTimeFormat('en-GB',{
      timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'
    }));
  }
  return Object.fromEntries(zoneFormatters.get(zone).formatToParts(value).filter(part=>part.type!=='literal').map(part=>[part.type,part.value]));
}

function prayerDate(id,now=Date.now()) {
  const config = prayerPrefs(id);
  if (!config.confirmed) return dateKey(new Date(now));
  const {year,month,day} = zonedParts(now,config.zone);
  return year + '-' + month + '-' + day;
}

function shiftedPrayerDate(key,days) {
  const [year,month,day] = key.split('-').map(Number);
  return new Date(Date.UTC(year,month - 1,day + days)).toISOString().slice(0,10);
}

// NOAA fractional-year solar declination and equation of time.
function solarDay(config,key) {
  const [year,month,day] = key.split('-').map(Number);
  const dayUTC = Date.UTC(year,month - 1,day);
  const dayIndex = (dayUTC - Date.UTC(year,0,1)) / calendarDay;
  const yearLength = (Date.UTC(year + 1,0,1) - Date.UTC(year,0,1)) / calendarDay;
  const g = 2 * Math.PI * dayIndex / yearLength;
  const eq = 229.18 * (.000075 + .001868*Math.cos(g) - .032077*Math.sin(g) - .014615*Math.cos(2*g) - .040849*Math.sin(2*g));
  const d = .006918 - .399912*Math.cos(g) + .070257*Math.sin(g) - .006758*Math.cos(2*g) +
    .000907*Math.sin(2*g) - .002697*Math.cos(3*g) + .00148*Math.sin(3*g);
  const lat = config.lat * toRad;
  let noon = dayUTC + (720 - 4 * config.lon - eq) * minute;
  const noonParts = zonedParts(noon,config.zone);
  const noonKey = noonParts.year + '-' + noonParts.month + '-' + noonParts.day;
  if (noonKey !== key) {
    const matchingDay = noonKey < key ? noon + calendarDay : noon - calendarDay;
    const updated = zonedParts(matchingDay,config.zone);
    if (updated.year + '-' + updated.month + '-' + updated.day === key) noon = matchingDay;
  }
  const fromNoon = altitude => {
    const cosine = (Math.sin(altitude) - Math.sin(lat)*Math.sin(d)) / (Math.cos(lat)*Math.cos(d));
    return Math.abs(cosine) <= 1 ? Math.acos(cosine) / toRad * 4 * minute : NaN;
  };
  const method = prayerMethods[config.method];
  const horizon = fromNoon(-.833 * toRad);
  const asrAngle = Math.atan(1 / (config.asr + Math.tan(Math.abs(lat - d))));
  return {noon,sunrise:noon-horizon,fajr:noon-fromNoon(-method.fajr*toRad),
    sunset:noon+horizon,asr:noon+fromNoon(asrAngle),isha:noon+fromNoon(-method.isha*toRad)};
}

function prayerTimes(config,key) {
  const cacheKey = [key,config.lat,config.lon,config.zone,config.method,config.asr,config.ishaLimit].join('|');
  if (prayerCache.has(cacheKey)) return prayerCache.get(cacheKey);
  const today = solarDay(config,key);
  const before = solarDay(config,shiftedPrayerDate(key,-1));
  const after = solarDay(config,shiftedPrayerDate(key,1));
  const midpoint = today.sunset + (after.fajr - today.sunset) / 2;
  const lastThird = before.sunset + (today.fajr - before.sunset) * 2 / 3;
  const duha = today.sunrise + 20 * minute;
  const quarter = today.sunrise + (today.sunset - today.sunrise) / 4;
  const noon = today.noon;
  const raw = {
    fajr:[today.fajr,today.sunrise],dhuhr:[noon + minute,today.asr],asr:[today.asr,today.sunset],
    maghrib:[today.sunset,today.isha],isha:[today.isha,config.ishaLimit==='dawn' ? after.fajr : midpoint],
    tahajjud:[Math.max(lastThird,before.isha),today.fajr],
    ishraq:[duha,quarter],chasht:[Math.max(duha,quarter),noon],awwabin:[today.sunset,today.isha]
  };
  const result = Object.fromEntries(Object.entries(raw).map(([id,[start,end]])=>{
    const roundedStart = Math.round(start/minute)*minute;
    const roundedEnd = Math.round(end/minute)*minute;
    return [id,Number.isFinite(roundedStart) && roundedStart < roundedEnd ? [roundedStart,roundedEnd] : null];
  }));
  if (prayerCache.size >= 90) prayerCache.clear();
  prayerCache.set(cacheKey,result);
  return result;
}

function qiblaBearing(lat,lon) {
  const latitude = lat * toRad;
  const target = 21.422487 * toRad;
  const longitude = (39.826206 - lon) * toRad;
  const x = Math.sin(longitude)*Math.cos(target);
  const y = Math.cos(latitude)*Math.sin(target)-Math.sin(latitude)*Math.cos(target)*Math.cos(longitude);
  return Math.hypot(x,y) < 1e-6 ? null : (Math.atan2(x,y)/toRad+360)%360;
}

function attendancePhase(id,key,prayer,now=Date.now(),today=prayerDate(id,now)) {
  if (key > today) return 'upcoming';
  const previous = shiftedPrayerDate(today,-1);
  if (key < previous || (key === previous && prayer !== 'isha')) return 'missed';
  const config = prayerPrefs(id);
  if (!config.confirmed) return key < today ? 'missed' : 'unknown';
  const window = prayerTimes(config,key)[prayer];
  if (!window) return key < today ? 'missed' : 'unknown';
  if (now < window[0]) return 'upcoming';
  return now < window[1] ? 'on-time' : 'missed';
}

function hourLabel(time,zone,baseDate) {
  const p = zonedParts(time,zone);
  const shownDay = p.year + '-' + p.month + '-' + p.day;
  const offset = !baseDate || shownDay === baseDate ? '' : shownDay > baseDate ? ' ⁺¹' : ' ⁻¹';
  return p.hour + ':' + p.minute + offset;
}

function scheduleRows(list,schedule,config,day,now) {

      (range ? hourLabel(range[1],config.zone,day) : '—') + '</bdi></td></tr>';
  }).join('');
}

function namazTiming(person) {
  const config = prayerPrefs(person.id);
  const bearing = qiblaBearing(config.lat,config.lon);

function applyPrayerLocation(form,data) {
  if (!form.isConnected || !currentUser()) return;
  const current = prayerPrefs(currentUserId);
  const lat = Number(data.get('lat')), lon = Number(data.get('lon'));
  const zone = String(data.get('zone')).trim(), method = data.get('method');
  const city = cityOptions[data.get('city')];
  if (!data.get('lat') || !data.get('lon') || !Number.isFinite(lat) || !Number.isFinite(lon) ||
      Math.abs(lat)>90 || Math.abs(lon)>180 || !Object.hasOwn(prayerMethods,method)) return setFeedback('prayer-location-feedback',tr("Enter a valid location.", 'درست مقام درج کریں۔'));
  try { zonedParts(Date.now(),zone); } catch { return setFeedback('prayer-location-feedback',tr("Enter a valid time zone, e.g. Asia/Jakarta۔", 'درست ٹائم زون درج کریں، مثلاً Asia/Jakarta۔')); }
  const label = city && city.lat===lat && city.lon===lon && city.zone===zone ? city.label : tr("Selected location", 'منتخب مقام');
  const asr = Number(data.get('asr')), ishaLimit = data.get('ishaLimit');
  if (current.lat!==lat || current.lon!==lon || current.zone!==zone) {

function requestPrayerLocation() {
  const id = currentUserId;
  const form = document.getElementById('prayer-location');

  setFeedback('prayer-location-feedback',tr("Locating your device.", 'آپ کی موجودہ جگہ معلوم کی جا رہی ہے۔'),true);
  navigator.geolocation.getCurrentPosition(({coords})=>{
    if (currentUserId!==id || !form.isConnected) return;

function touchVibration(pattern) {

function unlockPrayerAudio() {
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return null;
    soundContext ||= new Audio();
    if (soundContext.state !== 'running') soundContext.resume().catch(()=>{});
    return soundContext;
  } catch { return null; }
}

function playPrayerAlarm() {
  const context = unlockPrayerAudio();
  if (!context) return;
  for (const [i,frequency] of [523,660,784,660].entries()) {
    const start = context.currentTime + i * .24;
    const tone = context.createOscillator(), gain = context.createGain();
    tone.frequency.value = frequency;
    gain.gain.setValueAtTime(.09,start);
    gain.gain.exponentialRampToValueAtTime(.001,start+.17);
    tone.connect(gain).connect(context.destination);
    tone.start(start);
    tone.stop(start+.18);
  }
}

function monitorPrayerTime(now=Date.now()) {
  const person = currentUser();
  if (!person) return;
  if (activePrayerAlert?.until<=now) {
    activePrayerAlert = null;
    const target = document.getElementById('prayer-alert');
    if (target) target.innerHTML = '';
  }
  const day = prayerDate(person.id,now);
  const minuteKey = Math.floor(now/minute);
  const config = prayerPrefs(person.id);
  if (section==='namaz' && namazView==='timing' && timingPanelKey!==String(minuteKey)) {
    timingPanelKey = String(minuteKey);
    const target = document.getElementById('prayer-times-summary');
    if (target) target.innerHTML = timingSummary(config,now);
  }
  if (!config.confirmed || !config.enabled || document.hidden || monitorTimeKey===day+'|'+minuteKey) return;
  monitorTimeKey = day+'|'+minuteKey;
  const due = [shiftedPrayerDate(day,-1),day,shiftedPrayerDate(day,1)].flatMap(key=>{
    const schedule = prayerTimes(config,key);
    return allPrayers.filter(([id])=>{
      const range = schedule[id];
      if (!range || !config.selected.includes(id) || config.sent[id]===key) return false;
      const start = range[0] + (id==='awwabin' ? 15*minute : 0);
      return start<range[1] && start<=now && now-start<2*minute;
    }).map(([id,label])=>[id,label,key]);
  });
  if (!due.length) return;
  for (const [id,,key] of due) config.sent[id] = key;
  saveOfflineState();
  showPrayerAlert(tr("Prayer time · ", 'نماز کا وقت · ')+due.map(([,label])=>label).join('، '),config);
}

function savePrayerAlarm(form,data) {
  if (!form.isConnected || !currentUser()) return;
  const config = prayerPrefs(currentUserId);
  Object.assign(config,{enabled:data.has('enabled'),sound:data.has('sound'),vibrate:data.has('vibrate'),
    selected:data.getAll('prayer').filter(id=>allPrayers.some(([key])=>key===id))});
  if (config.sound) unlockPrayerAudio();
  if (config.vibrate) touchVibration(20);
  monitorTimeKey = '';
  const saved = saveOfflineState();
  setFeedback('prayer-alarm-feedback',saved?tr("Alarm settings saved.", 'الارم کی ترتیبات محفوظ ہو گئیں۔'):tr("Alarm set for this session.", 'الارم اس سیشن کے لیے سیٹ ہے۔'),saved);
}

function qazaPlan(id) {
  return qazaPlans[id] ||= {start:'',target:0,done:{}};
}

function dateNumber(key) {
  return Date.parse(key+'T00:00:00Z')/calendarDay;
}

function qazaDate(number) {
  return new Date(number*calendarDay).toISOString().slice(0,10);
}

function qazaMonthStart(key) {
  return key.slice(0,7)+'-01';
}

function shiftQazaMonth(key,steps) {
  const date = new Date(key+'T00:00:00Z');
  date.setUTCMonth(date.getUTCMonth()+steps);
  return date.toISOString().slice(0,10);
}

function alreadyOnTime(status) {
  return status === 'jamat' || status === 'solo';
}

function qazaRecorded(id,day,prayer) {
  return Boolean(qazaPlans[id]?.done[prayer]?.[day]);
}

function knownPrayerStatus(id,day,prayer) {
  return attendance[id]?.[day]?.[prayer] || (qazaRecorded(id,day,prayer) ? 'made' : undefined);
}

function qazaEligible(id,day,prayer,now,today) {
  const plan = qazaPlan(id);
  if (!plan.start || day<plan.start || day>today) return false;
  const status = knownPrayerStatus(id,day,prayer);
  return !alreadyOnTime(status) && (status==='made' || attendancePhase(id,day,prayer,now,today)==='missed');
}

function qazaSnapshot(id,now,today) {
  const plan = qazaPlan(id);
  const byPrayer = {};
  const todayNumber = dateNumber(today);
  const first = dateNumber(plan.start);
  const boundary = Math.max(first,todayNumber-1);
  const regular = attendance[id] || {};
  for (const [prayer] of prayers) {
    const completed = new Set();
    const onTime = new Set();
    for (const [day,states] of Object.entries(regular)) {
      if (day<plan.start || day>today) continue;
      if (alreadyOnTime(states[prayer])) onTime.add(day);
      else if (states[prayer]==='made') completed.add(day);
    }
    for (const day of Object.keys(plan.done[prayer] || {})) {
      if (day>=plan.start && day<=today && !onTime.has(day)) completed.add(day);
    }
    let total = Math.max(0,boundary-first);
    let barred = 0;
    for (const day of onTime) if (dateNumber(day)<boundary) barred++;
    for (let number=boundary; number<=todayNumber; number++) {
      if (qazaEligible(id,qazaDate(number),prayer,now,today)) total++;
    }
    total -= barred;
    const remaining = total-completed.size;
    let next = '';
    if (remaining>0) {
      for (let number=first; number<=todayNumber; number++) {
        const day = qazaDate(number);
        if (completed.has(day) || onTime.has(day)) continue;
        if (number<boundary || qazaEligible(id,day,prayer,now,today)) {
          next = day;
          break;
        }
      }
    }
    byPrayer[prayer] = {total,paid:completed.size,remaining,next};
  }
  return byPrayer;
}

function setQazaRecord(id,day,prayer,status,now=Date.now()) {
  const today = prayerDate(id,now);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !Number.isFinite(dateNumber(day)) || qazaDate(dateNumber(day))!==day ||
      !prayers.some(([key])=>key===prayer) || !['made','missed'].includes(status) || !qazaEligible(id,day,prayer,now,today)) return false;
  const plan = qazaPlan(id);
  if (status==='made') {
    if (knownPrayerStatus(id,day,prayer)!=='made') (plan.done[prayer] ||= {})[day] = true;
  } else {
    if (plan.done[prayer]) delete plan.done[prayer][day];
    const states = attendance[id]?.[day];
    if (states?.[prayer]==='made') {
      delete states[prayer];
      if (!Object.keys(states).length) delete attendance[id][day];
    }
  }
  return true;
}

function dailyAttendanceLedger(person,now,today) {
  const records = attendance[person.id] || {};
  const joined = prayerDate(person.id,person.joined.getTime());
  const start = Object.keys(records).reduce((earliest,key)=>key<earliest ? key : earliest,joined);
  const pastDays = Math.max(0,dateNumber(today)-dateNumber(start));
  const yesterday = qazaDate(dateNumber(today)-1);
  const prayerTotals = prayers.map(([id])=>{
    const stats = {jamat:0,solo:0,missed:pastDays,made:0,clear:0};
    const changes = new Map();
    if (pastDays && attendancePhase(person.id,yesterday,id,now,today)!=='missed') changes.set(yesterday,'clear');
    const plan = qazaPlans[person.id];
    for (const day of Object.keys(plan?.done[id] || {})) {
      if (day>=start && day<today && qazaRecorded(person.id,day,id)) changes.set(day,'made');
    }
    for (const [day,states] of Object.entries(records)) {
      if (day>=start && day<today && states[id]) changes.set(day,states[id]);
    }
    for (const state of changes.values()) {
      stats.missed--;
      stats[state]++;
    }
    const saved = knownPrayerStatus(person.id,today,id);
    const phase = attendancePhase(person.id,today,id,now,today);
    if (saved || phase==='missed' || phase==='on-time') stats[saved || (phase==='missed'?'missed':'clear')]++;
    return {...stats,total:Object.values(stats).reduce((sum,value)=>sum+value,0)};
  });
  const totals = prayerTotals.map(prayer=>prayer.total);
  const rows = [['jamat',tr("Congregation", 'باجماعت')],['solo',tr("Prayed", 'ادا')],['missed',tr("Still missed", 'باقی قضا')],['made',tr("Made up", 'قضا ادا')]].map(([key,label])=>
    [label,prayerTotals.map(prayer=>prayer[key]),key]);
  return ledgerTable({
    id:'daily-ledger-title',title:tr("Daily Prayer Ledger", 'روزانہ نمازوں کا لیجر'),rows,footer:[tr("Total", 'کل'),totals],
    grandTotal:totals.reduce((sum,value)=>sum+value,0),
    note:tr("Counts begin at membership or at your first earlier attendance record.", 'شمار رکنیت یا اس سے پہلے کے پہلے درج شدہ روزانہ ریکارڈ سے شروع ہوتا ہے۔')
  });
}

function qazaCalendar(id,plan,now,today) {
  const from = qazaMonthStart(plan.start);
  const to = qazaMonthStart(today);
  const month = qazaMonth && qazaMonth>=from && qazaMonth<=to ? qazaMonth : from;
  const start = Math.max(dateNumber(plan.start),dateNumber(month));
  const end = Math.min(dateNumber(today),dateNumber(shiftQazaMonth(month,1))-1);
  return tr("<section class=\"qaza-section qaza-calendar\"><h2>Make-up calendar</h2><div class=\"namaz-calendar-bar\" dir=\"ltr\">", '<section class="qaza-section qaza-calendar"><h2>قضا کیلنڈر</h2><div class="namaz-calendar-bar" dir="ltr">') +
    tr("<button class=\"button secondary\" data-action=\"qaza-month\" data-value=\"-1\" aria-label=\"Previous make-up month\"", '<button class="button secondary" data-action="qaza-month" data-value="-1" aria-label="پچھلا قضا مہینہ"')+(month===from?' disabled':'')+'>‹</button>' +
    '<output id="qaza-month-label" tabindex="-1">'+esc(qazaMonthFormat.format(new Date(month+'T00:00:00Z')))+'</output>'+
    tr("<button class=\"button secondary\" data-action=\"qaza-month\" data-value=\"1\" aria-label=\"Next make-up month\"", '<button class="button secondary" data-action="qaza-month" data-value="1" aria-label="اگلا قضا مہینہ"')+(month===to?' disabled':'')+'>›</button></div>' +
    '<div class="qaza-columns">' + prayers.map(([prayer,label])=>{
      const open = [], completed = [];
      for (let number=start; number<=end; number++) {
        const day = qazaDate(number);
        if (!qazaEligible(id,day,prayer,now,today)) continue;
        (knownPrayerStatus(id,day,prayer)==='made'?completed:open).push(day);
      }
      const rows = open.map(day=>'<li>'+qazaDayButton(prayer,label,day,false)+'</li>')
        .concat(completed.map((day,index)=>'<li'+(index===0&&open.length?' class="qaza-paid-start"':'')+'>'+qazaDayButton(prayer,label,day,true)+'</li>'));
      return '<section class="qaza-column" data-qaza-prayer="'+prayer+'"><h3>'+label+'</h3>' +
        (rows.length?'<ol>'+rows.join('')+'</ol>':tr("<p>No missed prayers</p>", '<p>کوئی قضا نہیں</p>'))+'</section>';
    }).join('')+'</div></section>';
}

function saveQazaStart(form,data) {
  if (!form.isConnected || section!=='namaz' || namazView!=='qaza' || !currentUser()) return;
  const plan = qazaPlan(currentUserId);
  if (plan.start && !qazaEditing) return;
  const start = String(data.get('start') || '');
  const number = dateNumber(start);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(start) || !Number.isFinite(number) || qazaDate(number)!==start || start>prayerDate(currentUserId)) {
    setFeedback('qaza-date-feedback',tr("Select today or an earlier date.", 'آج یا اس سے پہلے کی درست تاریخ منتخب کریں۔'));
    return;
  }
  plan.start = start;
  qazaEditing = false;
  qazaDateDraft = null;
  qazaMonth = qazaMonthStart(start);
  const saved = saveOfflineState();
  render({keepScroll:true});
  setFeedback('qaza-date-feedback',saved?tr("Date saved.", 'تاریخ محفوظ ہو گئی۔'):tr("Date saved for this session.", 'تاریخ اس سیشن میں محفوظ ہے۔'),saved);
}

function saveQazaTarget(form,data) {
  if (!form.isConnected || section!=='namaz' || namazView!=='qaza' || !currentUser()) return;
  const target = Number(data.get('target'));
  if (!Number.isSafeInteger(target) || target<1) {
    setFeedback('qaza-target-feedback',tr("Enter a positive daily target.", 'روزانہ ہدف کے لیے درست مثبت عدد درج کریں۔'));
    return;
  }
  qazaPlan(currentUserId).target = target;
  qazaTargetDraft = null;
  const saved = saveOfflineState();
  render({keepScroll:true});
  setFeedback('qaza-target-feedback',saved?tr("Goal saved.", 'ہدف محفوظ ہو گیا۔'):tr("Goal saved for this session.", 'ہدف اس سیشن میں محفوظ ہے۔'),saved);
}

function unlockQazaDate() {
  const plan = qazaPlan(currentUserId);
  if (!plan.start || qazaEditing) return;
  const now = performance.now();
  qazaUnlockCount = now-qazaUnlockAt<1500 ? qazaUnlockCount+1 : 1;
  qazaUnlockAt = now;
  if (qazaUnlockCount<3) return;
  qazaUnlockCount = 0;
  qazaEditing = true;
  render({keepScroll:true});
  app.querySelector('#qaza-date-form [name="start"]')?.focus({preventScroll:true});
}

function handleQazaInput(input) {
  if (input.form?.id==='qaza-date-form') qazaDateDraft = input.value;
  if (input.form?.id!=='qaza-target-form') return;
  qazaTargetDraft = input.value;
  const button = input.form.querySelector('.qaza-save');
  const saved = Boolean(qazaPlan(currentUserId).target) && Number(input.value)===qazaPlan(currentUserId).target;
  button.classList.toggle('saved',saved);
  button.classList.toggle('editing',!saved);
  button.textContent = saved?tr("✓ Saved", '✓ محفوظ'):tr("Save", 'محفوظ کریں');
}

function handleQazaAction(action,button,value) {
  if (section!=='namaz' || namazView!=='qaza') return false;
  const today = prayerDate(currentUserId);
  const plan = qazaPlan(currentUserId);
  if (action==='qaza-unlock') unlockQazaDate();
  else if (action==='qaza-mode' && ['made','missed'].includes(value)) {
    qazaMode = value;
    for (const choice of app.querySelectorAll('[data-action="qaza-mode"]')) choice.setAttribute('aria-pressed',String(choice===button));
  } else if (action==='qaza-month' && ['-1','1'].includes(value)) {
    const first = qazaMonthStart(plan.start);
    const target = shiftQazaMonth(qazaMonth||first,Number(value));
    if (target<first || target>qazaMonthStart(today)) return true;
    qazaMonth = target;
    render({keepScroll:true});
    const arrow = app.querySelector('[data-action="qaza-month"][data-value="'+value+'"]');
    (arrow?.disabled?document.getElementById('qaza-month-label'):arrow)?.focus({preventScroll:true});
  } else if (action==='qaza-record') {
    const day = button.dataset.day;
    const kind = button.dataset.kind;
    const old = knownPrayerStatus(currentUserId,day,value)==='made'?'made':'missed';
    if (qazaMode===old) {
      setFeedback('qaza-entry-feedback',old==='made'?tr("This prayer is already marked as made up.", 'یہ قضا پہلے ہی ادا درج ہے۔'):tr("This prayer is already marked as missed.", 'یہ نماز پہلے ہی قضا درج ہے۔'),true);
      return true;
    }
    if (!setQazaRecord(currentUserId,day,value,qazaMode)) return true;
    const saved = saveOfflineState();
    const label = prayers.find(([id])=>id===value)[1];
    render({keepScroll:true});
    const base = '[data-action="qaza-record"][data-value="'+value+'"][data-kind="'+kind+'"]';
    (app.querySelector(base+(kind==='month'?'[data-day="'+day+'"]':'')) || app.querySelector('[data-action="qaza-mode"][aria-pressed="true"]'))?.focus({preventScroll:true});
    setFeedback('qaza-entry-feedback',saved?label+(qazaMode==='made'?tr(" · Make-up saved", ' · قضا ادا محفوظ'):tr(" · Marked as missed again.", ' · دوبارہ قضا درج ہو گئی۔')):tr("Entry saved for this session.", 'اندراج اس سیشن میں محفوظ ہے۔'),saved);
  } else return false;
  return true;
}

function changeLanguage(value) {
  if ((value !== 'en' && value !== 'ur') || value === language) return;
  const fields = Array.from(app.querySelectorAll('form input[name],form select[name],form textarea[name]'))
    .filter(field => !field.readOnly && field.type !== 'file')
    .map(field => ({form:field.form?.id,name:field.name,value:field.value,checked:field.checked}));
  const oathOpen = app.querySelector('.oath')?.open;
  language = value;
  try { localStorage.setItem('durood-language',value); } catch {}
  refreshLocale();
  message = '';
  if (readingSession.lastTap) readingSession.lastTap = null;
  render({keepScroll:true});
  for (const field of fields) {
    const input = document.getElementById(field.form)?.elements.namedItem(field.name);
    if (!input) continue;
    if (input.type === 'checkbox') input.checked = field.checked;
    else input.value = field.value;
  }
  const oath = app.querySelector('.oath');
  if (oath) oath.open = oathOpen;
  updateRegistrationButton();
  app.querySelector('[data-action="language"][aria-pressed="true"]')?.focus({preventScroll:true});
}

  return '<article class="about-page" aria-labelledby="about-title">' +
    '<header class="about-hero"><p class="about-bismillah" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>' +
    '<h1 id="about-title">' + tr('Durood-e-Ibrahimi Global','درودِ ابراہیمی گلوبل') + '</h1>' +
    '<p class="about-kicker">' + tr('About the App','ایپ کا تعارف') + '</p></header>' +
    '<section class="about-people" aria-label="' + tr('Founder and teacher','بانی اور استادِ محترم') + '">' +

      '</div><h2 dir="auto">' + person.name + '</h2><p dir="auto">' + person.role + '</p></div>').join('') +
    '</section>' +
    '<section class="about-block about-mission" aria-labelledby="about-mission"><h2 id="about-mission">' + tr('Why this app exists','ہماری دعوت کا مقصد') + '</h2>' +
    '<p>' + tr('My respected teacher, Pir Hafiz Abdul Wahab Qadri, invited me to recite Durood Sharif. As I made it a daily practice, it deepened my spiritual life. He then entrusted me with carrying that invitation to others. Durood-e-Ibrahimi Global grew out of that responsibility.',
      'میرے استادِ محترم پیر حافظ عبدالوہاب قادری نے مجھے درود شریف پڑھنے کی دعوت دی۔ جب میں نے اسے اپنے معمول میں شامل کیا تو اس سے میری روحانی زندگی کو تقویت ملی۔ استادِ محترم نے پھر مجھے یہی دعوت دوسروں تک پہنچانے کی ذمہ داری سونپی۔ درودِ ابراہیمی گلوبل اسی ذمہ داری کو نبھانے کی ایک کوشش ہے۔') + '</p>' +
    '<p>' + tr('The app has one purpose: to invite people to recite Durood Sharif with sincerity, seeking Allah’s pleasure and hoping for reward in the Hereafter. It helps us make recitation a daily practice and extend the same invitation to others with kindness. The counter helps us keep track of what we have read. The reward is with Allah.',
      'اس ایپ کا واحد مقصد یہ ہے کہ ہم اخلاص کے ساتھ، اللہ کی رضا اور آخرت کے اجر کی امید میں، خود درود شریف پڑھیں اور دوسروں کو بھی محبت سے اس کی دعوت دیں۔ ایپ روزانہ درود پڑھنے کا معمول بنانے اور پڑھی ہوئی تعداد دیانت داری سے درج کرنے میں مدد دیتی ہے۔ اس نیک عمل کا اجر اللہ تعالیٰ کے پاس ہے۔') + '</p>' +
    '<p class="about-prayer">' + tr('May Allah grant us sincerity, accept our recitation, and make this effort a means of good for us in the Hereafter. Ameen.',
      'اللہ تعالیٰ ہمیں اخلاص نصیب فرمائے، ہمارا درود قبول فرمائے اور اس کوشش کو ہمارے لیے آخرت کی بھلائی کا ذریعہ بنائے۔ آمین۔') + '</p></section>' +

function signIn(id, notice = '') {
  const person = getUser(id);
  if (!person || person.disabled) return setFeedback('feedback',tr("This member account is inactive.", 'یہ ممبر اکاؤنٹ فعال نہیں ہے۔'));
  currentUserId = id;
  readingSession = {};
  selectedNamazStatus = 'jamat';
  selectedNamazMonth = '';
  namazView = 'attendance';
  resetQazaView();
  activePrayerAlert = null;
  monitorTimeKey = '';
  timingPanelKey = '';
  if (prayerPrefs(id).sound) unlockPrayerAudio();
  section = 'overview';
  selectedPeriod = 'daily';
  record = 'current';
  groupFilter = null;
  message = notice;
  render();
}

function findUsername(value) {
  return users.find(person => person.username.toLowerCase() === value.trim().toLowerCase());
}

function findLogin(value) {
  const loginId = value.trim();
  const match = /^DI-(\d+)$/i.exec(loginId);
  return match ? getUser(Number(match[1])) : findUsername(loginId);
}

function validatePassword(password, confirmation) {
  if (password.length < 8) return tr("Use at least eight characters for your password.", 'پاس ورڈ کم از کم آٹھ حروف کا رکھیں۔');
  if (password !== confirmation) return tr("Enter the same password in both fields.", 'دونوں پاس ورڈ ایک جیسے درج کریں۔');
  return '';
}

async function register(data) {
  const name = data.get('name').trim();
  const username = data.get('username').trim();
  if (!name) return setFeedback('feedback',tr("Enter your name.", 'اپنا نام درج کریں۔'));
  if (!/^[A-Za-z0-9._-]{3,24}$/.test(username)) return setFeedback('feedback',tr("Enter a valid Login ID.", 'درست یوزر آئی ڈی درج کریں۔'));
  if (/^DI-\d+$/i.test(username) || findUsername(username)) return setFeedback('feedback',tr("This Login ID is already in use.", 'یہ یوزر آئی ڈی پہلے سے استعمال میں ہے۔'));
  const problem = validatePassword(data.get('password'),data.get('confirm'));
  if (problem) return setFeedback('feedback',problem);
  const code = data.get('invite').trim().replace(/[۰-۹٠-٩]/g, digit => {
    const zero = digit >= '۰' ? '۰' : '٠';
    return String(digit.codePointAt(0) - zero.codePointAt(0));
  }).toLowerCase();
  const invite = invites.get(code);
  if (!/^[a-z0-9]{6}$/.test(code) || !invite || invite.used || invite.revoked || getUser(invite.by)?.disabled) {
    return setFeedback('feedback',tr('Enter a valid, unused invite code.','درست اور غیر استعمال شدہ دعوتی کوڈ درج کریں۔'));
  }
  if (registrationChecks.some(field => data.get(field) !== 'yes')) {
    document.querySelector('#register .oath').open = true;
    return setFeedback('feedback',tr('Read the pledge and check all three boxes.','حلف پڑھیں اور تینوں خانوں پر نشان لگائیں۔'));
  }
  const verifier = await offlineVerifier(data.get('password'));
  if (screen !== 'register' || currentUser()) return;
  if (findUsername(username) || invite.used || invite.revoked || !invites.has(code) || getUser(invite.by)?.disabled) {
    return setFeedback('feedback',tr("This Login ID or invite code is unavailable.", 'یہ آئی ڈی یا دعوتی کوڈ دستیاب نہیں۔'));
  }
  const id = nextMemberId++;
  users.push({id,name,username,inviter:invite.by,daily:0,added:0,disabled:false,joined:new Date(),age:'',birthDate:'',gender:'Male',phone:'',address:'',photo:'',pledgeAcceptedAt:new Date().toISOString()});
  setOfflinePassword(id,data.get('password'),verifier);
  invite.used = true;
  saveOfflineState();
  signIn(id,tr("Account created. Your member number is ", 'اکاؤنٹ بن گیا۔ آپ کا ممبر نمبر ') + serial(id) + tr(".", ' ہے۔'));
}

function createInvite() {
  const alphabet = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const random = new Uint32Array(1);
  const limit = 2 ** 32 - ((2 ** 32) % alphabet.length);
  let code;
  do {
    code = '';
    while (code.length < 6) {
      crypto.getRandomValues(random);
      if (random[0] < limit) code += alphabet[random[0] % alphabet.length];
    }
  } while (!/[a-z]/.test(code) || !/[0-9]/.test(code) || issuedInviteCodes.has(code) || invites.has(code));
  issuedInviteCodes.add(code);
  invites.set(code,{by:currentUserId,used:false});
  saveOfflineState();
  const output = document.getElementById('invite-value');
  output.innerHTML = '<bdi class="invite-code">' + code + '</bdi>';
  document.querySelector('[data-action="copy-invite"]').hidden = false;
  setFeedback('invite-feedback',tr("Share this code with the new member.", 'یہ کوڈ نئے ممبر کو دیں۔'),true);
}

async function copyInvite() {
  const code = document.getElementById('invite-value').textContent;
  try {
    await navigator.clipboard.writeText(code);
    setFeedback('invite-feedback',tr("Code copied.", 'کوڈ کاپی ہو گیا۔'),true);
  } catch {
    const range = document.createRange();
    range.selectNodeContents(document.getElementById('invite-value'));
    const selected = window.getSelection();
    selected.removeAllRanges();
    selected.addRange(range);
    setFeedback('invite-feedback',tr("Code selected. Copy it using your phone's menu.", 'کوڈ منتخب ہے۔ فون کے کاپی مینو سے کاپی کریں۔'),true);
  }
}

app.addEventListener('click', event => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const {action,value} = button.dataset;
  if (action === 'language') return changeLanguage(value);

  if (action === 'eye' || action === 'peek') {
    const wrap = button.closest('.input-wrap');
    const input = wrap.querySelector('input');
    const toggleEye = wrap.querySelector('[data-action="eye"]');
    const isVisible = toggleEye.getAttribute('aria-pressed') === 'true';
    clearTimeout(peekTimers.get(input));
    if (action === 'eye') {
      input.type = isVisible ? 'password' : 'text';
      toggleEye.setAttribute('aria-pressed', String(!isVisible));
      toggleEye.setAttribute('aria-label', isVisible ? tr("Show password", 'پاس ورڈ دکھائیں') : tr("Hide password", 'پاس ورڈ چھپائیں'));
    } else if (!isVisible) {
      input.type = 'text';
      peekTimers.set(input, setTimeout(() => { input.type = 'password'; }, 2000));
    }
    return;
  }
  if (action === 'screen') {
    screen = value;
    recoveryUserId = null;
    message = '';
    render();
    return;
  }
  if (action === 'demo-login') return signIn(Number(value));
  if (action === 'logout') {
    currentUserId = null;
    pendingPhoto=null;
    readingSession = {};
    photoDraft = null;
    screen = 'login';
    message = '';
    render();
    return;
  }
  if (!currentUser()) return;
  if (handleReaderAction(action,button,value) || handleTimingAction(action,value) ||
      handleQazaAction(action,button,value) || handleNamazAction(action,button,value)) return;
  if (action === 'create-invite') return createInvite();
  if (action === 'copy-invite') return copyInvite();
  if (action === 'toggle-live') {
    liveRunning = !liveRunning;
    render({keepScroll:true});
    app.querySelector('[data-action="toggle-live"]')?.focus({preventScroll:true});
    return;
  }
  if (action === 'cancel-delete') return document.getElementById('delete-member')?.close();
  if (action === 'toggle-user' || action === 'open-delete') {
    const target = getUser(Number(value));
    if (currentUserId !== 1 || !target || target.id === 1) return;
    if (action === 'open-delete') return document.getElementById('delete-member')?.showModal();
    target.disabled = !target.disabled;
    if (target.disabled) revokeInvites(target.id);
    saveOfflineState();
    message = serial(target.id) + (target.disabled ? tr(" has been suspended.", ' عارضی طور پر بند کر دیا گیا۔') : tr(" has been restored.", ' دوبارہ فعال ہو گیا۔'));
    return render({keepScroll:true});
  }
  message = '';
  if (action === 'nav') {
    if (section === 'tasbih' && value !== 'tasbih') readingSession.lastTap = null;
    section = value;
    groupFilter = null;
    if(!currentPhotoSelection())photoDraft=null;
  }
  if (action === 'record') record = value;
  if (action === 'period') selectedPeriod = value;
  if (action === 'profile' && currentUser()?.isOwner && visibleMembers().some(member => member.id === Number(value))) {
    profileId = Number(value);
    section = 'profile';
  }
  if (action === 'branch') {
    const targetId = Number(value);
    if (ownerViewingWomen() ? !visibleMembers().some(member => member.id === targetId)
      : targetId !== currentUserId && !descendants(currentUserId).has(targetId)) return;
    groupFilter = targetId === currentUserId ? null : targetId;
    section = 'tree';
  }
  if (action === 'group' && currentUser()?.isOwner) {
    groupFilter = Number(value);
    section = 'tree';
  }
  const inRanking = action === 'record' || action === 'period';
  render({keepScroll:inRanking});
  if (inRanking) {
    const selected = app.querySelector('[data-action="' + action + '"][aria-pressed="true"]');
    selected?.focus({preventScroll:true});
  }
});

app.addEventListener('submit', async event => {
  event.preventDefault();
  const form = event.target;
  const data = new FormData(form);
  const person = currentUser();
  switch (form.id) {
    case 'login': {
      const match = findLogin(data.get('username'));
      if (!match || !await checkOfflinePassword(match.id,data.get('password'))) return setFeedback('feedback',tr("Incorrect Login ID or password.", 'یوزر آئی ڈی یا پاس ورڈ درست نہیں۔'));
      if (!form.isConnected) return;
      return signIn(match.id);
    }
    case 'register': return register(data);
    case 'reset': {
      const match = findLogin(data.get('username'));
      if (!match || match.disabled) return setFeedback('feedback',tr("This demo account does not exist.", 'یہ آزمائشی یوزر آئی ڈی موجود نہیں ہے۔'));
      recoveryUserId = match.id;
      render();
      return;
    }
    case 'reset-confirm': {
      if (data.get('recovery').trim() !== recoveryCode) return setFeedback('feedback',tr("Incorrect recovery code.", 'بحالی کوڈ درست نہیں۔'));
      const problem = validatePassword(data.get('password'),data.get('confirm'));
      if (problem) return setFeedback('feedback',problem);
      const memberId = recoveryUserId;
      const verifier = await offlineVerifier(data.get('password'));
      if (!form.isConnected || memberId !== recoveryUserId) return;
      setOfflinePassword(memberId,data.get('password'),verifier);
      saveOfflineState();
      recoveryUserId = null;
      screen = 'login';
      message = tr("Password changed. Log in with your new password.", 'پاس ورڈ بدل گیا۔ نئے پاس ورڈ سے لاگ اِن کریں۔');
      render();
      return;
    }
    case 'qaza-date-form': return saveQazaStart(form,data);
    case 'qaza-target-form': return saveQazaTarget(form,data);
    case 'prayer-location': return applyPrayerLocation(form,data);
    case 'prayer-alarm-form': return savePrayerAlarm(form,data);
    case 'daily-goal-form': return submitDailyGoal(form,data);
    case 'manual-form': return submitManual(form,data);
    case 'delete-form': {
      const member = getUser(Number(form.dataset.id));
      if (currentUserId !== 1 || !member || member.id === 1) return;
      if (data.get('confirmId').trim().toUpperCase() !== serial(member.id)) {
        return setFeedback('delete-feedback',tr("Enter the correct Member ID to confirm.", 'تصدیق کے لیے درست ممبر آئی ڈی درج کریں۔'));
      }
      return removeMember(member);
    }
    case 'profile-form': {
      if (!person || !data.get('name').trim()) return setFeedback('profile-feedback',tr("Enter your name.", 'نام درج کریں۔'));
      for (const key of ['name','age','birthDate','address']) person[key] = data.get(key).trim();
      if (photoDraft) person.photo = photoDraft;
      photoDraft = null;
      saveOfflineState();
      render({keepScroll:true});
      return setFeedback('profile-feedback',tr("Changes saved.", 'تبدیلیاں محفوظ ہو گئیں۔'),true);
    }
    case 'password-form': {
      if (!person || !await checkOfflinePassword(person.id,data.get('old'))) return setFeedback('password-feedback',tr("Current password is incorrect.", 'موجودہ پاس ورڈ درست نہیں۔'));
      const problem = validatePassword(data.get('password'),data.get('confirm'));
      if (problem) return setFeedback('password-feedback',problem);
      const verifier = await offlineVerifier(data.get('password'));
      if (!form.isConnected || person.id !== currentUserId) return;
      setOfflinePassword(person.id,data.get('password'),verifier);
      saveOfflineState();
      form.reset();
      for (const eye of form.querySelectorAll('[data-action="eye"]')) {
        eye.closest('.input-wrap').querySelector('input').type = 'password';
        eye.setAttribute('aria-pressed','false');
        eye.setAttribute('aria-label',tr("Show password", 'پاس ورڈ دکھائیں'));
      }
      return setFeedback('password-feedback',tr("New password saved.", 'نیا پاس ورڈ محفوظ ہو گیا۔'),true);
    }
  }
});

window.duroodClassicBridge = {
