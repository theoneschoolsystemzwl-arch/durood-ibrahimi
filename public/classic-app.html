/* Android and small phones: compact controls instead of overlapping bars.
   The APK handles Android 15+ system-bar insets natively. */
@media (max-width: 520px) {
  .utility-inner {
    min-height: 46px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 5px;
    padding: 3px 7px;
  }
  .utility-brand {
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: .72rem;
    line-height: 1.4;
  }
  .utility-actions {
    min-width: 0;
    flex-shrink: 0;
    gap: 2px;
  }
  .about-tab,.locale-switch button {
    min-height: 32px;
    padding: 3px 5px;
    font-size: .70rem;
    line-height: 1.35;
  }
  .locale-switch {
    flex-shrink: 0;
    padding: 1px;
    gap: 0;
  }
  .bottom-nav {
    padding: 3px max(3px,env(safe-area-inset-right))
      max(4px,env(safe-area-inset-bottom))
      max(3px,env(safe-area-inset-left));
  }
  .nav-inner {
    gap: 1px;
    width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display:none; }
  .nav {
    flex: 1 0 0;
    min-width: 0;
    min-height: 46px;
    gap: 1px;
    padding: 2px 0;
    font-size: clamp(.53rem,2.25vw,.67rem);
    line-height: 1.28;
  }
  .nav span {
    height: 17px;
    font-size: 1.04rem;
    line-height: 1;
  }
  .main {
    padding-bottom: max(76px,calc(74px + env(safe-area-inset-bottom)));
  }
}

/* Stable Android WebView layout without changing the original design.
   Prevent page-wide horizontal overflow and make the bottom dock a fixed,
   horizontally scrollable row instead of resizing buttons between renders. */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  max-width:100%;
  overflow-x:clip;
  overscroll-behavior-x:none;
}
body,#app,.shell{width:100%;max-width:100%;min-width:0;overflow-x:clip}
.bottom-nav{left:0;right:0;bottom:0;width:100%;max-width:100%;box-sizing:border-box}
.nav-inner{min-width:0;max-width:700px;overflow-x:auto;overflow-y:hidden}
.nav{overflow:hidden;white-space:nowrap}
@media(max-width:520px){
  .nav-inner{width:100%;min-height:46px;overscroll-behavior-x:contain}
  .nav{flex:1 0 45px;min-width:45px;max-width:none;min-height:46px}
  .main{padding-bottom:max(82px,calc(78px + env(safe-area-inset-bottom)))}
  input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px}
}

 const local=Math.max(0,Number(readingFor(person.id).days[day]?.manual)||0);
 const scope=person.uid+"|"+String(window.duroodCurrentSide||"");
 return Math.max(local,readerServerScope===scope?Number(readerServerManual[day])||0:0);
}
let readerPendingTotals=Object.create(null);
function verifiedDuroodTaps(person,day){
  const local=Math.max(0,Number(readingFor(person.id).days[day]?.taps)||0);
  const scope=person.uid+"|"+String(window.duroodCurrentSide||"");
  const remote=readerServerScope===scope?readerServerTotals[day]:undefined;
  const pending=Math.max(0,Number(readerPendingTotals[day])||0);
  return Math.max(local,Number.isSafeInteger(remote)&&remote>=0?remote+pending:0);
}

const esc = (value = '') => String(value).replace(/[&<>"']/g, char => ({

  const person = getUser(id);

  return 'DI-' + (person?.sideNumber ?? id);

const directMembers = id => {
  const parent=getUser(id);
  if(!parent)return [];
  return users.filter(person=>person.id!==id&&
    (person.gender==='Female')===(parent.gender==='Female')&&
    (parent.uid&&person.inviterUid ? person.inviterUid===parent.uid : person.inviter===id));
};
const displayNumber = value => '<bdi>' + formatNumber(value) + '</bdi>';
const displayId = id => '<bdi dir="ltr">' + serial(id) + '</bdi>';

function descendants(id) {
  const collected = new Set();
  const pending = directMembers(id);
  while (pending.length) {
    const person = pending.pop();
    if (collected.has(person.id)) continue;
    collected.add(person.id);
    pending.push(...directMembers(person.id));
  }
  return collected;
}

function generationLetter(id) {
  let level = 1;
  let person = getUser(id);
  const women = person?.gender === 'Female';
  const visited = new Set();
  while (person?.inviter && !visited.has(person.id)) {
    visited.add(person.id);
    const parent = getUser(person.inviter);
    if (!parent || (women && parent.gender !== 'Female')) break;
    level += 1;
    person = parent;
  }
  let prefix = '';
  for (; level; level = Math.floor((level - 1) / 26)) {
    prefix = String.fromCharCode(65 + (level - 1) % 26) + prefix;
  }
  return prefix;
}

const ownerViewingWomen = () => currentUser()?.isOwner === true && window.duroodCurrentSide === 'female';
const visibleMembers = () => ownerViewingWomen() ? users.filter(person => person.gender === 'Female' && !person.isOwner) : users;

function groupName(id) {
  return generationLetter(id);
}

function hasGroup(id) {
  return directMembers(id).length > 0;
}

function ownedGroupName(id) {
  return hasGroup(id) ? groupName(id) : '—';
}

function treeMemberLabel(person) {

}

let liveGroupMemberCounts=new Map();
let savedMemberWirds=new Map(),savedMemberWirdsComplete=false;
function memberWirdText(person){
  if(!person)return '—';
  if(!person.uid)return formatNumber(score(person,'all','current'));
  if(savedMemberWirds.has(person.uid))return formatNumber(savedMemberWirds.get(person.uid));
  if(savedMemberWirdsComplete&&!(ownerViewingWomen()&&person.isOwner))return formatNumber(0);
  return '—';
}
function groupWirdPeople(p){
 const ids=descendants(p.id);ids.delete(p.id);
 const list=[...ids].map(getUser).filter(Boolean);
 return p.isOwner||p.isFoundingSpouse?[p,...list]:list;
}
function groupWirdText(p){
 if(p.uid&&(!currentUser()?.isOwner||!savedMemberWirdsComplete))return '—';
 const list=groupWirdPeople(p);
 const vals=list.map(m=>m.uid?(savedMemberWirds.get(m.uid)??(savedMemberWirdsComplete?0:null)):score(m,'all','current'));
 return vals.some(v=>v===null)?'—':formatNumber(vals.reduce((a,b)=>a+b,0));
}
function groupWirdMarkup(p){
 return '<span class="tree-group-wird"><small>'+tr('Group count','گروپ شمار')+'</small><bdi data-group-wird="'+p.id+'">'+groupWirdText(p)+'</bdi><small>'+formatNumber(groupWirdPeople(p).length)+' '+tr('members','ارکان')+'</small></span>';
}
function memberWirdMarkup(person){
  return '<span class="member-wird"><small>'+tr('Wird','ورد')+'</small><bdi data-member-wird="'+esc(person.uid||'local:'+person.id)+'">'+memberWirdText(person)+'</bdi></span>';
}

  return '<span class="member-photo-wird">'+avatar(person,large)+memberWirdMarkup(person)+'</span>';
}
function refreshMemberWirds(){
  const byUid=new Map(users.map(p=>[p.uid||'local:'+p.id,p]));
  document.querySelectorAll('[data-member-wird]').forEach(node=>{
    const p=byUid.get(node.dataset.memberWird);
    if(p)node.textContent=memberWirdText(p);
  });
  document.querySelectorAll('[data-group-wird]').forEach(node=>{
    const p=getUser(Number(node.dataset.groupWird));if(p)node.textContent=groupWirdText(p);
  });
}
function groupMemberCount(person) {
  if(!person || person.deleted) return 0;
  // Only the founding owner and founding woman count themselves.
  // Everyone else earns one level per directly invited member.
  const base=(person.isOwner===true||(person.gender==='Female'&&person.isFoundingSpouse===true))?1:0;
  if(liveGroupMemberCounts.has(person.uid))return base+liveGroupMemberCounts.get(person.uid);
  const female=person.gender==='Female';
  const unique=new Set();
  for(const member of users){
    if(!member.uid||member.uid===person.uid||member.deleted||(member.gender==='Female')!==female)continue;
    if(member.inviterUid===person.uid && person.uid)unique.add(member.uid);
  }
  return base+unique.size;
}
function refreshMemberCountLabels(){
  const person=ownerViewingWomen()?visibleMembers().find(m=>m.isFoundingSpouse):currentUser();
  const count=person?groupMemberCount(person):null;
  document.querySelectorAll("[data-profile-member-count],[data-profile-member-level]").forEach(node=>{
    node.textContent=count===null?"—":formatNumber(count);
  });
  document.querySelectorAll("[data-tree-member-level]").forEach(node=>{
    const member=getUser(Number(node.dataset.treeMemberLevel));
    if(!member)return;
    const level=memberLevel(member);
    node.textContent=formatNumber(level);
    node.className="node-dot level-"+level;
    node.setAttribute("aria-label",tr("Level ","لیول ")+level);
  });
}

function score(person, span, history) {
  if(span==='daily' && history==='current')return dayCount(person,globalDateKey());
  if(person.uid && span==='all' && history==='current')return Number(person.added||0);
  return sampleScore(person,span,history)+readingTotal(person.id,span,history);
}

function sampleScore(person, span, history) {
  if (!person.daily) return history === 'previous' ? 0 : person.added;
  const factors = {daily:1,weekly:5,monthly:19,annual:91,all:112};
  const balance = person.id % 4 * 96;
  if (history === 'previous') {
    if (span === 'all') return person.daily * (factors.all - 1) + balance * 3;
    return Math.max(0, person.daily - 16 + (person.id % 5) * 13) * factors[span];
  }
  return person.daily * factors[span] + (span === 'daily' ? 0 : balance * 3) + person.added;
}

function ur(text, tag = 'p', classes = '') {
  return '<' + tag + ' class="ur ' + classes + '">' + text + '</' + tag + '>';

async function prepareProfilePhoto(file){
  if((file.type && file.type!=="application/octet-stream" && !file.type.startsWith("image/")) || file.size>20*1024*1024){
    throw Error("تصویر JPG، PNG، WebP، GIF یا AVIF میں اور 20 MB سے کم ہونی چاہیے۔");
  }
  const url=URL.createObjectURL(file);
  try{
    const picture=new Image();
    picture.src=url;
    await picture.decode();
    const scale=Math.min(1,384/Math.max(picture.naturalWidth,picture.naturalHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(picture.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(picture.naturalHeight*scale));
    const context=canvas.getContext("2d");
    context.fillStyle="#fff";
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(picture,0,0,canvas.width,canvas.height);
    for(const quality of [0.78,0.64,0.48]){
      const image=canvas.toDataURL("image/jpeg",quality);
      if(image.startsWith("data:image/jpeg;base64,") && image.length<=180000)return image;
    }
    throw Error("تصویر چھوٹی کر کے دوبارہ منتخب کریں۔");
  }finally{URL.revokeObjectURL(url);}
}

        'p','muted') + '</header>' +

      tr("<label class=\"field\">Choose a login ID<input name=\"username\" autocomplete=\"username\" minlength=\"3\" maxlength=\"24\" placeholder=\"e.g. ahmed.raza\" required>", '<label class="field">لاگ اِن آئی ڈی منتخب کریں<input name="username" autocomplete="username" minlength="3" maxlength="24" placeholder="مثلاً ahmed.raza" required>') +
      ur(tr("Use English letters, numbers, periods, hyphens or underscores.", 'انگریزی حروف، اعداد، نقطہ، ڈیش یا انڈراسکور استعمال کریں۔'),'small','muted') + '</label>' +

function ranking() {

  return heading(tr("Top Members", 'نمایاں ارکان'),tr("The ten members with the highest recorded counts for this period.", 'منتخب مدت میں سب سے زیادہ شمار درج کرنے والے دس ممبرز۔')) +

function tree(person) {
  const women = ownerViewingWomen();
  const root = women
    ? visibleMembers().find(member => member.id === groupFilter && !member.deleted) || visibleMembers().find(member => member.isFoundingSpouse && !member.deleted)
    : (person.isOwner ? getUser(groupFilter) : null) || person;
  if(!root) return groups();
  const children = directMembers(root.id);
  const back = women
    ? '<div class="branch-nav"><button class="button secondary" data-action="nav" data-value="groups">' + tr('Back to groups','گروپس پر واپس') + '</button></div>'
    : root.id !== person.id
    ? '<div class="branch-nav"><button class="button secondary" data-action="branch" data-value="' + root.inviter +
      tr("\">Parent branch ›</button><button class=\"button secondary\" data-action=\"nav\" data-value=\"tree\">Back to my tree</button></div>", '">پچھلی شاخ ›</button><button class="button secondary" data-action="nav" data-value="tree">اپنے شجرے پر واپس</button></div>') : '';
  return heading(person.isOwner ? tr("Community Tree", 'اجتماعی دعوتی شجرہ') : tr("Your Referral Tree", 'آپ کا دعوتی شجرہ'),
    (person.isOwner ? tr("Photo badges show member levels. Tap any member to open their branch, even when empty.", 'تصویر پر ممبر کا لیول ہے۔ کسی بھی ممبر پر ٹیپ کریں، اس کا شجرہ کھل جائے گا۔') : tr("Photo badges show member levels.", "تصویر پر بنا نشان ممبر کا لیول دکھاتا ہے۔"))) + back +
    '<div class="stats">' + stat(tr("Group", 'گروپ'), '<bdi>' + ownedGroupName(root.id) + '</bdi>') +
    stat(tr("Group members", 'گروپ کے ارکان'), displayNumber(groupMemberCount(root))) +
    stat(tr("Total in branch", 'شاخ کے کل ارکان'), displayNumber(descendants(root.id).size)) + '</div>' +
    tr("<section class=\"panel section tree\" aria-label=\"Referral tree، ", '<section class="panel section tree" aria-label="دعوتی شجرہ، ') + esc(memberName(root)) + '"><div class="tree-scroll"><div class="tree-diagram">' +

function memberLoginMarkup(uid,disabled=false) {
  const data=window.duroodMemberLoginStatus;
  const own=uid===currentUser()?.uid;
  const lease=data?.leases?.get(uid);
  const known=own||disabled||data?.leasesReady===true;
  const online=!disabled&&(own||!!lease);
  const status=known?(online?'online':'offline'):'unknown';
  const time=Math.max(Number(lease?.authTime)||0,Number(data?.history?.get(uid)?.authTime)||0);
  const date=time>0?new Intl.DateTimeFormat(language==='ur'?'ur-PK':'en-PK',{timeZone:'Asia/Karachi',dateStyle:'medium',timeStyle:'short'}).format(new Date(time*1000)):'—';
  return '<span class="member-login-light '+status+'" aria-hidden="true"></span><span>'+
    (known?(online?tr('Logged in','لاگ اِن'):tr('Logged out','لاگ آؤٹ')):tr('Status unknown','اسٹیٹس نامعلوم'))+
    '</span><span>'+tr('Last login: ','آخری لاگ اِن: ')+'<bdi>'+esc(date)+'</bdi></span>';
}

// Load only prayer settings for the currently verified Firebase account.
// Do not reload any pre-Firebase demo users, passwords or fake Durood totals.
function restoreMemberPrivateSettings(uid,id) {
  recoveredLegacyQaza=null;
  if(!uid || !Number.isSafeInteger(id) || id<1)return;
  let saved=null;
  try { saved=JSON.parse(localStorage.getItem(memberPrivateStorageKey(uid))||'null'); } catch {}
  const legacy=loadOfflineState();
  const theme=saved?.theme ?? legacy?.themes?.[id];
  if(typeof theme==='string' && Object.hasOwn(appThemes,theme))memberThemes[id]=theme;
  const prefs=saved?.prayerPrefs ?? legacy?.prayerSettings?.[id];
  if(prefs && typeof prefs==='object' && !Array.isArray(prefs) &&
      Number.isFinite(Number(prefs.lat)) && Number.isFinite(Number(prefs.lon)) &&
      typeof prefs.zone==='string' && prefs.zone.length<80) {
    prayerSettings[id]={...cityOptions.jakarta,...prefs,
      selected:Array.isArray(prefs.selected)?prefs.selected.filter(x=>allPrayers.some(([key])=>key===x)):prayers.map(([key])=>key),
      sent:{}};
  }
  const qazaCandidate=saved?.qaza ?? legacy?.qazaPlans?.[id];
  if(qazaCandidate && typeof qazaCandidate==='object' && !Array.isArray(qazaCandidate)){
    const start=String(qazaCandidate.start||'');
    const target=Number(qazaCandidate.target||0);
    const validStart=/^(19|20)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(start) &&
      !Number.isNaN(Date.parse(start+'T12:00:00Z')) &&
      new Date(start+'T12:00:00Z').toISOString().slice(0,10)===start;
    if(validStart || Number.isSafeInteger(target) && target>0){
      const done={};
      for(const prayer of ['fajr','dhuhr','asr','maghrib','isha']){
        const days=qazaCandidate.done?.[prayer];
        if(!days||typeof days!=='object'||Array.isArray(days))continue;
        // Never silently throw away a member's old paid-prayer dates.
        // Oversized plans stay locally recoverable; Firestore will report
        // that an archival migration is required instead of losing entries.
        const valid=Object.entries(days).filter(([day,value])=>
          /^(19|20)\d{2}-\d{2}-\d{2}$/.test(day)&&value===true);
        if(valid.length)done[prayer]=Object.fromEntries(valid);
      }
      recoveredLegacyQaza={start:validStart?start:'',target:Number.isSafeInteger(target)&&target>=0&&target<=1000000?target:0,done};
      qazaPlans[id]=structuredClone(recoveredLegacyQaza);
    }
  }
}
function copyQazaPlan(plan){
  const p=plan&&typeof plan==='object'&&!Array.isArray(plan)?plan:{};
  const done={};
  for(const prayer of ['fajr','dhuhr','asr','maghrib','isha']){
    const entry=p.done?.[prayer];
    if(entry&&typeof entry==='object'&&!Array.isArray(entry))done[prayer]={...entry};
  }
  return {start:String(p.start||''),target:Number(p.target||0),done};
}

async function deriveOfflinePassword(password,salt) {
  const source = await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
  const parameters = {name:'PBKDF2',hash:'SHA-256',salt:new Uint8Array(salt),iterations:100000};
  const digest = await crypto.subtle.deriveBits(parameters,source,256);
  return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2,'0')).join('');
}

async function offlineVerifier(password) {
  try {
    const salt = [...crypto.getRandomValues(new Uint8Array(16))];
    return {salt,hash:await deriveOfflinePassword(password,salt)};
  } catch {
    return null;
  }
}

function setOfflinePassword(id,password,verifier) {
  if (verifier) {
    passwords.set(id,verifier);
    sessionPasswords.delete(id);
  } else {
    passwords.delete(id);
    sessionPasswords.set(id,password);
  }
}

async function checkOfflinePassword(id,password) {
  if (sessionPasswords.has(id)) return sessionPasswords.get(id) === password;
  const verifier = passwords.get(id);
  if (!verifier) return id <= seedRows.length && password === demoPassword;
  try {
    return await deriveOfflinePassword(password,verifier.salt) === verifier.hash;
  } catch {
    return false;
  }
}

function dateKey(date = new Date()) {
  return [date.getFullYear(),date.getMonth() + 1,date.getDate()].map((part,index) =>
    String(part).padStart(index === 0 ? 4 : 2,'0')).join('-');

function parseDay(key) {

}
function getReadingDay(id, key) {

}

function dayCount(person,key) {

}

function readingTotal(id,span,history) {
  const now = parseDay(globalDateKey());
  const start = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if (span === 'weekly') start.setDate(start.getDate() - (start.getDay() + 6) % 7);
  if (span === 'monthly') start.setDate(1);
  if (span === 'annual') start.setMonth(0,1);
  let first = dateKey(start);
  let last = dateKey(now);
  if (history === 'previous') {
    start.setDate(start.getDate() - 1);
    last = dateKey(start);
    if (span === 'weekly') start.setDate(start.getDate() - 6);
    if (span === 'monthly') start.setDate(1);
    if (span === 'annual') start.setMonth(0,1);
    first = dateKey(start);
  }
  return Object.entries(readingFor(id).days)
    .filter(([key]) => (span === 'all' || key >= first) && key <= last)
    .reduce((sum,[,entry]) => sum + entry.taps + entry.manual,0);
}

function durationLabel(ms) {
  const whole=Math.max(0,Math.floor(ms)),seconds=Math.floor(whole/1000);
  return [Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(

}

  const hours=Math.floor(total/3600),minutes=Math.floor(total/60)%60,seconds=total%60;
  return String(hours).padStart(2,'0')+':'+String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0');
}

function historyRows(person,today) {
  const ledger=readingFor(person.id);
  const registered=registrationDate(person);
  const joined=registered?globalDateKey(registered):null;
  if(!joined||joined>today)return '<li class="ur">رکنیت کی اصل تاریخ دستیاب نہیں۔</li>';
  const first=joined,records=[];
  let cumulativeGoal=0,cumulativeRead=0;
  // Create all daily rows from the user's registration day, including zero days.
  for(let day=first,i=0;day<=today && i<3660;i++){
    const entry=ledger.days[day]||{},goal=readerGoalFor(ledger,day);
    const tasbih=verifiedDuroodTaps(person,day),manual=verifiedDuroodManual(person,day);
    const count=tasbih+manual,previousDue=Math.max(0,cumulativeGoal-cumulativeRead);
    const previousCredit=Math.max(0,cumulativeRead-cumulativeGoal);
    cumulativeGoal+=goal;cumulativeRead+=count;
    records.push({day,entry,goal,tasbih,manual,count,previousDue,previousCredit,balance:cumulativeRead-cumulativeGoal});
    const next=parseDay(day);next.setDate(next.getDate()+1);day=dateKey(next);
  }
  // Like W1, excess recitations on a later day may clear older pending targets.
  let highest=-Infinity;
  for(let i=records.length-1;i>=0;i--){
    highest=Math.max(highest,records[i].balance);
    records[i].remaining=Math.max(0,-highest);
  }
  const cell=(name,number,klass='')=>'<div class="durood-ledger-cell '+klass+
    '"><small>'+name+'</small><strong>'+displayNumber(number)+'</strong></div>';
  const rows=records.slice(-readerHistoryLimit).reverse().map(r=>{
    const {day,entry,goal,tasbih,manual,count,previousDue,previousCredit,remaining}=r;
    const completed=remaining===0,netGoal=Math.max(0,goal+previousDue-previousCredit);
    const status=completed?tr('✓ Completed','✓ ہدف مکمل'):
      tr('● Outstanding ','● بقایا ')+displayNumber(remaining);
    const measured=durationLabel(Number(entry.ms)||0);
    const estimate=entry.estimate?durationLabel(entry.estimate):'—';
    return '<li class="durood-ledger-row '+(completed?'is-complete':'is-pending')+
      '"><div class="durood-ledger-heading"><time datetime="'+day+'">'+
      esc(joinDate.format(parseDay(day)))+'</time><span class="durood-ledger-status">'+status+
      '</span></div><div class="durood-ledger-grid">'+
      cell(tr('Goal','ہدف'),netGoal)+
      cell(tr('Previous due','پچھلا بقایا'),previousDue)+
      cell(tr('Tasbih','تسبیح'),tasbih,'is-tasbih')+
      cell(tr('Manual','دستی'),manual,'is-manual')+
      cell(tr('Total','کل'),count)+
      cell(tr('Remaining','باقی'),remaining,completed?'is-complete':'is-remaining')+
      '</div><div class="durood-ledger-times"><span>'+tr('Tasbih time','تسبیح کا وقت')+
      ' <bdi dir="ltr">'+measured+'</bdi></span><span>'+
      tr('Estimated manual time','دستی تخمینی وقت')+' <bdi dir="ltr">'+estimate+'</bdi>'+
      (entry.unestimated?tr(' · unavailable',' · وقت نامعلوم'):'')+'</span></div></li>';
  }).join('');
  const more=records.length>readerHistoryLimit?
    '<li class="durood-ledger-more"><button type="button" class="button secondary" data-action="reader-history-more">'+
    tr('Show older records','مزید پرانا ریکارڈ دکھائیں')+'</button></li>':'';
  return rows+more;
}

function updateClock() {
  if (section !== 'wazifa-reader' || !currentUser() || document.hidden) return;
  const clock=document.getElementById('read-clock');
  if(!clock)return;
  if(readingSession.key!==globalDateKey()){updateReader();return;}
  let elapsed=0;
  if(readingSession.lastTap!==null){
    const idle=Math.max(0,performance.now()-readingSession.lastTap);
    if(idle>=15000){readingSession.ms+=15000;readingSession.lastTap=null;}
    // The session pauses after fifteen seconds of inactivity; daily tap totals
    // remain visible on the dial until the local calendar day changes.
    else elapsed=idle;
  }
  const measured=readingSession.ms+elapsed;
  clock.textContent=compactTasbihClock(measured);
  // First tap starts time; rate projections update continuously thereafter.
  const person=currentUser();
  const rate=readingSession.count>0 && measured>0 ?
    measured/readingSession.count : person?priorPace(person.id):null;
  for(const [id,value] of [
    ['pace-sec',rate?tasbihPaceWholeFormat.format(rate/1000):'—'],
    ['pace-minute',rate?tasbihPaceWholeFormat.format(60000/rate):'—'],
    ['pace-hour',rate?tasbihPaceWholeFormat.format(3600000/rate):'—']
  ]){
    const node=document.getElementById(id);
    if(node)node.textContent=value;
  }
}

function updateReader() {
  const person = currentUser();
  if(!person||!document.getElementById('read-progress'))return;
  const set = (id,value) => { const node=document.getElementById(id);if(node)node.textContent=value; };
  const key = globalDateKey();
  const ledger = readingFor(person.id);
  const live = sessionFor(person.id,key);
  const goal = readerGoalFor(ledger,key);
  const count = dayCount(person,key);
  // Count every completed recitation as on the Wazaif reader.
  const rate = live.count>0 && live.ms>0 ? live.ms/live.count : priorPace(person.id);
  set('read-all',formatNumber(score(person,'all','current')));
  set('read-today',formatNumber(count));
  set('read-target',formatNumber(goal));
  set('read-global',formatNumber(globalTotal));
  set('session-count',formatNumber(verifiedDuroodTaps(person,key)));
  const taps=verifiedDuroodTaps(person,key);
  const inCycle=taps>0 && taps%100===0 ? 100 : taps%100;
  const dial=document.querySelector('.reader .dial');
  if(dial)dial.style.setProperty('--ring-progress',String(360*inCycle/100)+'deg');
  set('pace-sec',rate ? tasbihPaceWholeFormat.format(rate / 1000) : '—');
  set('pace-minute',rate ? tasbihPaceWholeFormat.format(60000 / rate) : '—');
  set('pace-hour',rate ? tasbihPaceWholeFormat.format(3600000 / rate) : '—');
  const percent = goal>0?Math.min(100,Math.round(count * 1000 / goal)/10):0;
  const remaining = Math.max(0,goal - count);
  set('read-goal-note', !goal ? (hasMemberDailyGoal()?tr("Daily goal: 0","روزانہ ہدف: 0"):tr("Set your daily goal","اپنا روزانہ ہدف مقرر کریں")) : remaining ? formatNumber(remaining) + tr(" left today · ", ' آج باقی · ') + percent + '%' : tr("Daily goal reached · ", 'روزانہ ہدف پورا · ') + percent + '%');
  const progress = document.getElementById('read-progress');
  progress.max = goal||1;
  progress.value = Math.min(goal,count);
  // The dial updates instantly. Rebuild the long dated history once after a
  // short burst of taps instead of rerendering every row for every recitation.
  clearTimeout(readerHistoryTimer);
  readerHistoryTimer=setTimeout(()=>{
    const target=document.getElementById('daily-records');
    if(target && section==='wazifa-reader' && currentUser()?.id===person.id){
      target.innerHTML=historyRows(person,globalDateKey());
      const caption=document.getElementById('group-record-caption');
      const joined=registrationDate(person);
      if(caption)caption.textContent=tr('Membership date: ','تاریخِ رکنیت: ')+(joined?joinDate.format(joined):'—');
    }
  },180);
  updateClock();
}

function savedReading(messageText) {

}

function tapDurood() {
  const person = currentUser();
  const key = globalDateKey();
  const readingDay = getReadingDay(person.id,key);
  const live = sessionFor(person.id,key);
  const now = performance.now();
  const elapsed = live.lastTap === null ? 0 : Math.round(now - live.lastTap);
  if (elapsed > 0 && elapsed <= 15000) {
    readingDay.ms += elapsed;
    readingDay.intervals++;
    live.ms += elapsed;
    live.intervals++;
  }
  live.lastTap = now;
  live.count++;
  readingDay.taps++;
  if(person.uid){person.added=(person.added||0)+1;globalTotal+=1;}
  updateReader();
  const status=document.getElementById('read-status');
  if(status)status.textContent=tr("Syncing count…","شمار محفوظ ہو رہا ہے…");
  if (soundEnabled) playTapSound();
  if (prayerPrefs(person.id).readerVibrate) touchVibration(35);
}

function playTapSound() {
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    soundContext ||= new Audio();
    soundContext.resume().catch(() => {});
    const tone = soundContext.createOscillator();
    const volume = soundContext.createGain();
    const now = soundContext.currentTime;
    tone.frequency.value = 660;
    volume.gain.setValueAtTime(.045,now);
    volume.gain.exponentialRampToValueAtTime(.001,now + .13);
    tone.connect(volume).connect(soundContext.destination);
    tone.start(now);
    tone.stop(now + .14);
  } catch {}
}

async function readerFullscreen() {
  const reader = document.querySelector('.reader');
  if (document.fullscreenElement === reader) {
    await document.exitFullscreen();
  } else if (reader.classList.contains('is-focused')) {
    reader.classList.remove('is-focused');
  } else {
    try {
      if (!reader.requestFullscreen) throw Error('Fullscreen unavailable');
      await reader.requestFullscreen();
    } catch {
      reader.classList.add('is-focused');
    }
  }
  updateFullscreenLabel();
}

function updateFullscreenLabel() {
  const reader = document.querySelector('.reader');
  const button = reader?.querySelector('[data-action="reader-fullscreen"]');
  if (button) button.textContent = document.fullscreenElement === reader || reader.classList.contains('is-focused') ?
    tr("Exit full screen", 'پوری اسکرین سے نکلیں') : tr("Full screen", 'پوری اسکرین');
}

function handleReaderAction(action,button,value) {
  if (section !== 'wazifa-reader') return false;
  if (action === 'count-durood') tapDurood();
  else if (action === 'reader-sound') {
    soundEnabled = !soundEnabled;
    button.setAttribute('aria-pressed',String(soundEnabled));
    button.textContent = soundEnabled ? tr("Sound on", 'آواز چالو') : tr("Sound off", 'آواز بند');
    if (soundEnabled) playTapSound();
  } else if (action === 'reader-vibrate') {
    const config = prayerPrefs(currentUserId);
    config.readerVibrate = !config.readerVibrate;
    button.setAttribute('aria-pressed',String(config.readerVibrate));
    button.textContent = config.readerVibrate ? tr("Vibration on", 'وائبریشن چالو') : tr("Vibration off", 'وائبریشن بند');
    saveOfflineState();
    if (config.readerVibrate && !touchVibration(35)) {
      document.getElementById('read-status').textContent = tr("Vibration is unavailable on this device or browser.", 'اس فون یا براؤزر میں وائبریشن دستیاب نہیں۔');
    }
  } else if (action === 'reader-fullscreen') readerFullscreen();
  else if (action === 'daily-goal') {
    readingSession.lastTap = null;
    const dialog = document.getElementById('goal-dialog');
    dialog.querySelector('[name="goal"]').value = readerGoalFor(readingFor(currentUserId),globalDateKey());
    setFeedback('goal-feedback','');
    dialog.showModal();
  } else if (action === 'manual-day') openManual(value);
  else if (action === 'reader-history-more') {
    readerHistoryLimit=Math.min(3660,readerHistoryLimit+31);
    const target=document.getElementById('daily-records');
    const person=currentUser();
    if(target&&person)target.innerHTML=historyRows(person,globalDateKey());
    window.duroodRefreshGroupHistory?.();
  }
  else if (action === 'close-reader-dialog') button.closest('dialog').close();
  else return false;
  return true;
}

function safePositive(value) {
  const parsed = Number(value);
  return Number.isSafeInteger(parsed) && parsed >= 1 && parsed <= 1000000 ? parsed : 0;
}

function submitDailyGoal(form,data) {
  const raw = data.get('goal'),goal=Number(raw);
  if (raw===null||String(raw).trim()===''||!Number.isSafeInteger(goal)||goal<0||goal>1000000) return setFeedback('goal-feedback',tr("Enter a valid daily target.", 'درست روزانہ ہدف درج کریں۔'));
  const person=currentUser(),day=globalDateKey(),button=form.querySelector('button:not([type])');
  if(!person||button?.disabled)return;
  if(button)button.disabled=true;
  Promise.resolve().then(async()=>{
    if(person.uid){
      if(!window.duroodSaveReaderGoal)throw Error("Firebase unavailable");
      await window.duroodSaveReaderGoal(person.uid,day,goal);
    }
    if(currentUser()?.id!==person.id)return;
    const ledger=readingFor(person.id);
    (ledger.goals||={})[day]=goal;ledger.goal=goal;
    if(person.uid)window.duroodClassicBridge.readerGoalHistory(person.uid,[...(memberReaderGoalRows||[]).filter(r=>r.date!==day),{date:day,goal}]);
    getReadingDay(person.id,day).goal=goal;
    persistReaderJournal(readerPendingTotals);
    form.closest('dialog')?.close();
    if(section==='wazifa-reader')savedReading(tr("Daily goal saved.", 'روزانہ ہدف محفوظ ہو گیا۔'));
  }).catch(()=>setFeedback('goal-feedback',tr("Goal not saved. Check your connection and retry.",'ہدف محفوظ نہیں ہوا۔ انٹرنیٹ چیک کرکے دوبارہ کوشش کریں۔')))
    .finally(()=>{if(button?.isConnected)button.disabled=false;});
}

function submitManual(form,data) {
  const key = data.get('day');
  const amount = safePositive(data.get('amount'));
  if (!amount) return setFeedback('manual-feedback',tr("Enter a positive number.", 'مثبت تعداد درج کریں۔'));
  const member=currentUser();
  const joined=member?.joined instanceof Date ? globalDateKey(member.joined) : globalDateKey();
  if (key !== globalDateKey() || key < joined) {
    return setFeedback('manual-feedback',tr("Offline Durood can only be added for today.", 'آف لائن درود صرف آج کی تاریخ میں شامل ہو سکتا ہے۔'));
  }
  const pace = priorPace(currentUserId);
  const readingDay = getReadingDay(currentUserId,key);
  readingDay.manual += amount;
  const me=currentUser();if(me?.uid){me.added=(me.added||0)+amount;globalTotal+=amount;}
  if (pace) readingDay.estimate += Math.round(pace * amount);
  else readingDay.unestimated += amount;
  
  form.closest('dialog').close();
  savedReading(tr("Offline Durood saved automatically.", 'آف لائن درود خودکار محفوظ ہو گیا۔'));
}

function revokeInvites(id) {
  for (const [code,invite] of invites) {
    if (invite.by === id && !invite.used) invite.revoked = true;
    if (invite.by === id && invite.used) invites.delete(code);
  }
}

function nearestActiveInviter(person) {
  let ancestor = getUser(person.inviter);
  while (ancestor?.disabled) ancestor = getUser(ancestor.inviter);
  return ancestor || getUser(1);
}

function removeMember(person) {
  const parent = nearestActiveInviter(person);
  for (const child of directMembers(person.id)) child.inviter = parent.id;
  for (const [code,invite] of invites) {
    if (invite.by === person.id) invites.delete(code);
  }
  passwords.delete(person.id);
  sessionPasswords.delete(person.id);
  delete reading[person.id];
  delete attendance[person.id];
  delete qazaPlans[person.id];
  delete prayerSettings[person.id];
  delete memberThemes[person.id];
  users.splice(users.indexOf(person),1);
  section = 'directory';
  profileId = null;
  saveOfflineState();
  message = serial(person.id) + tr(" deleted. Their Durood is still in the global total.", ' حذف ہو گیا۔ اس کا شمار عالمی مجموعے میں برقرار ہے۔');
  render();
}

function setPrayerAttendance(personId,day,prayer,status,today=prayerDate(personId),now=Date.now()) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || day > today || dateKey(parseDay(day)) !== day ||
      !prayers.some(([id]) => id === prayer) || !modeButtons.includes(status)) return false;
  // Attendance records what the member reports; no prayer-time gate.
  // Only future/invalid dates remain disallowed.
  const paid=qazaPlans[personId]?.done?.[prayer];
  if ((status==='clear'||status==='jamat'||status==='solo')&&paid?.[day]){
    delete paid[day];
    qazaLocalRevision++;
  }
  const days = attendance[personId] ||= {};
  prayerLocalRevision++;
  prayerEditedDays.set(day,prayerLocalRevision);
  if (status === 'clear') {
    if (!days[day]) return true;
    delete days[day][prayer];
    if (!Object.keys(days[day]).length) delete days[day];
  } else {
    const values = days[day] ||= {};
    values[prayer] = status;
  }
  return true;
}

let prayerMethods = {
  id:{name:tr("Indonesia · 20° / 18°", 'انڈونیشیا · 20° / 18°'),fajr:20,isha:18},
  karachi:{name:tr("Karachi · 18° / 18°", 'کراچی · 18° / 18°'),fajr:18,isha:18},

};
const minute = 60000;
const calendarDay = 1440 * minute;
const toRad = Math.PI / 180;
const prayerCache = new Map();
const zoneFormatters = new Map();
let namazView = 'attendance';
let activePrayerAlert = null;

function prayerPrefs(id) {

    enabled:false,sound:false,vibrate:false,readerVibrate:true,selected:prayers.map(([key])=>key),sent:{}};

function zonedParts(value,zone) {
  if (!zoneFormatters.has(zone)) {
    zoneFormatters.set(zone,new Intl.DateTimeFormat('en-GB',{
      timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'
    }));
  }
  return Object.fromEntries(zoneFormatters.get(zone).formatToParts(value).filter(part=>part.type!=='literal').map(part=>[part.type,part.value]));
}

function prayerDate(id,now=Date.now()) {
  const config = prayerPrefs(id);
  if (!config.confirmed) return dateKey(new Date(now));
  const {year,month,day} = zonedParts(now,config.zone);
  return year + '-' + month + '-' + day;
}

function shiftedPrayerDate(key,days) {
  const [year,month,day] = key.split('-').map(Number);
  return new Date(Date.UTC(year,month - 1,day + days)).toISOString().slice(0,10);
}

// NOAA fractional-year solar declination and equation of time.
function solarDay(config,key) {
  const [year,month,day] = key.split('-').map(Number);
  const dayUTC = Date.UTC(year,month - 1,day);
  const dayIndex = (dayUTC - Date.UTC(year,0,1)) / calendarDay;
  const yearLength = (Date.UTC(year + 1,0,1) - Date.UTC(year,0,1)) / calendarDay;
  const g = 2 * Math.PI * dayIndex / yearLength;
  const eq = 229.18 * (.000075 + .001868*Math.cos(g) - .032077*Math.sin(g) - .014615*Math.cos(2*g) - .040849*Math.sin(2*g));
  const d = .006918 - .399912*Math.cos(g) + .070257*Math.sin(g) - .006758*Math.cos(2*g) +
    .000907*Math.sin(2*g) - .002697*Math.cos(3*g) + .00148*Math.sin(3*g);
  const lat = config.lat * toRad;
  let noon = dayUTC + (720 - 4 * config.lon - eq) * minute;
  const noonParts = zonedParts(noon,config.zone);
  const noonKey = noonParts.year + '-' + noonParts.month + '-' + noonParts.day;
  if (noonKey !== key) {
    const matchingDay = noonKey < key ? noon + calendarDay : noon - calendarDay;
    const updated = zonedParts(matchingDay,config.zone);
    if (updated.year + '-' + updated.month + '-' + updated.day === key) noon = matchingDay;
  }
  const fromNoon = altitude => {
    const cosine = (Math.sin(altitude) - Math.sin(lat)*Math.sin(d)) / (Math.cos(lat)*Math.cos(d));
    return Math.abs(cosine) <= 1 ? Math.acos(cosine) / toRad * 4 * minute : NaN;
  };
  const method = prayerMethods[config.method];
  const horizon = fromNoon(-.833 * toRad);
  const asrAngle = Math.atan(1 / (config.asr + Math.tan(Math.abs(lat - d))));
  return {noon,sunrise:noon-horizon,fajr:noon-fromNoon(-method.fajr*toRad),
    sunset:noon+horizon,asr:noon+fromNoon(asrAngle),isha:noon+fromNoon(-method.isha*toRad)};
}

function prayerTimes(config,key) {
  const cacheKey = [key,config.lat,config.lon,config.zone,config.method,config.asr,config.ishaLimit].join('|');
  if (prayerCache.has(cacheKey)) return prayerCache.get(cacheKey);
  const today = solarDay(config,key);
  const before = solarDay(config,shiftedPrayerDate(key,-1));
  const after = solarDay(config,shiftedPrayerDate(key,1));
  const midpoint = today.sunset + (after.fajr - today.sunset) / 2;
  const lastThird = before.sunset + (today.fajr - before.sunset) * 2 / 3;
  const duha = today.sunrise + 20 * minute;
  const quarter = today.sunrise + (today.sunset - today.sunrise) / 4;
  const noon = today.noon;
  const raw = {
    fajr:[today.fajr,today.sunrise],dhuhr:[noon + minute,today.asr],asr:[today.asr,today.sunset],
    maghrib:[today.sunset,today.isha],isha:[today.isha,config.ishaLimit==='dawn' ? after.fajr : midpoint],
    tahajjud:[Math.max(lastThird,before.isha),today.fajr],
    ishraq:[duha,quarter],chasht:[Math.max(duha,quarter),noon],awwabin:[today.sunset,today.isha]
  };
  const result = Object.fromEntries(Object.entries(raw).map(([id,[start,end]])=>{
    const roundedStart = Math.round(start/minute)*minute;
    const roundedEnd = Math.round(end/minute)*minute;
    return [id,Number.isFinite(roundedStart) && roundedStart < roundedEnd ? [roundedStart,roundedEnd] : null];
  }));
  if (prayerCache.size >= 90) prayerCache.clear();
  prayerCache.set(cacheKey,result);
  return result;
}

function qiblaBearing(lat,lon) {
  const latitude = lat * toRad;
  const target = 21.422487 * toRad;
  const longitude = (39.826206 - lon) * toRad;
  const x = Math.sin(longitude)*Math.cos(target);
  const y = Math.cos(latitude)*Math.sin(target)-Math.sin(latitude)*Math.cos(target)*Math.cos(longitude);
  return Math.hypot(x,y) < 1e-6 ? null : (Math.atan2(x,y)/toRad+360)%360;
}

function attendancePhase(id,key,prayer,now=Date.now(),today=prayerDate(id,now)) {
  if (key > today) return 'upcoming';
  const previous = shiftedPrayerDate(today,-1);
  if (key < previous || (key === previous && prayer !== 'isha')) return 'missed';
  const config = prayerPrefs(id);
  if (!config.confirmed) return key < today ? 'missed' : 'unknown';
  const window = prayerTimes(config,key)[prayer];
  if (!window) return key < today ? 'missed' : 'unknown';
  if (now < window[0]) return 'upcoming';
  return now < window[1] ? 'on-time' : 'missed';
}

function hourLabel(time,zone,baseDate) {
  const p = zonedParts(time,zone);
  const shownDay = p.year + '-' + p.month + '-' + p.day;
  const offset = !baseDate || shownDay === baseDate ? '' : shownDay > baseDate ? ' ⁺¹' : ' ⁻¹';
  return p.hour + ':' + p.minute + offset;
}

function scheduleRows(list,schedule,config,day,now) {
  return list.map(([id,label])=>{
    const range = schedule[id];
    const active = config.confirmed && range && now >= range[0] && now < range[1];
    return '<tr' + (active ? ' class="prayer-current"' : '') + '><th scope="row">' + label +
      '</th><td><bdi>' + (range ? hourLabel(range[0],config.zone,day) : '—') + '</bdi></td><td><bdi>' +
      (range ? hourLabel(range[1],config.zone,day) : '—') + '</bdi></td></tr>';
  }).join('');
}

function applyPrayerLocation(form,data) {
  if (!form.isConnected || !currentUser()) return;
  const current = prayerPrefs(currentUserId);
  const lat = Number(data.get('lat')), lon = Number(data.get('lon'));
  const zone = String(data.get('zone')).trim(), method = data.get('method');
  const city = cityOptions[data.get('city')];
  if (!data.get('lat') || !data.get('lon') || !Number.isFinite(lat) || !Number.isFinite(lon) ||
      Math.abs(lat)>90 || Math.abs(lon)>180 || !Object.hasOwn(prayerMethods,method)) return setFeedback('prayer-location-feedback',tr("Enter a valid location.", 'درست مقام درج کریں۔'));
  try { zonedParts(Date.now(),zone); } catch { return setFeedback('prayer-location-feedback',tr("Enter a valid time zone, e.g. Asia/Jakarta۔", 'درست ٹائم زون درج کریں، مثلاً Asia/Jakarta۔')); }
  const label = city && city.lat===lat && city.lon===lon && city.zone===zone ? city.label : tr("Selected location", 'منتخب مقام');
  const asr = Number(data.get('asr')), ishaLimit = data.get('ishaLimit');
  if (current.lat!==lat || current.lon!==lon || current.zone!==zone) {
    current.sent = {};
    activePrayerAlert = null;
  }
  Object.assign(current,{lat,lon,zone,method,asr,ishaLimit,label,confirmed:true});
  selectedNamazMonth = '';
  const saved = saveOfflineState();
  render({keepScroll:true});
  const replacement = document.getElementById('prayer-location');
  if (replacement) replacement.closest('details').open = true;
  setFeedback('prayer-location-feedback',saved?tr("Location and times saved.", 'مقام اور اوقات محفوظ ہو گئے۔'):tr("Times updated. Your browser could not save them.", 'اوقات اپڈیٹ ہو گئے۔ مستقل سیو دستیاب نہیں۔'),saved);
}

function requestPrayerLocation() {
  const id = currentUserId;
  const form = document.getElementById('prayer-location');
  if (!navigator.geolocation) return setFeedback('prayer-location-feedback',tr("GPS is unavailable. Choose a city or enter its coordinates.", 'جی پی ایس دستیاب نہیں۔ شہر یا اپنے نقاط درج کریں۔'));
  setFeedback('prayer-location-feedback',tr("Locating your device.", 'آپ کی موجودہ جگہ معلوم کی جا رہی ہے۔'),true);
  navigator.geolocation.getCurrentPosition(({coords})=>{
    if (currentUserId!==id || !form.isConnected) return;
    form.elements.city.value = '';
    form.elements.lat.value = coords.latitude;
    form.elements.lon.value = coords.longitude;
    form.elements.zone.value = Intl.DateTimeFormat().resolvedOptions().timeZone;
    applyPrayerLocation(form,new FormData(form));
  },()=>{
    if (currentUserId===id && form.isConnected) setFeedback('prayer-location-feedback',tr("GPS could not locate you. Choose a city or enter its coordinates.", 'جی پی ایس سے مقام معلوم نہیں ہو سکا۔ شہر منتخب کریں یا نقاط درج کریں۔'));
  },{timeout:10000,maximumAge:60000});
}

function updatePrayerCity(input) {

function touchVibration(pattern) {
  try {
    for(const target of [window,window.parent]){
      try{if(typeof target.DuroodAndroid?.vibrate==='function'&&target.DuroodAndroid.vibrate(10)!==false)return true;}catch{}
    }
    return navigator.vibrate?.(pattern) ?? false;
  } catch { return false; }
}

function unlockPrayerAudio() {
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return null;
    soundContext ||= new Audio();
    if (soundContext.state !== 'running') soundContext.resume().catch(()=>{});
    return soundContext;
  } catch { return null; }
}

function playPrayerAlarm() {
  const context = unlockPrayerAudio();
  if (!context) return;
  for (const [i,frequency] of [523,660,784,660].entries()) {
    const start = context.currentTime + i * .24;
    const tone = context.createOscillator(), gain = context.createGain();
    tone.frequency.value = frequency;
    gain.gain.setValueAtTime(.09,start);
    gain.gain.exponentialRampToValueAtTime(.001,start+.17);
    tone.connect(gain).connect(context.destination);
    tone.start(start);
    tone.stop(start+.18);
  }
}

function prayerAlertMarkup() {
  if (!activePrayerAlert) return '';
  const {label,until} = activePrayerAlert;

}

function showPrayerAlert(label,config) {
  activePrayerAlert = {label,until:Date.now()+5*minute};
  const target = document.getElementById('prayer-alert');
  if (target) target.innerHTML = prayerAlertMarkup();
  if (config.sound) playPrayerAlarm();
  if (config.vibrate) touchVibration([260,130,260]);
}

function monitorPrayerTime(now=Date.now()) {
  const person = currentUser();
  if (!person) return;
  if (activePrayerAlert?.until<=now) {
    activePrayerAlert = null;
    const target = document.getElementById('prayer-alert');
    if (target) target.innerHTML = '';
  }
  const day = prayerDate(person.id,now);
  const minuteKey = Math.floor(now/minute);
  const config = prayerPrefs(person.id);
  if (section==='namaz' && namazView==='timing' && timingPanelKey!==String(minuteKey)) {
    timingPanelKey = String(minuteKey);
    const target = document.getElementById('prayer-times-summary');
    if (target) target.innerHTML = timingSummary(config,now);
  }
  if (!config.confirmed || !config.enabled || document.hidden || monitorTimeKey===day+'|'+minuteKey) return;
  monitorTimeKey = day+'|'+minuteKey;
  const due = [shiftedPrayerDate(day,-1),day,shiftedPrayerDate(day,1)].flatMap(key=>{
    const schedule = prayerTimes(config,key);
    return allPrayers.filter(([id])=>{
      const range = schedule[id];
      if (!range || !config.selected.includes(id) || config.sent[id]===key) return false;
      const start = range[0] + (id==='awwabin' ? 15*minute : 0);
      return start<range[1] && start<=now && now-start<2*minute;
    }).map(([id,label])=>[id,label,key]);
  });
  if (!due.length) return;
  for (const [id,,key] of due) config.sent[id] = key;
  saveOfflineState();
  showPrayerAlert(tr("Prayer time · ", 'نماز کا وقت · ')+due.map(([,label])=>label).join('، '),config);
}

function savePrayerAlarm(form,data) {
  if (!form.isConnected || !currentUser()) return;
  const config = prayerPrefs(currentUserId);
  Object.assign(config,{enabled:data.has('enabled'),sound:data.has('sound'),vibrate:data.has('vibrate'),
    selected:data.getAll('prayer').filter(id=>allPrayers.some(([key])=>key===id))});
  if (config.sound) unlockPrayerAudio();
  if (config.vibrate) touchVibration(20);
  monitorTimeKey = '';
  const saved = saveOfflineState();
  setFeedback('prayer-alarm-feedback',saved?tr("Alarm settings saved.", 'الارم کی ترتیبات محفوظ ہو گئیں۔'):tr("Alarm set for this session.", 'الارم اس سیشن کے لیے سیٹ ہے۔'),saved);
}

function handleTimingAction(action,value) {
  if (action==='dismiss-prayer-alert') {
    activePrayerAlert = null;
    document.getElementById('prayer-alert').innerHTML = '';
  } else if (action==='open-prayer-timing') {
    if (section==='wazifa-reader') readingSession.lastTap = null;
    section = 'namaz';
    namazView = 'timing';
    render();
  } else if (section!=='namaz') return false;
  else if (action==='prayer-view') {
    if (value==='qaza' && namazView==='qaza') {
      unlockQazaDate();
      return true;
    }
    qazaUnlockCount = 0;
    namazView = value;
    render({keepScroll:true});
    app.querySelector('[data-action="prayer-view"][aria-pressed="true"]')?.focus({preventScroll:true});
  } else if (action==='prayer-gps') requestPrayerLocation();
  else if (action==='prayer-test') {
    const data = new FormData(document.getElementById('prayer-alarm-form'));
    showPrayerAlert(tr("Prayer time · Test alert", 'نماز کا وقت · آزمائشی الرٹ'),{sound:data.has('sound'),vibrate:data.has('vibrate')});
  } else return false;
  return true;
}

  try { saved = JSON.parse(localStorage.getItem(key) || 'null'); } catch {}
  if (saved && Number.isFinite(saved.until) && saved.until>now &&
      saved.until<=now+QAZA_ENTRY_GAP_MS &&
      prayers.some(([id])=>id===saved.prayer) &&
      /^\d{4}-\d{2}-\d{2}$/.test(saved.day)) {
    qazaHoldMemory = {...saved,key};
  }
  if (qazaHoldMemory?.key===key && qazaHoldMemory.until>now) return qazaHoldMemory;
  if (qazaHoldMemory?.key===key) qazaHoldMemory = null;
  if (saved && saved.until<=now) {
    try { localStorage.removeItem(key); } catch {}
  }
  return null;
}

function qazaSeconds(hold) {
  return hold ? Math.max(1,Math.min(15,Math.ceil((hold.until-Date.now())/1000))) : 0;
}

function qazaRefreshHoldCountdown() {
  const hold = qazaActiveHold();
  if (!hold) {
    if (qazaHoldTimer) { clearInterval(qazaHoldTimer); qazaHoldTimer=null; }
    if (section==='namaz' && namazView==='qaza' && currentUser()) render({keepScroll:true});
    return;
  }
  if (section==='namaz' && namazView==='qaza') {
    const seconds=String(qazaSeconds(hold));
    app.querySelectorAll('[data-qaza-countdown], [data-qaza-seconds]').forEach(node=>{
      if(node.textContent!==seconds)node.textContent=seconds;
    });
  }
}

function qazaEnsureHoldTimer() {
  if (!qazaHoldTimer && qazaActiveHold())
    qazaHoldTimer=setInterval(qazaRefreshHoldCountdown,250);
}

function qazaStartHold(prayer,day) {
  const key=qazaHoldKey();
  if (!key) return;
  const hold={prayer,day,until:Date.now()+QAZA_ENTRY_GAP_MS};
  qazaHoldMemory={...hold,key};
  try { localStorage.setItem(key,JSON.stringify(hold)); } catch {}
  qazaEnsureHoldTimer();
}

function resetQazaView() {
  qazaMonth = '';
  qazaMode = 'made';
  qazaEditing = false;
  qazaDateDraft = null;
  qazaTargetDraft = null;
  qazaUnlockAt = 0;
  qazaUnlockCount = 0;
}

function qazaPlan(id) {
  return qazaPlans[id] ||= {start:'',target:0,done:{}};
}

function dateNumber(key) {
  return Date.parse(key+'T00:00:00Z')/calendarDay;
}

function qazaDate(number) {
  return new Date(number*calendarDay).toISOString().slice(0,10);
}

function qazaMonthStart(key) {
  return key.slice(0,7)+'-01';
}

function shiftQazaMonth(key,steps) {
  const date = new Date(key+'T00:00:00Z');
  date.setUTCMonth(date.getUTCMonth()+steps);
  return date.toISOString().slice(0,10);
}

function alreadyOnTime(status) {
  return status === 'jamat' || status === 'solo';
}

function qazaRecorded(id,day,prayer) {
  return Boolean(qazaPlans[id]?.done[prayer]?.[day]);
}

function knownPrayerStatus(id,day,prayer) {
  const saved=attendance[id]?.[day]?.[prayer];
  // A single prayer paid on the Qaza calendar and in attendance counts once.
  return alreadyOnTime(saved)?saved:qazaRecorded(id,day,prayer)?'made':saved;
}

function qazaEligible(id,day,prayer,now,today) {
  const plan = qazaPlan(id);
  if (!plan.start || day<plan.start || day>today) return false;
  const status = knownPrayerStatus(id,day,prayer);
  return !alreadyOnTime(status) && (status==='made' || attendancePhase(id,day,prayer,now,today)==='missed');
}

function qazaSnapshot(id,now,today) {
  const plan = qazaPlan(id);
  const byPrayer = {};
  const todayNumber = dateNumber(today);
  const first = dateNumber(plan.start);
  const boundary = Math.max(first,todayNumber-1);
  const regular = attendance[id] || {};
  for (const [prayer] of prayers) {
    const completed = new Set();
    const onTime = new Set();
    for (const [day,states] of Object.entries(regular)) {
      if (day<plan.start || day>today) continue;
      if (alreadyOnTime(states[prayer])) onTime.add(day);
      else if (states[prayer]==='made') completed.add(day);
    }
    for (const day of Object.keys(plan.done[prayer] || {})) {
      if (day>=plan.start && day<=today && !onTime.has(day)) completed.add(day);
    }
    let total = Math.max(0,boundary-first);
    let barred = 0;
    for (const day of onTime) if (dateNumber(day)<boundary) barred++;
    for (let number=boundary; number<=todayNumber; number++) {
      if (qazaEligible(id,qazaDate(number),prayer,now,today)) total++;
    }
    total -= barred;
    const remaining = total-completed.size;
    let next = '';
    if (remaining>0) {
      for (let number=first; number<=todayNumber; number++) {
        const day = qazaDate(number);
        if (completed.has(day) || onTime.has(day)) continue;
        if (number<boundary || qazaEligible(id,day,prayer,now,today)) {
          next = day;
          break;
        }
      }
    }
    byPrayer[prayer] = {total,paid:completed.size,remaining,next};
  }
  return byPrayer;
}

function setQazaRecord(id,day,prayer,status,now=Date.now()) {
  const today = prayerDate(id,now);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !Number.isFinite(dateNumber(day)) || qazaDate(dateNumber(day))!==day ||
      !prayers.some(([key])=>key===prayer) || !['made','missed'].includes(status) ||
      !(qazaEligible(id,day,prayer,now,today)||
        (status==='made'&&qazaPlan(id).start&&day>=qazaPlan(id).start&&day===today&&
         !alreadyOnTime(knownPrayerStatus(id,day,prayer))))) return false;
  const plan = qazaPlan(id);
  if (status==='made') {
    if (knownPrayerStatus(id,day,prayer)!=='made') (plan.done[prayer] ||= {})[day] = true;
  } else {
    if (plan.done[prayer]) delete plan.done[prayer][day];
    const states = attendance[id]?.[day];
    if (states?.[prayer]==='made') {
      delete states[prayer];
      if (!Object.keys(states).length) delete attendance[id][day];
    }
  }
  prayerLocalRevision++;
  prayerEditedDays.set(day,prayerLocalRevision);
  return true;
}

// The same original date may exist in both attendance and Qaza payment records.
// Merge by date and prayer, without requiring a scheduled prayer time to mark attendance.
// A member's chosen Qaza start establishes all five daily obligations up to today,
// including dates with no attendance and today's prayers regardless of clock time.
// An original date/prayer pair can have only one paid/on-time status.
function prayerLedgerTotals(person,now,today) {
  const records=attendance[person.id]||{},plan=qazaPlans[person.id];
  const membership=registrationDate(person);
  const joined=membership?prayerDate(person.id,membership.getTime()):"";
  const valid=day=>/^\d{4}-\d{2}-\d{2}$/.test(day)&&Number.isFinite(dateNumber(day))&&
    qazaDate(dateNumber(day))===day&&day<=today;
  let start=valid(plan?.start)?plan.start:joined;
  // Without a Qaza start date, show older explicit attendance as before.
  if(!valid(plan?.start)){
    for(const day of Object.keys(records))if(valid(day)&&(!start||day<start))start=day;
    for(const [id] of prayers)for(const day of Object.keys(plan?.done?.[id]||{}))
      if(valid(day)&&(!start||day<start))start=day;
  }
  const duePerPrayer=valid(start)?Math.max(0,dateNumber(today)-dateNumber(start)+1):0;
  const prayerTotals=prayers.map(([id])=>{
    const stats={jamat:0,solo:0,made:0,missed:0,total:duePerPrayer};
    const days=new Set(Object.keys(records));
    for(const day of Object.keys(plan?.done?.[id]||{}))days.add(day);
    for(const day of days){
      if(!valid(day)||day<start)continue;
      const status=knownPrayerStatus(person.id,day,id);
      if(status==='jamat'||status==='solo'||status==='made')stats[status]++;
    }
    // Empty attendance, explicit missed/clear and every unrecorded date are Qaza.
    stats.missed=Math.max(0,stats.total-stats.jamat-stats.solo-stats.made);
    return stats;
  });
  return {start,prayerTotals,duePerPrayer};
}
function dailyAttendanceLedger(person,now,today) {
  const {prayerTotals}=prayerLedgerTotals(person,now,today);
  const values=key=>prayerTotals.map(prayer=>prayer[key]);
  const remaining=values('missed');
  const rows=[
    [tr("Total prayers due", 'کل قضا نمازیں'),values('total'),'due'],
    [tr("Congregation", 'باجماعت'),values('jamat'),'jamat'],
    [tr("Prayed alone", 'ادا'),values('solo'),'solo'],
    [tr("Made up", 'قضا ادا'),values('made'),'made']
  ];
  return ledgerTable({
    id:'daily-ledger-title',title:tr("Daily Prayer Ledger", 'روزانہ نمازوں کا لیجر'),
    rows,footer:[tr("Still pending", 'باقی قضا نمازیں'),remaining,'missed'],
    grandTotal:remaining.reduce((sum,value)=>sum+value,0),withTotals:true,
    note:tr("From your Qaza start date through today, each daily prayer counts as due. Pending = due − congregation − prayed alone − made up.",
      'قضا کی ابتدائی تاریخ سے آج تک ہر نماز شامل ہے۔ باقی قضا = کل نمازیں − باجماعت − ادا − قضا ادا۔')
  });
}

function qazaDayButton(prayer,label,day,completed,kind='month',early=false) {
  const showYear = kind==='next';
  const date = new Date(day+'T00:00:00Z');
  const state = completed?tr("Made up", 'قضا ادا'):early?tr("Mark made up", 'قضا ادا درج کریں'):tr("Missed", 'قضا');
  const hold=qazaActiveHold(),waiting=Boolean(completed&&hold?.prayer===prayer&&hold.day===day);
  return '<button class="namaz-cell '+(completed?'qaza-paid':early?'namaz-upcoming':'namaz-missed')+
    (waiting?' qaza-holding':'')+'" data-action="qaza-record" data-value="'+prayer+
    '" data-day="'+day+'" data-kind="'+kind+'" aria-label="'+esc(label+'، '+qazaDateFormat.format(date)+'، '+state)+

    '<time class="qaza-day-date" datetime="'+day+'">'+esc((showYear?qazaDateFormat:qazaShortFormat).format(date))+'</time>' +
    (kind==='month'?'<strong class="prayer-name">'+label+'</strong>':'') +
    '<span>'+(completed?'✓ ':'')+state+'</span>'+
    (waiting?'<span class="qaza-hold-count"><bdi data-qaza-countdown>'+qazaSeconds(hold)+'</bdi> '+tr('sec','سیکنڈ')+'</span>':'')+
    '</button>';
}

function qazaCalendar(id,plan,now,today) {
  const from = qazaMonthStart(plan.start);
  const to = qazaMonthStart(today);
  const month = qazaMonth && qazaMonth>=from && qazaMonth<=to ? qazaMonth : from;
  const start = Math.max(dateNumber(plan.start),dateNumber(month));
  const end = Math.min(dateNumber(today),dateNumber(shiftQazaMonth(month,1))-1);
  const hold = qazaActiveHold();
  return tr("<section class=\"qaza-section qaza-calendar\"><h2>Make-up calendar</h2><div class=\"namaz-calendar-bar\" dir=\"ltr\">", '<section class="qaza-section qaza-calendar"><h2>قضا کیلنڈر</h2><div class="namaz-calendar-bar" dir="ltr">') +
    tr("<button class=\"button secondary\" data-action=\"qaza-month\" data-value=\"-1\" aria-label=\"Previous make-up month\"", '<button class="button secondary" data-action="qaza-month" data-value="-1" aria-label="پچھلا قضا مہینہ"')+(month===from?' disabled':'')+'>‹</button>' +
    '<output id="qaza-month-label" tabindex="-1">'+esc(qazaMonthFormat.format(new Date(month+'T00:00:00Z')))+'</output>'+
    tr("<button class=\"button secondary\" data-action=\"qaza-month\" data-value=\"1\" aria-label=\"Next make-up month\"", '<button class="button secondary" data-action="qaza-month" data-value="1" aria-label="اگلا قضا مہینہ"')+(month===to?' disabled':'')+'>›</button></div>' +
    '<div class="qaza-columns">' + prayers.map(([prayer,label])=>{
      const open = [], completed = [];
      for (let number=start; number<=end; number++) {
        const day = qazaDate(number);
        const eligible=qazaEligible(id,day,prayer,now,today);
        const early=day===today&&!eligible&&!alreadyOnTime(knownPrayerStatus(id,day,prayer));
        if(!eligible&&!early)continue;
        if(knownPrayerStatus(id,day,prayer)==='made') {
          // The just-completed prayer stays in its original pending slot for 15s.
          if (hold?.prayer===prayer && hold.day===day) open.push({day,held:true});
          else completed.push(day);
        } else open.push({day,early});
      }
      const rows=open.map(entry=>'<li>'+qazaDayButton(prayer,label,entry.day,Boolean(entry.held),'month',entry.early)+'</li>')
        .concat(completed.map((day,index)=>'<li'+(index===0&&open.length?' class="qaza-paid-start"':'')+'>'+qazaDayButton(prayer,label,day,true)+'</li>'));
      return '<section class="qaza-column" data-qaza-prayer="'+prayer+'"><h3>'+label+'</h3>' +
        (rows.length?'<ol>'+rows.join('')+'</ol>':tr("<p>No missed prayers</p>", '<p>کوئی قضا نہیں</p>'))+'</section>';
    }).join('')+'</div></section>';
}

    '<button class="namaz-missed qaza-options-missed" data-action="qaza-mode" data-value="missed" aria-pressed="'+(qazaMode==='missed')+tr("\">○ Missed</button>", '">○ قضا</button>') +
    '<button class="qaza-options-paid" data-action="qaza-mode" data-value="made" aria-pressed="'+(qazaMode==='made')+tr("\">✓ Made up</button></div>", '">✓ قضا ادا</button></div>') +

       tr('✓ Make-up saved. Next attendance available in ', '✓ قضا ادا محفوظ۔ اگلی حاضری ')+
       '<bdi data-qaza-seconds>'+qazaSeconds(hold)+'</bdi> '+
       tr('seconds.','سیکنڈ بعد لگ سکے گی۔')+'</p>':'') +
    tr("<section class=\"qaza-section\"><h2>Oldest outstanding prayer</h2><div class=\"qaza-next-grid\">", '<section class="qaza-section"><h2>ہر نماز کی اگلی باقی قضا</h2><div class="qaza-next-grid">')+
    prayers.map(([id,label])=>'<div class="qaza-next-card"><strong>'+label+'</strong>'+

        qazaDayButton(id,label,hold?.prayer===id && knownPrayerStatus(person.id,hold.day,id)==='made'?hold.day:byPrayer[id].next,
          hold?.prayer===id && knownPrayerStatus(person.id,hold.day,id)==='made','next') :
        tr("<p class=\"qaza-next-empty\">None remaining</p>", '<p class="qaza-next-empty">کوئی باقی نہیں</p>'))+'</div>').join('')+

function saveQazaStart(form,data) {
  if (!form.isConnected || section!=='namaz' || namazView!=='qaza' || !currentUser()) return;
  const plan = qazaPlan(currentUserId);
  if (plan.start && !qazaEditing) return;
  const start = String(data.get('start') || '');
  const number = dateNumber(start);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(start) || !Number.isFinite(number) || qazaDate(number)!==start || start>prayerDate(currentUserId)) {
    setFeedback('qaza-date-feedback',tr("Select today or an earlier date.", 'آج یا اس سے پہلے کی درست تاریخ منتخب کریں۔'));
    return;
  }
  plan.start = start;
  qazaLocalRevision++;
  qazaEditing = false;
  qazaDateDraft = null;
  qazaMonth = qazaMonthStart(start);
  const saved = saveOfflineState();
  render({keepScroll:true});

}

function saveQazaTarget(form,data) {
  if (!form.isConnected || section!=='namaz' || namazView!=='qaza' || !currentUser()) return;
  const target = Number(data.get('target'));
  if (!Number.isSafeInteger(target) || target<1) {
    setFeedback('qaza-target-feedback',tr("Enter a positive daily target.", 'روزانہ ہدف کے لیے درست مثبت عدد درج کریں۔'));
    return;
  }
  qazaPlan(currentUserId).target = target;
  qazaLocalRevision++;
  qazaTargetDraft = null;
  const saved = saveOfflineState();
  render({keepScroll:true});
  setFeedback('qaza-target-feedback',saved?tr("Goal saved on device. Syncing…", 'ہدف موبائل پر محفوظ ہے؛ Firebase میں محفوظ ہو رہا ہے…'):tr("This session cannot persist your goal.", 'ہدف مستقل محفوظ نہیں ہوا۔'),saved);
}

function unlockQazaDate() {
  const plan = qazaPlan(currentUserId);
  if (!plan.start || qazaEditing) return;
  const now = performance.now();
  qazaUnlockCount = now-qazaUnlockAt<1500 ? qazaUnlockCount+1 : 1;
  qazaUnlockAt = now;
  if (qazaUnlockCount<3) return;
  qazaUnlockCount = 0;
  qazaEditing = true;
  render({keepScroll:true});
  app.querySelector('#qaza-date-form [name="start"]')?.focus({preventScroll:true});
}

function handleQazaInput(input) {
  if (input.form?.id==='qaza-date-form') qazaDateDraft = input.value;
  if (input.form?.id!=='qaza-target-form') return;
  qazaTargetDraft = input.value;
  const button = input.form.querySelector('.qaza-save');
  const saved = Boolean(qazaPlan(currentUserId).target) && Number(input.value)===qazaPlan(currentUserId).target;
  button.classList.toggle('saved',saved);
  button.classList.toggle('editing',!saved);
  button.textContent = saved?tr("✓ Saved", '✓ محفوظ'):tr("Save", 'محفوظ کریں');
}

function handleQazaAction(action,button,value) {
  if (section!=='namaz' || namazView!=='qaza') return false;
  const today = prayerDate(currentUserId);
  const plan = qazaPlan(currentUserId);
  if (action==='qaza-unlock') unlockQazaDate();
  else if (action==='qaza-mode' && ['made','missed'].includes(value)) {
    qazaMode = value;
    for (const choice of app.querySelectorAll('[data-action="qaza-mode"]')) choice.setAttribute('aria-pressed',String(choice===button));
  } else if (action==='qaza-month' && ['-1','1'].includes(value)) {
    const first = qazaMonthStart(plan.start);
    const target = shiftQazaMonth(qazaMonth||first,Number(value));
    if (target<first || target>qazaMonthStart(today)) return true;
    qazaMonth = target;
    render({keepScroll:true});
    const arrow = app.querySelector('[data-action="qaza-month"][data-value="'+value+'"]');
    (arrow?.disabled?document.getElementById('qaza-month-label'):arrow)?.focus({preventScroll:true});
  } else if (action==='qaza-record') {
    // Shared guard across next-pending and calendar buttons; refresh cannot bypass it.
    const waiting=qazaActiveHold();
    if (waiting) {
      setFeedback('qaza-entry-feedback',tr('Wait before marking another make-up prayer: ',
        'اگلی قضا حاضری سے پہلے انتظار کریں: ')+qazaSeconds(waiting)+tr(' seconds',' سیکنڈ'));
      return true;
    }
    const day = button.dataset.day;
    const kind = button.dataset.kind;
    const old = knownPrayerStatus(currentUserId,day,value)==='made'?'made':'missed';
    if (qazaMode===old) {
      setFeedback('qaza-entry-feedback',old==='made'?tr("This prayer is already marked as made up.", 'یہ قضا پہلے ہی ادا درج ہے۔'):tr("This prayer is already marked as missed.", 'یہ نماز پہلے ہی قضا درج ہے۔'),true);
      return true;
    }
    if (!setQazaRecord(currentUserId,day,value,qazaMode)){
      setFeedback('qaza-entry-feedback',tr("Select Made up to record a Qaza prayer before the normal prayer window ends.",
        'نماز کا وقت ختم ہونے سے پہلے قضا ادا کرنے کے لیے «قضا ادا» منتخب کریں۔'));
      return true;
    }
    qazaLocalRevision++;
    const saved = saveOfflineState();
    const label = prayers.find(([id])=>id===value)[1];
    // Only successfully marked make-up prayers start the 15-second hold.
    if(qazaMode==='made') qazaStartHold(value,day);
    render({keepScroll:true});
    if(qazaMode==='made')app.querySelector('#qaza-wait-status')?.focus({preventScroll:true});
    else {
      const base = '[data-action="qaza-record"][data-value="'+value+'"][data-kind="'+kind+'"]';
      (app.querySelector(base+(kind==='month'?'[data-day="'+day+'"]':'')) || app.querySelector('[data-action="qaza-mode"][aria-pressed="true"]'))?.focus({preventScroll:true});
    }
    setFeedback('qaza-entry-feedback',saved?label+(qazaMode==='made'?tr(" · Make-up saved", ' · قضا ادا محفوظ'):tr(" · Marked as missed again.", ' · دوبارہ قضا درج ہو گئی۔')):tr("Entry saved for this session.", 'اندراج اس سیشن میں محفوظ ہے۔'),saved);
  } else return false;
  return true;
}

function nextPrayerCountdown(person,now=Date.now()){
 if(!person)return "";
 const config=prayerPrefs(person.id);
 if(!config.confirmed)return tr("Choose your city in Prayer settings to show the next prayer countdown.",
  "اگلی نماز کا وقت دیکھنے کے لیے نماز کی ترتیبات میں اپنا مقام منتخب کریں۔");
 try{
   const parts=zonedParts(now,config.zone),key=parts.year+"-"+parts.month+"-"+parts.day;
   const today=prayerTimes(config,key);
   const upcoming=prayers.map(([id,label])=>({label,start:today[id]?.[0]}))
     .find(row=>Number.isFinite(row.start)&&row.start>now);
   const tomorrow=prayerTimes(config,shiftedPrayerDate(key,1));
   const next=upcoming||{label:tr("Fajr","فجر"),start:tomorrow.fajr?.[0]};
   if(!Number.isFinite(next.start))return tr("Prayer times unavailable.","نماز کے اوقات دستیاب نہیں۔");
   const seconds=Math.max(0,Math.ceil((next.start-now)/1000));
   const hh=String(Math.floor(seconds/3600)).padStart(2,"0");
   const mm=String(Math.floor(seconds/60)%60).padStart(2,"0");
   const ss=String(seconds%60).padStart(2,"0");
   return next.label+tr(" prayer starts in "," نماز تک باقی وقت ")+" "+hh+":"+mm+":"+ss;
 }catch(error){return tr("Please check Prayer settings.","نماز کے اوقات کی ترتیبات چیک کریں۔");}
}

  language = value;

function signIn(id, notice = '') {
  const person = getUser(id);
  if (!person || person.disabled) return setFeedback('feedback',tr("This member account is inactive.", 'یہ ممبر اکاؤنٹ فعال نہیں ہے۔'));
  currentUserId = id;
  readingSession = {};
  selectedNamazStatus = 'jamat';
  selectedNamazMonth = '';
  namazView = 'attendance';
  resetQazaView();
  activePrayerAlert = null;
  monitorTimeKey = '';
  timingPanelKey = '';
  if (prayerPrefs(id).sound) unlockPrayerAudio();
  section = 'overview';
  selectedPeriod = 'daily';
  record = 'current';
  groupFilter = null;
  message = notice;
  render();
}

function findUsername(value) {
  return users.find(person => person.username.toLowerCase() === value.trim().toLowerCase());
}

function findLogin(value) {
  const loginId = value.trim();
  const match = /^DI-(\d+)$/i.exec(loginId);
  return match ? getUser(Number(match[1])) : findUsername(loginId);
}

function validatePassword(password, confirmation) {
  if (password.length < 8) return tr("Use at least eight characters for your password.", 'پاس ورڈ کم از کم آٹھ حروف کا رکھیں۔');
  if (password !== confirmation) return tr("Enter the same password in both fields.", 'دونوں پاس ورڈ ایک جیسے درج کریں۔');
  return '';
}

async function register(data) {
  const name = data.get('name').trim();
  const username = data.get('username').trim();
  if (!name) return setFeedback('feedback',tr("Enter your name.", 'اپنا نام درج کریں۔'));
  if (!/^[A-Za-z0-9._-]{3,24}$/.test(username)) return setFeedback('feedback',tr("Enter a valid Login ID.", 'درست یوزر آئی ڈی درج کریں۔'));
  if (/^DI-\d+$/i.test(username) || findUsername(username)) return setFeedback('feedback',tr("This Login ID is already in use.", 'یہ یوزر آئی ڈی پہلے سے استعمال میں ہے۔'));
  const problem = validatePassword(data.get('password'),data.get('confirm'));
  if (problem) return setFeedback('feedback',problem);
  const code = data.get('invite').trim().replace(/[۰-۹٠-٩]/g, digit => {
    const zero = digit >= '۰' ? '۰' : '٠';
    return String(digit.codePointAt(0) - zero.codePointAt(0));
  }).toLowerCase();
  const invite = invites.get(code);
  if (!/^[a-z0-9]{6}$/.test(code) || !invite || invite.used || invite.revoked || getUser(invite.by)?.disabled) {
    return setFeedback('feedback',tr('Enter a valid, unused invite code.','درست اور غیر استعمال شدہ دعوتی کوڈ درج کریں۔'));
  }
  if (registrationChecks.some(field => data.get(field) !== 'yes')) {
    return setFeedback('feedback',tr('Read the pledge and check all three boxes.','حلف پڑھیں اور تینوں خانوں پر نشان لگائیں۔'));
  }
  const verifier = await offlineVerifier(data.get('password'));
  if (screen !== 'register' || currentUser()) return;
  if (findUsername(username) || invite.used || invite.revoked || !invites.has(code) || getUser(invite.by)?.disabled) {
    return setFeedback('feedback',tr("This Login ID or invite code is unavailable.", 'یہ آئی ڈی یا دعوتی کوڈ دستیاب نہیں۔'));
  }
  const id = nextMemberId++;
  users.push({id,name,username,inviter:invite.by,daily:0,added:0,disabled:false,joined:new Date(),age:'',birthDate:'',gender:'Male',phone:'',address:'',photo:'',pledgeAcceptedAt:new Date().toISOString()});
  setOfflinePassword(id,data.get('password'),verifier);
  invite.used = true;
  saveOfflineState();
  signIn(id,tr("Account created. Your member number is ", 'اکاؤنٹ بن گیا۔ آپ کا ممبر نمبر ') + serial(id) + tr(".", ' ہے۔'));
}

function createInvite() {
  const alphabet = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const random = new Uint32Array(1);
  const limit = 2 ** 32 - ((2 ** 32) % alphabet.length);
  let code;
  do {
    code = '';
    while (code.length < 6) {
      crypto.getRandomValues(random);
      if (random[0] < limit) code += alphabet[random[0] % alphabet.length];
    }
  } while (!/[a-z]/.test(code) || !/[0-9]/.test(code) || issuedInviteCodes.has(code) || invites.has(code));
  issuedInviteCodes.add(code);
  invites.set(code,{by:currentUserId,used:false});
  saveOfflineState();
  const output = document.getElementById('invite-value');
  output.innerHTML = '<bdi class="invite-code">' + code + '</bdi>';
  document.querySelector('[data-action="copy-invite"]').hidden = false;
  setFeedback('invite-feedback',tr("Share this code with the new member.", 'یہ کوڈ نئے ممبر کو دیں۔'),true);
}

async function copyInvite() {
  const code = document.getElementById('invite-value').textContent;
  try {
    await navigator.clipboard.writeText(code);
    setFeedback('invite-feedback',tr("Code copied.", 'کوڈ کاپی ہو گیا۔'),true);
  } catch {
    const range = document.createRange();
    range.selectNodeContents(document.getElementById('invite-value'));
    const selected = window.getSelection();
    selected.removeAllRanges();
    selected.addRange(range);
    setFeedback('invite-feedback',tr("Code selected. Copy it using your phone's menu.", 'کوڈ منتخب ہے۔ فون کے کاپی مینو سے کاپی کریں۔'),true);
  }
}

app.addEventListener('click', event => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const {action,value} = button.dataset;
  if (action === 'language') return changeLanguage(value);

  if (action === 'eye' || action === 'peek') {
    const wrap = button.closest('.input-wrap');
    const input = wrap.querySelector('input');
    const toggleEye = wrap.querySelector('[data-action="eye"]');
    const isVisible = toggleEye.getAttribute('aria-pressed') === 'true';
    clearTimeout(peekTimers.get(input));
    if (action === 'eye') {
      input.type = isVisible ? 'password' : 'text';
      toggleEye.setAttribute('aria-pressed', String(!isVisible));
      toggleEye.setAttribute('aria-label', isVisible ? tr("Show password", 'پاس ورڈ دکھائیں') : tr("Hide password", 'پاس ورڈ چھپائیں'));
    } else if (!isVisible) {
      input.type = 'text';
      peekTimers.set(input, setTimeout(() => { input.type = 'password'; }, 2000));
    }
    return;
  }
  if (action === 'screen') {
    screen = value;
    recoveryUserId = null;
    message = '';
    render();
    return;
  }
  if (action === 'demo-login') return signIn(Number(value));
  if (action === 'logout') {
    currentUserId = null;
    pendingPhoto=null;
    readingSession = {};
    photoDraft = null;
    screen = 'login';
    message = '';
    render();
    return;
  }
  if (!currentUser()) return;
  if (handleReaderAction(action,button,value) || handleTimingAction(action,value) ||
      handleQazaAction(action,button,value) || handleNamazAction(action,button,value)) return;
  if (action === 'create-invite') return createInvite();
  if (action === 'copy-invite') return copyInvite();
  if (action === 'toggle-live') {
    liveRunning = !liveRunning;
    render({keepScroll:true});
    app.querySelector('[data-action="toggle-live"]')?.focus({preventScroll:true});
    return;
  }
  if (action === 'cancel-delete') return document.getElementById('delete-member')?.close();
  if (action === 'toggle-user' || action === 'open-delete') {
    const target = getUser(Number(value));
    if (currentUserId !== 1 || !target || target.id === 1) return;
    if (action === 'open-delete') return document.getElementById('delete-member')?.showModal();
    target.disabled = !target.disabled;
    if (target.disabled) revokeInvites(target.id);
    saveOfflineState();
    message = serial(target.id) + (target.disabled ? tr(" has been suspended.", ' عارضی طور پر بند کر دیا گیا۔') : tr(" has been restored.", ' دوبارہ فعال ہو گیا۔'));
    return render({keepScroll:true});
  }
  message = '';
  if (action === 'nav') {
    if (section === 'wazifa-reader' && value !== 'wazifa-reader') readingSession.lastTap = null;
    if(value==='tasbih')window.duroodWazaif?.back?.();
    section = value;
    groupFilter = null;
    if(!currentPhotoSelection())photoDraft=null;
  }
  if(action==='check-member-photo'){
    const person=getUser(Number(value));
    if(currentUser()?.isOwner&&person?.uid)window.duroodCheckMemberPhoto?.(person.uid);
    return;
  }
  if (action === 'reader-list-day') {
    if(!currentUser()?.isOwner||!['-1','1'].includes(value))return;
    const day=parseDay(readerDayLabel());
    day.setDate(day.getDate()+Number(value));
    const next=dateKey(day),today=globalDateKey();
    if(next>today||next<"1900-01-01")return;
    readerListDay=next===today?null:next;
    previousDayReaders=null;readerListError=false;readerAuditPast=null;
    refreshReaderDateControls();refreshReaderAudit();
    const list=document.getElementById("today-readers");if(list)list.innerHTML=readerList();
    window.duroodWatchReaderDate?.(readerListDay);
    if(readerDayLabel()===legacyRepairDay)window.duroodAutoRepairLegacyReader?.();
    return;
  }
  if (action === 'record') record = value;
  if (action === 'period') selectedPeriod = value;
  if (action === 'profile' && currentUser()?.isOwner && visibleMembers().some(member => member.id === Number(value))) {
    profileId = Number(value);
    section = 'profile';
  }
  if (action === 'branch') {
    if(currentUser()?.isOwner!==true)return;
    const targetId=Number(value),target=getUser(targetId);
    if(!target||target.deleted)return;
    if(ownerViewingWomen() ? target.gender!=='Female' || target.isOwner : target.gender==='Female')return;
    groupFilter = targetId === currentUserId ? null : targetId;
    section = 'tree';
  }
  if (action === 'group' && currentUser()?.isOwner && visibleMembers().some(member => member.id === Number(value) && hasGroup(member.id))) {
    groupFilter = Number(value);
    section = 'tree';
  }
  const inRanking = action === 'record' || action === 'period';
  render({keepScroll:inRanking});
  if (inRanking) {
    const selected = app.querySelector('[data-action="' + action + '"][aria-pressed="true"]');
    selected?.focus({preventScroll:true});
  }
});
