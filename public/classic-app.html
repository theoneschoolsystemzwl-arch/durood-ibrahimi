    const women=rows.filter(x=>x.gender==='female' && ids.has(x.uid)).sort((a,b)=>ids.get(a.uid)-ids.get(b.uid));
    const numbers=new Map(women.map((x,i)=>[x.uid,i+1]));
    users.length=0;
    for(const x of rows){
      if(!Number.isSafeInteger(Number(x.memberNumber))||Number(x.memberNumber)<1)continue;
      const memberId=Number(x.memberNumber);
      users.push({
        id:memberId,uid:x.uid,isOwner:x.uid===profile.uid && profile.role==="owner",name:x.name||"Member",username:x.username||"",
        isFoundingSpouse:x.gender==="female" && (profile.role==="owner" ? numbers.get(x.uid)===1 : /^iramshahzad(?:i)?$/i.test(x.username||"") && x.inviterUid==="vt06NK7DcmgPpUKD4R7EgwzAxIH3"),
        sideNumber:profile.role==="owner" ? numbers.get(x.uid) : undefined,
        inviter:ids.get(x.inviterUid)||null,daily:0,added:Number(totals.memberCounts?.[x.uid]||0),
        disabled:x.disabled===true,joined:x.joined instanceof Date?x.joined:new Date(),
        age:"",birthDate:"",gender:x.gender==="female"?"Female":
          x.gender==="male"?"Male":"",phone:"",address:"",photo:x.photo||"",
        deleted:x.deleted===true
      });
    }
    if(!getUser(Number(profile.memberNumber))) {
      users.push({id:Number(profile.memberNumber)||1,uid:profile.uid,isOwner:profile.role==="owner",name:profile.name||"Owner",
        username:profile.username||"owner",inviter:null,daily:0,
        added:Number(totals.memberCounts?.[profile.uid]||0),disabled:false,joined:new Date(),
        age:"",birthDate:"",gender:"Male",phone:"",address:"",photo:"",deleted:false});
    }
    for(const member of users)if(member.isFoundingSpouse)member.sideNumber=1;
    users.sort((a,b)=>a.id-b.id);
    globalTotal=Number(totals.global||0);
    liveAdded=0;
    selectedPeriod="all";
    record="current";
    signIn(Number(profile.memberNumber)||1);
    app.style.visibility="visible";
  },
  tap(){if(currentUser())tapDurood();},
  manual(form,data){if(currentUser())submitManual(form,data);},
  addInvite(code){
    invites.set(code,{by:currentUserId,used:false});issuedInviteCodes.add(code);
    const out=document.getElementById("invite-value");
    if(out)out.innerHTML='<bdi class="invite-code">'+esc(code)+'</bdi>';
    const copy=app.querySelector('[data-action="copy-invite"]');
    if(copy)copy.hidden=false;
    setFeedback("invite-feedback",tr("Share this one-use code with a member.","یہ ایک مرتبہ استعمال ہونے والا دعوتی کوڈ ہے۔"),true);
  },
  userUid(memberNo){return getUser(Number(memberNo))?.uid||null;},
  changeMember(memberNo,disabled){
    const p=getUser(Number(memberNo));if(!p)return;
    p.disabled=disabled;render({keepScroll:true});
  },
  userForCurrent(){return currentUser()?.uid||null;},
  photoSelection:currentPhotoSelection,
  currentName:()=>currentUser()?.name,
  setName(value,image,selection){
    const p=currentUser();if(!p)return;
    if(image){p.photo=image;if(pendingPhoto===selection){pendingPhoto=null;photoDraft=null;}}
    p.name=value;render({keepScroll:true});
    setFeedback("profile-feedback",tr("Profile saved.","پروفائل محفوظ ہو گیا۔"),true);
  },
  showMessages(rows){
    window.duroodChatRows=Array.isArray(rows)?rows:[];
    if(section==='messages')render({keepScroll:true});
  },
  loadPrayerDays(days){
    const p=currentUser();if(!p)return;
    attendance[p.id]={};
    for(const item of days){
      if(item?.date&&item?.statuses&&typeof item.statuses==="object")
        attendance[p.id][item.date]={...item.statuses};
    }
    if(section==="namaz")render({keepScroll:true});
  },
  prayerStatuses(day){
    const states={...(attendance[currentUserId]?.[day]||{})};
    for(const [name] of prayers){
      const v=knownPrayerStatus(currentUserId,day,name);
      if(v==="made"||v==="missed")states[name]=v;
    }
    return states;
  },
  notice(text){const el=app.querySelector("#read-status")||app.querySelector("#namaz-feedback")||app.querySelector("#invite-feedback");
    if(el)el.textContent=String(text); else window.alert(String(text));},
  status(id,msg,ok){setFeedback(id,msg,!!ok);}
};

render();
// No fabricated live recitations: only Firebase-backed totals are shown.
setInterval(updateClock, 250);
setInterval(updateNamazDate, 1000);
setInterval(monitorPrayerTime, 1000);
document.addEventListener('visibilitychange',() => {
  if (document.hidden) readingSession.lastTap = null;
  else { updateNamazDate(); monitorPrayerTime(); }
});
document.addEventListener('fullscreenchange',updateFullscreenLabel);
document.addEventListener('keydown',event => {
  if (event.key !== 'Escape') return;
  const reader = document.querySelector('.reader.is-focused');
  if (!reader || reader.querySelector('dialog[open]')) return;
  reader.classList.remove('is-focused');
  updateFullscreenLabel();
});
</script>

<script type="module">
import "./profile-contacts.js";
import {auth,db} from "./firebase-client.js";
import {loadMemberProfile,signOut,onAuthStateChanged} from "./member-auth.js";
import {readingsSpark,invitationSpark,memberActiveSpark,memberDeleteSpark,classifyLegacyMemberSpark,profileNameSpark,prayerSaveSpark,prayerMonthSpark,groupMessagesSpark,sendGroupMessageSpark,resetMemberSessionSpark} from "./spark-data.js";
import {reauthenticateWithCredential,EmailAuthProvider,updatePassword} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import {writeBatch,serverTimestamp,collection,doc,getDoc,getDocs,query,where,limit,orderBy} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const bridge=window.duroodClassicBridge;
const ui=document.getElementById("app");
const errorText=e=>String(e?.message||e?.code||"Firebase unavailable").slice(0,180);
let currentProfile=null;
let readingQueue=Promise.resolve();
let switchingSide=false;
try{
  window.duroodOwnerSide=localStorage.getItem("durood-owner-side")==="female"?"female":"male";
}catch{window.duroodOwnerSide="male";}
async function refreshGroupChat(){
  const side=window.duroodCurrentSide;
  if(!side)return;
  const result=await groupMessagesSpark(side);
  if(side!==window.duroodCurrentSide)return;
  const selector='#group-message-form textarea';
  const draft=ui.querySelector(selector)?.value;
  bridge.showMessages(result.messages);
  const input=ui.querySelector(selector);
  if(input && draft)input.value=draft;
}
async function hydrate(){
  const user=auth.currentUser;
  if(!user){window.location.replace("/");return;}
  const profile=await loadMemberProfile(user);
  const owner=profile.role==="owner";
  const side=owner && window.duroodOwnerSide==="female"?"female":
    (!owner && profile.gender==="female"?"female":"male");
  const docs=new Map([[profile.uid,profile]]);
  if(owner){
    const snap=await getDocs(collection(db,"members"));
    // Count the Owner's own invites across BOTH sides without counting
    // invitations created by the wife or another member.
    window.duroodOwnerInviteTotal=snap.docs.filter(x=>x.data().inviterUid===profile.uid).length;
    for(const x of snap.docs){
      if(x.id===profile.uid)continue;
      const data={...x.data(),uid:x.id};
      const gender=data.gender==="female"?"female":"male";
      if(gender===side)docs.set(x.id,data);
    }
  }else{
    window.duroodOwnerInviteTotal=0;
    const invited=await getDocs(query(collection(db,"members"),
      where("inviterUid","==",profile.uid),where("gender","==",side),limit(200)));
    invited.docs.forEach(x=>{
      const d={...x.data(),uid:x.id};
      if((d.gender==="female"?"female":"male")===side)docs.set(x.id,d);
    });
  }
  // Only fetch the selected side; the Firebase Rules also validate gender.
  const counts=new Map();
  try{
    const ranked=await getDocs(query(collection(db,"memberCounts"),
      where("gender","==",side),limit(200)));
    for(const item of ranked.docs){
      counts.set(item.id,Number(item.get("total")||0));
    }
    const top=[...ranked.docs].sort((a,b)=>
      Number(b.get("total")||0)-Number(a.get("total")||0)).slice(0,10);
    for(const item of top){
      if(!docs.has(item.id)){
        const member=await getDoc(doc(db,"members",item.id));
        if(member.exists())docs.set(item.id,{...member.data(),uid:item.id});
      }
    }
  }catch(e){console.warn("Side ranking unavailable",e.code||e);}
  const [sideTotal,count]=await Promise.all([
    getDoc(doc(db,"genderStats",side)),
    getDoc(doc(db,"memberCounts",profile.uid)).catch(error=>{
      console.warn("Personal count unavailable",error.code);
      return null;
    })
  ]);
  const rows=[...docs.values()].filter(d=>d.uid===profile.uid||
    (d.gender==="female"?"female":"male")===side).map(d=>({
      uid:d.uid,name:d.name,username:d.username,gender:d.gender,
      memberNumber:d.memberNumber,deleted:d.deleted===true,
      disabled:d.disabled===true,inviterUid:d.inviterUid||null,
      joined:d.createdAt?.toDate?.()||new Date()
    }));
  const memberCounts=Object.fromEntries(counts);
  if(count?.exists())memberCounts[profile.uid]=Number(count.get("total")||0);
  const ownRow=rows.find(row=>row.uid===profile.uid);
  if(ownRow){
    try{ownRow.photo=(await getDoc(doc(db,"memberPhotos",profile.uid))).data()?.image||"";}
    catch(error){console.warn("Profile photo unavailable",error.code);}
  }
  if(auth.currentUser?.uid!==profile.uid)return;
  window.duroodCurrentSide=side;
  window.duroodChatRows=[];
  bridge.enter(profile,rows,{
    global:sideTotal.exists()?Number(sideTotal.get("totalRecitations")||0):0,
    memberCounts
  });
  currentProfile=profile;
  if(window.parent!==window){
    window.parent.postMessage({type:"durood-classic-ready",uid:profile.uid},location.origin);
  }
  try{
    const month=new Date().toISOString().slice(0,7);
    const result=await prayerMonthSpark(month);
    if(auth.currentUser?.uid===profile.uid && window.duroodCurrentSide===side){
      bridge.loadPrayerDays(result.days||[]);
    }
  }catch(e){console.warn("Prayer history unavailable",e.code||e);}
}
onAuthStateChanged(auth,async user=>{
  if(!user){window.location.replace("/");return;}
  try{await hydrate();}
  catch(err){
    console.error("Classic Firebase dashboard",err);
    if(window.parent!==window){
      window.parent.postMessage({type:"durood-classic-error"},location.origin);
    }
    document.getElementById("app").style.visibility="visible";
    document.getElementById("app").innerHTML='<main style="padding:28px;max-width:580px;margin:auto"><h2>Firebase Account</h2><p>Dashboard could not load: '+errorText(err).replace(/[<>&]/g,"")+'</p><a href="/">Return to sign in</a></main>';
  }
});
ui.addEventListener("click",event=>{
  const button=event.target.closest("button[data-action]");
  if(!button||!currentProfile)return;
  const action=button.dataset.action;
  if(action==="switch-side"){
    event.stopImmediatePropagation();event.preventDefault();
    if(currentProfile.role!=="owner"||switchingSide)return;
    const next=button.dataset.side||(window.duroodCurrentSide==="female"?"male":"female");
    if(next===window.duroodCurrentSide)return;
    switchingSide=true;button.disabled=true;
    window.duroodOwnerSide=next;
    hydrate().then(()=>{
      try{localStorage.setItem("durood-owner-side",next);}catch{}
    }).catch(e=>{
      window.duroodOwnerSide=window.duroodCurrentSide;
      bridge.notice(errorText(e));
    }).finally(()=>{switchingSide=false;if(button.isConnected)button.disabled=false;});
    return;
  }
  if(action==="chat-reply"){
    event.stopImmediatePropagation();event.preventDefault();
    if(currentProfile.role!=="owner" || window.duroodCurrentSide!=="female")return;
    const row=window.duroodChatRows.find(entry=>entry.id===button.dataset.value);
    const input=ui.querySelector('#group-message-form textarea');
    if(!row || !input)return;
    const excerpt=String(row.body||"").replace(/\s+/g," ").slice(0,160);
    const quote="↪ "+String(row.senderName||"Member").slice(0,60)+": "+excerpt+"\n";
    if(input.value.length+quote.length<=input.maxLength)input.value=quote+input.value;
    input.focus();
    input.setSelectionRange(input.value.length,input.value.length);
    return;
  }
  if(action==="chat-refresh" || (action==="nav"&&button.dataset.value==="messages")){
    if(action==="chat-refresh"){event.stopImmediatePropagation();event.preventDefault();}
    // Let the original dashboard navigation render before populating messages.
    setTimeout(()=>refreshGroupChat().catch(e=>bridge.status("group-chat-feedback",errorText(e),false)),0);
    return;
  }
  if(action==="classify-gender"){
    event.stopImmediatePropagation();event.preventDefault();
    const n=Number(button.dataset.value),uid=bridge.userUid(n),gender=button.dataset.gender;
    if(currentProfile.role!=="owner"||!uid||!["male","female"].includes(gender))return;
    if(!window.confirm("اس ممبر کو "+gender+" سائیڈ میں مستقل شامل کریں؟"))return;
    button.disabled=true;
    classifyLegacyMemberSpark(uid,gender).then(()=>hydrate())
      .catch(e=>bridge.notice(errorText(e))).finally(()=>{if(button.isConnected)button.disabled=false;});
    return;
  }
  if(action==="logout"){
    event.stopImmediatePropagation();event.preventDefault();
    signOut(auth).then(()=>window.location.replace("/"))
      .catch(e=>bridge.notice(errorText(e)));return;
  }
  if(action==="create-invite"){
    event.stopImmediatePropagation();event.preventDefault();
    button.disabled=true;
    invitationSpark().then(code=>bridge.addInvite(code)).catch(e=>bridge.status("invite-feedback",errorText(e),false)).finally(()=>{if(button.isConnected)button.disabled=false;});
    return;
  }
  if(action==="reset-session"){
    event.stopImmediatePropagation();event.preventDefault();
    const n=Number(button.dataset.value),uid=bridge.userUid(n);
    if(currentProfile.role!=="owner"||!uid)return;
    if(!window.confirm("اس ممبر کے کھوئے ہوئے فون کا لاگ اِن لاک ختم کریں؟ صرف Owner کی اجازت سے۔"))return;
    button.disabled=true;
    resetMemberSessionSpark(uid).then(()=>bridge.notice("ممبر کا سیشن ری سیٹ ہوگیا؛ اب وہ دوبارہ لاگ اِن کر سکتا ہے۔"))
      .catch(e=>bridge.notice(errorText(e)))
      .finally(()=>{if(button.isConnected)button.disabled=false;});
    return;
  }
  if(action==="toggle-user"){
    event.stopImmediatePropagation();event.preventDefault();
    const n=Number(button.dataset.value),uid=bridge.userUid(n);
    if(currentProfile.role!=="owner"||!uid)return;
    button.disabled=true;
    const member=window.duroodClassicBridge;
    // Read the currently visible suspension state from this user's action label.
    const activating=/restore|enable|بحال|فعال/i.test(button.textContent||"");
    memberActiveSpark(uid,activating).then(()=>bridge.changeMember(n,!activating))
      .catch(e=>bridge.notice(errorText(e))).finally(()=>{if(button.isConnected)button.disabled=false;});
    return;
  }
  if(action==="open-delete"){
    event.stopImmediatePropagation();event.preventDefault();
    const n=Number(button.dataset.value),uid=bridge.userUid(n);
    if(currentProfile.role!=="owner"||!uid)return;
    if(!window.confirm("اکاؤنٹ عارضی حذف کریں؟ ڈیٹا اور DI نمبر محفوظ رہیں گے اور بعد میں بحال ہو سکیں گے۔"))return;
    button.disabled=true;
    memberDeleteSpark(uid).then(()=>hydrate())
      .catch(e=>bridge.notice(errorText(e))).finally(()=>{if(button.isConnected)button.disabled=false;});
    return;
  }
  if(action==="count-durood"){
    event.stopImmediatePropagation();event.preventDefault();
    // Serialise writes to avoid lost increments during rapid tapping.
    readingQueue=readingQueue.catch(()=>{}).then(async()=>{
      await readingsSpark(1);
      bridge.tap();
    }).catch(e=>bridge.notice("درود محفوظ نہیں ہو سکا: "+errorText(e)));
    return;
  }
  if(action==="namaz-mark"||action==="qaza-record"){
    const day=button.dataset.day;
    // Let the original calendar and qaza UI validate and update first.
    if(day)setTimeout(async()=>{
      try{await prayerSaveSpark(day,bridge.prayerStatuses(day));}
      catch(e){bridge.notice("نماز کا ریکارڈ Firebase میں محفوظ نہیں ہوا: "+errorText(e));}
    },0);
  }
},true);
ui.addEventListener("submit",event=>{
  const form=event.target;
  if(!currentProfile)return;
  if(form.id==="group-message-form"){
    event.preventDefault();event.stopImmediatePropagation();
    const value=String(new FormData(form).get("message")||"").trim();
    if(value.length<1||value.length>1200){
      bridge.status("group-chat-feedback","پیغام 1 سے 1200 حروف کا لکھیں۔",false);return;
    }
    const button=form.querySelector('button[type="submit"]');
    if(button)button.disabled=true;
    sendGroupMessageSpark(value,window.duroodCurrentSide).then(()=>{
      form.reset();return refreshGroupChat();
    }).catch(e=>bridge.status("group-chat-feedback",errorText(e),false))
      .finally(()=>{if(button?.isConnected)button.disabled=false;});
    return;
  }
  if(form.id==="manual-form"){
    event.preventDefault();event.stopImmediatePropagation();
    const d=new FormData(form),amount=Number(d.get("amount")),day=String(d.get("day")||"");
    if(!Number.isSafeInteger(amount)||amount<1||amount>10000||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(day)||day>new Date().toISOString().slice(0,10)){
      bridge.status("manual-feedback","درست تاریخ اور 1 تا 10000 تعداد درج کریں۔");return;
    }
    const button=form.querySelector('button[type="submit"],button:not([type])');
    if(button)button.disabled=true;
    readingsSpark(amount).then(()=>bridge.manual(form,d))
      .catch(e=>bridge.status("manual-feedback",errorText(e),false))
      .finally(()=>{if(button?.isConnected)button.disabled=false;});
  }else if(form.id==="profile-form"){
    event.preventDefault();event.stopImmediatePropagation();
    const name=String(new FormData(form).get("name")||"").trim();
    const selection=bridge.photoSelection();
    const button=form.querySelector('button[type="submit"],button:not([type])');
    if(button?.disabled)return;
    if(button)button.disabled=true;
    const uid=auth.currentUser?.uid;
    Promise.resolve(selection?.task).then(async image=>{
      if(!uid||auth.currentUser?.uid!==uid)throw Error("دوبارہ لاگ اِن کریں۔");
      if(selection && (!image || selection.uid!==uid))throw Error("تصویر دوبارہ منتخب کریں۔");
      if(image){
        const batch=writeBatch(db);
        if(name!==bridge.currentName()){
          if(name.length<2||name.length>60)throw Error("نام 2 تا 60 حروف میں لکھیں۔");
          batch.update(doc(db,"members",uid),{name,updatedAt:serverTimestamp()});
        }
        batch.set(doc(db,"memberPhotos",uid),{image});
        await batch.commit();
      }else await profileNameSpark(name);
      if(auth.currentUser?.uid===uid)bridge.setName(name,image,selection);
    }).catch(e=>bridge.status("profile-feedback",errorText(e),false))
      .finally(()=>{if(button?.isConnected)button.disabled=false;});
  }else if(form.id==="password-form"){
    event.preventDefault();event.stopImmediatePropagation();
    const d=new FormData(form),old=String(d.get("old")||""),next=String(d.get("password")||""),confirm=String(d.get("confirm")||"");
    if(next.length<8||next!==confirm){bridge.status("password-feedback","نئے پاس ورڈ اور تصدیق کو چیک کریں۔");return;}
    reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(auth.currentUser.email,old))
      .then(()=>updatePassword(auth.currentUser,next))
      .then(()=>{form.reset();bridge.status("password-feedback","Firebase پاس ورڈ تبدیل ہو گیا۔",true);})
      .catch(e=>bridge.status("password-feedback",errorText(e),false));
  }
},true);
</script>
