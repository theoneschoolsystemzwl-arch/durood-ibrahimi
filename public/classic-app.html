app.addEventListener('submit', async event => {
  event.preventDefault();
  const form = event.target;
  const data = new FormData(form);
  const person = currentUser();
  switch (form.id) {
    case 'login': {
      const match = findLogin(data.get('username'));
      if (!match || !await checkOfflinePassword(match.id,data.get('password'))) return setFeedback('feedback',tr("Incorrect Login ID or password.", 'یوزر آئی ڈی یا پاس ورڈ درست نہیں۔'));
      if (!form.isConnected) return;
      return signIn(match.id);
    }
    case 'register': return register(data);
    case 'reset': {
      const match = findLogin(data.get('username'));
      if (!match || match.disabled) return setFeedback('feedback',tr("This demo account does not exist.", 'یہ آزمائشی یوزر آئی ڈی موجود نہیں ہے۔'));
      recoveryUserId = match.id;
      render();
      return;
    }
    case 'reset-confirm': {
      if (data.get('recovery').trim() !== recoveryCode) return setFeedback('feedback',tr("Incorrect recovery code.", 'بحالی کوڈ درست نہیں۔'));
      const problem = validatePassword(data.get('password'),data.get('confirm'));
      if (problem) return setFeedback('feedback',problem);
      const memberId = recoveryUserId;
      const verifier = await offlineVerifier(data.get('password'));
      if (!form.isConnected || memberId !== recoveryUserId) return;
      setOfflinePassword(memberId,data.get('password'),verifier);
      saveOfflineState();
      recoveryUserId = null;
      screen = 'login';
      message = tr("Password changed. Log in with your new password.", 'پاس ورڈ بدل گیا۔ نئے پاس ورڈ سے لاگ اِن کریں۔');
      render();
      return;
    }
    case 'qaza-date-form': return saveQazaStart(form,data);
    case 'qaza-target-form': return saveQazaTarget(form,data);
    case 'prayer-location': return applyPrayerLocation(form,data);
    case 'prayer-alarm-form': return savePrayerAlarm(form,data);
    case 'daily-goal-form': return submitDailyGoal(form,data);
    case 'manual-form': return submitManual(form,data);
    case 'delete-form': {
      const member = getUser(Number(form.dataset.id));
      if (currentUserId !== 1 || !member || member.id === 1) return;
      if (data.get('confirmId').trim().toUpperCase() !== serial(member.id)) {
        return setFeedback('delete-feedback',tr("Enter the correct Member ID to confirm.", 'تصدیق کے لیے درست ممبر آئی ڈی درج کریں۔'));
      }
      return removeMember(member);
    }
    case 'profile-form': {
      if (!person || !data.get('name').trim()) return setFeedback('profile-feedback',tr("Enter your name.", 'نام درج کریں۔'));
      for (const key of ['name','age','birthDate','address']) person[key] = data.get(key).trim();
      if (photoDraft) person.photo = photoDraft;
      photoDraft = null;
      saveOfflineState();
      render({keepScroll:true});
      return setFeedback('profile-feedback',tr("Changes saved.", 'تبدیلیاں محفوظ ہو گئیں۔'),true);
    }
    case 'password-form': {
      if (!person || !await checkOfflinePassword(person.id,data.get('old'))) return setFeedback('password-feedback',tr("Current password is incorrect.", 'موجودہ پاس ورڈ درست نہیں۔'));
      const problem = validatePassword(data.get('password'),data.get('confirm'));
      if (problem) return setFeedback('password-feedback',problem);
      const verifier = await offlineVerifier(data.get('password'));
      if (!form.isConnected || person.id !== currentUserId) return;
      setOfflinePassword(person.id,data.get('password'),verifier);
      saveOfflineState();
      form.reset();
      for (const eye of form.querySelectorAll('[data-action="eye"]')) {
        eye.closest('.input-wrap').querySelector('input').type = 'password';
        eye.setAttribute('aria-pressed','false');
        eye.setAttribute('aria-label',tr("Show password", 'پاس ورڈ دکھائیں'));
      }
      return setFeedback('password-feedback',tr("New password saved.", 'نیا پاس ورڈ محفوظ ہو گیا۔'),true);
    }
  }
});

async function hydrate(){
  if(classicLogoutBlocked())return;

    stopCounters();

    else window.location.replace("/");
    return;
  }
  const profile=(window.parent!==window && window.parent.duroodVerifiedProfile?.(user.uid)) || await loadMemberProfile(user);
  // Read the member document rather than relying on a parent-frame cache for
  // the immutable registration timestamp. Never replace it with today's date.
  try{
    const own=await getDoc(doc(db,"members",user.uid));
    if(own.exists()&&auth.currentUser?.uid===user.uid){
      profile.createdAt=own.data().createdAt??null;
      profile.pledgeAcceptedAt=own.data().pledgeAcceptedAt??null;
    }
  }catch(error){console.warn("Membership date refresh unavailable",error?.code||error);}
  if(classicLogoutBlocked()||auth.currentUser?.uid!==user.uid)return;
  await Promise.race([syncGlobalClock(),new Promise(resolve=>setTimeout(resolve,2500))]);
  if(classicLogoutBlocked()||auth.currentUser?.uid!==user.uid)return;
  window.duroodWazaif?.setMember?.(profile);
  const owner=profile.role==="owner";

    (!owner && profile.gender==="female"?"female":"male");
  const opening=!currentProfile || window.duroodCurrentSide!==side;
  if(opening){
    window.duroodCurrentSide=side;
    window.duroodChatRows=[];
    currentProfile=profile;
    tasbihSync.start(profile.uid);
    bridge.enter(profile,[profile],{});
    bridge.recoverPending(tasbihSync.byDay("_durood_"));
    tasbihSync.schedule(0);
    void loadPrivateQaza(profile);
    observeCounters(side);
    if(window.parent!==window)window.parent.postMessage({type:"durood-classic-ready",uid:profile.uid},location.origin);
  }
  const docs=new Map([[profile.uid,profile]]);
  if(owner){
    const snap=await getDocs(collection(db,"members"));
    window.duroodOwnerInviteTotal=0;
    for(const x of snap.docs){
      if(x.id===profile.uid)continue;
      const data={...x.data(),uid:x.id};
      const gender=data.gender==="female"?"female":"male";
      if(gender!==side)continue;
      docs.set(x.id,data);
      if(data.inviterUid===profile.uid)window.duroodOwnerInviteTotal++;
    }
  }else{
    window.duroodOwnerInviteTotal=0;

      where("inviterUid","==",profile.uid),where("gender","==",side),limit(200)));
    invited.docs.forEach(x=>{
      const d={...x.data(),uid:x.id};

      Number(b.get("total")||0)-Number(a.get("total")||0)).slice(0,10);
    await Promise.all(top.map(async item=>{
      if(!docs.has(item.id)){
        const member=await getDoc(doc(db,"members",item.id));

    });

    (d.gender==="female"?"female":"male")===side).map(d=>({

      memberNumber:d.memberNumber,sideNumber:d.sideNumber,deleted:d.deleted===true,

onAuthStateChanged(auth,async user=>{

    stopMemberLoginWatch();stopGoalWatch();goalWatchUid="";stopCounters();
    // The parent owns the active logout; never copy its cached user back.
    if(window.parent===window&&!classicSigningOut){
      if(user)try{await firebaseSignOut(auth);}catch(error){console.warn("Logout restoration blocked",error?.code||error);}
      window.location.replace("/");
    }
    return;
  }
  if(!user){
    stopMemberLoginWatch();stopGoalWatch();goalWatchUid="";
    stopCounters();
    if(window.parent!==window){
      // The parent may have just signed in while this fresh iframe still
      // reads old Auth storage. Copy the same already-verified Firebase user;
      // never redirect the parent to its login page.
      const parentUser=window.parent.duroodParentAuthUser?.();
      if(parentUser && window.parent.duroodVerifiedProfile?.(parentUser.uid)){
        try{
          if(classicLogoutBlocked())return;
          await updateCurrentUser(auth,parentUser);
          if(classicLogoutBlocked())await firebaseSignOut(auth);
          return;
        }
        catch(error){console.warn("Classic auth synchronization",error?.code||error);}
      }
      window.parent.postMessage({type:"durood-classic-auth-pending"},location.origin);
    }else window.location.replace("/");
    return;
  }
  try{await hydrate();}
  catch(err){
    console.error("Classic Firebase dashboard",err);
    if(currentProfile && auth.currentUser?.uid===currentProfile.uid){bridge.notice(errorText(err));return;}
    if(window.parent!==window){
      window.parent.postMessage({type:"durood-classic-error"},location.origin);

    document.getElementById("app").innerHTML='<main style="padding:28px;max-width:580px;margin:auto"><h2>Firebase Account</h2><p>Dashboard could not load: '+errorText(err).replace(/[<>&]/g,"")+'</p><a href="/">Return to sign in</a></main>';
  }
});

    const d=new FormData(form),amount=Number(d.get("amount")),day=String(d.get("day")||"");
    if(day!==globalDay()){
      bridge.status("manual-feedback","آف لائن درود صرف آج کی تاریخ میں شامل ہو سکتا ہے۔ دوبارہ فارم کھولیں۔");return;
    }
    if(!Number.isSafeInteger(amount)||amount<1||amount>10000){
      bridge.status("manual-feedback","1 تا 10000 تعداد درج کریں۔");return;
    }
    const button=form.querySelector('button[type="submit"],button:not([type])');
    if(button)button.disabled=true;
    readingsSpark(amount,day).then(()=>bridge.manual(form,d))
      .catch(e=>bridge.status("manual-feedback",errorText(e),false))
      .finally(()=>{if(button?.isConnected)button.disabled=false;});
  }else if(form.id==="profile-form"){
    event.preventDefault();event.stopImmediatePropagation();
    const name=String(new FormData(form).get("name")||"").trim();
    const selection=bridge.photoSelection();
    const button=form.querySelector('button[type="submit"],button:not([type])');
    if(button?.disabled)return;
    if(button)button.disabled=true;
    const uid=auth.currentUser?.uid;
    Promise.resolve(selection?.task).then(async image=>{
      if(!uid||auth.currentUser?.uid!==uid)throw Error("دوبارہ لاگ اِن کریں۔");
      if(selection && (!image || selection.uid!==uid))throw Error("تصویر دوبارہ منتخب کریں۔");
      if(image){
        const batch=writeBatch(db);
        if(name!==bridge.currentName()){
          if(name.length<2||name.length>60)throw Error("نام 2 تا 60 حروف میں لکھیں۔");
          batch.update(doc(db,"members",uid),{name,updatedAt:serverTimestamp()});
        }
        batch.set(doc(db,"memberPhotos",uid),{image});
        await batch.commit();
        const confirmed=await getDocFromServer(doc(db,"memberPhotos",uid));
        if(!confirmed.exists()||confirmed.data().image!==image)throw Error("تصویر Firebase میں تصدیق نہیں ہوئی؛ دوبارہ کوشش کریں۔");
      }else await profileNameSpark(name);
      if(auth.currentUser?.uid===uid)bridge.setName(name,image,selection);
    }).catch(e=>bridge.status("profile-feedback",errorText(e),false))
      .finally(()=>{if(button?.isConnected)button.disabled=false;});
  }else if(form.id==="password-form"){
    event.preventDefault();event.stopImmediatePropagation();
    const d=new FormData(form),old=String(d.get("old")||""),next=String(d.get("password")||""),confirm=String(d.get("confirm")||"");
    if(next.length<8||next!==confirm){bridge.status("password-feedback","نئے پاس ورڈ اور تصدیق کو چیک کریں۔");return;}
    reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(auth.currentUser.email,old))
      .then(()=>updatePassword(auth.currentUser,next))
      .then(()=>{form.reset();bridge.status("password-feedback","Firebase پاس ورڈ تبدیل ہو گیا۔",true);})
      .catch(e=>bridge.status("password-feedback",errorText(e),false));
  }
},true);
</script>
</body>
</html>
